      function defaultProfile() {
        return { totalXp: 0, level: 1, streak: 0, lastActiveDate: null, sessionsPlayed: 0, bestAccuracy: 0 }
      }

      function currentDateKey(d) {
        const date = d instanceof Date ? d : new Date()
        const y = date.getFullYear()
        const m = String(date.getMonth() + 1).padStart(2, "0")
        const day = String(date.getDate()).padStart(2, "0")
        return `${y}-${m}-${day}`
      }

      function dateKeyOffset(days) {
        const d = new Date()
        d.setDate(d.getDate() + days)
        return currentDateKey(d)
      }

      function levelFromXp(totalXp) {
        const xp = Math.max(0, Number(totalXp) || 0)
        let level = 1
        for (let i = 0; i < XP_LEVEL_THRESHOLDS.length; i += 1) {
          if (xp >= XP_LEVEL_THRESHOLDS[i]) level = i + 1
        }
        return Math.min(level, XP_LEVEL_THRESHOLDS.length)
      }

      function normalizeProfile(raw) {
        const base = defaultProfile()
        if (!raw || typeof raw !== "object") return base

        const totalXp = Math.max(0, Number(raw.totalXp) || 0)
        const streak = Math.max(0, Number(raw.streak) || 0)
        const sessionsPlayed = Math.max(0, Number(raw.sessionsPlayed) || 0)
        const bestAccuracy = Math.max(0, Math.min(100, Number(raw.bestAccuracy) || 0))
        const lastActiveDate = typeof raw.lastActiveDate === "string" ? raw.lastActiveDate : null

        return {
          totalXp,
          level: levelFromXp(totalXp),
          streak,
          lastActiveDate,
          sessionsPlayed,
          bestAccuracy
        }
      }

      function loadProfile() {
        try {
          const raw = localStorage.getItem(PROFILE_STORAGE_KEY)
          if (!raw) return defaultProfile()
          return normalizeProfile(JSON.parse(raw))
        } catch {
          return defaultProfile()
        }
      }

      function saveProfile(profile) {
        try {
          localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile))
        } catch {}
      }

      function defaultProgressState() {
        return { version: 1, profile: defaultProfile(), roadmapCompleted: {}, vocabProgress: {}, roadmapLevelXp: {} }
      }

      function normalizeRoadmapCompleted(raw) {
        if (!raw || typeof raw !== "object") return {}
        const out = {}
        for (const [levelKey, levelMap] of Object.entries(raw)) {
          if (!levelMap || typeof levelMap !== "object") continue
          const inner = {}
          for (const [id, value] of Object.entries(levelMap)) {
            if (value) inner[String(id)] = true
          }
          if (Object.keys(inner).length) out[String(levelKey)] = inner
        }
        return out
      }

      function normalizeVocabProgress(raw) {
        if (!raw || typeof raw !== "object") return {}
        const out = {}
        for (const [key, value] of Object.entries(raw)) {
          if (!value || typeof value !== "object") continue
          const seen = Math.max(0, Number(value.seen) || 0)
          const correct = Math.max(0, Number(value.correct) || 0)
          const wrong = Math.max(0, Number(value.wrong) || 0)
          const mastered = Boolean(value.mastered) || correct >= 3
          const lastSeenDate = typeof value.lastSeenDate === "string" ? value.lastSeenDate : null
          out[String(key)] = { seen, correct, wrong, mastered, lastSeenDate }
        }
        return out
      }

      function normalizeRoadmapLevelXp(raw) {
        if (!raw || typeof raw !== "object") return {}
        const out = {}
        for (const [levelKey, value] of Object.entries(raw)) {
          out[String(levelKey)] = Math.max(0, Number(value) || 0)
        }
        return out
      }

      function normalizeProgressState(raw) {
        const base = defaultProgressState()
        if (!raw || typeof raw !== "object") return base
        return {
          version: 1,
          profile: normalizeProfile(raw.profile),
          roadmapCompleted: normalizeRoadmapCompleted(raw.roadmapCompleted),
          vocabProgress: normalizeVocabProgress(raw.vocabProgress),
          roadmapLevelXp: normalizeRoadmapLevelXp(raw.roadmapLevelXp)
        }
      }

      function saveProgressState(progress) {

              roadmapCompleted: progress.roadmapCompleted,
              vocabProgress: progress.vocabProgress,
              roadmapLevelXp: progress.roadmapLevelXp
            })
          )
        } catch {}
        saveProfile(progress.profile)
      }

      function loadProgressState() {
        try {
          const raw = localStorage.getItem(PROGRESS_STORAGE_KEY)
          if (raw) return normalizeProgressState(JSON.parse(raw))
        } catch {}

        const legacyProfile = loadProfile()
        const migrated = defaultProgressState()
        migrated.profile = legacyProfile
        saveProgressState(migrated)
        return migrated
      }

      function profileMinXpForLevel(level) {
        const idx = Math.max(1, Math.min(XP_LEVEL_THRESHOLDS.length, Number(level) || 1)) - 1
        return XP_LEVEL_THRESHOLDS[idx] ?? 0
      }

      function profileNextXpTarget(level) {
        const idx = Math.max(1, Math.min(XP_LEVEL_THRESHOLDS.length, Number(level) || 1)) - 1
        const next = XP_LEVEL_THRESHOLDS[idx + 1]
        return typeof next === "number" ? next : null
      }

      function markProfileActive(profile) {
        const today = currentDateKey(new Date())
        if (profile.lastActiveDate === today) return false
        const yesterday = dateKeyOffset(-1)
        const wasYesterday = profile.lastActiveDate === yesterday
        profile.streak = wasYesterday ? (Math.max(0, Number(profile.streak) || 0) + 1) : 1
        profile.lastActiveDate = today
        return true
      }

      function addXp(profile, delta) {
        const next = Math.max(0, (Number(profile.totalXp) || 0) + (Number(delta) || 0))
        if (next === profile.totalXp) return false
        profile.totalXp = next
        profile.level = levelFromXp(next)
        return true
      }

      function addRoadmapLevelXp(levelKey, delta) {
        if (!levelKey) return false
        if (!state.roadmapLevelXp || typeof state.roadmapLevelXp !== "object") state.roadmapLevelXp = {}
        const current = Math.max(0, Number(state.roadmapLevelXp[levelKey]) || 0)
        const next = Math.max(0, current + (Number(delta) || 0))
        if (next === current) return false
        state.roadmapLevelXp[levelKey] = next
        return true
      }

      function roadmapLevelXp(levelKey) {
        return Math.max(0, Number(state.roadmapLevelXp?.[levelKey]) || 0)
      }

      function registerSession(profile, accuracy) {
        profile.sessionsPlayed = Math.max(0, Number(profile.sessionsPlayed) || 0) + 1
        profile.bestAccuracy = Math.max(profile.bestAccuracy || 0, Number(accuracy) || 0)
      }

        const cleaned = String(name || "").trim()
        if (!cleaned) return "NJ"
        const parts = cleaned.split(/\s+/g).filter(Boolean)
        const letters = parts.slice(0, 2).map((part) => part[0] || "")
        return (letters.join("") || cleaned.slice(0, 2)).toUpperCase()

        return String(value)

          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;")
      }


      function normalizeKana(input) {
        const s = String(input || "")
        let out = ""
        for (let i = 0; i < s.length; i += 1) {
          const code = s.charCodeAt(i)
          if (code >= 0x30a1 && code <= 0x30f6) {
            out += String.fromCharCode(code - 0x60)
            continue
          }
          out += s[i]
        }
        return out
      }

      function geminatePrefix(romaji) {
        if (!romaji) return ""
        if (/^[aeiou]/.test(romaji)) return ""
        if (romaji.startsWith("ch")) return "t"
        return romaji[0]
      }

      function kanaToRomaji(input) {
        const s = normalizeKana(input)
        let out = ""
        let geminate = false

        for (let i = 0; i < s.length; i += 1) {
          const ch = s[i]

          if (ch === "っ") {
            geminate = true
            continue
          }

          if (ch === "ー") {
            const lastVowel = out.match(/[aeiou](?!.*[aeiou])/)
            if (lastVowel) out += lastVowel[0]
            continue
          }

          const digraph = i + 1 < s.length ? s.slice(i, i + 2) : ""
          let next = digraph && ROMAJI_DIGRAPHS[digraph] ? ROMAJI_DIGRAPHS[digraph] : null
          if (next) i += 1
          if (!next) next = ROMAJI_BASE[ch] ?? ch

          if (geminate) {
            out += geminatePrefix(next)
            geminate = false
          }

          out += next
        }

        return out
      }

      function extractKanaFromCorrectText(value) {
        const s = String(value || "")
        const match = s.match(/\(([^)]+)\)/)
        if (match && match[1]) return match[1].trim()
        return s.trim()
      }

      function extractHeadText(value) {
        const s = String(value || "")
        const idx = s.indexOf("(")
        if (idx === -1) return s.trim()
        return s.slice(0, idx).trim()
      }

      function buildAnswerExplanation(q, correctText) {
        const correctAnswer = String(correctText || "")
        const kana = extractKanaFromCorrectText(correctAnswer)
        const romaji = kana ? kanaToRomaji(kana) : ""
        const meaningId = ANSWER_MEANING_ID[kana] ?? ""
        let exampleJp = ""
        let exampleId = ""

        if (q?.type === "particle" || q?.type === "pattern") {
          exampleJp = String(q?.prompt?.primary || "").replace("（　）", kana)
        } else if (q?.type === "story") {
          exampleJp = String(q?.prompt?.primary || "")
        } else if (q?.type === "reading" || q?.type === "kanji") {
          const head = extractHeadText(correctAnswer)
          if (head && kana) {
            exampleJp = `「${head}」は「${kana}」です。`
            exampleId = `“${head}” dibaca “${romaji}”.`
          }
        }

        return {
          correctAnswer,
          romaji,
          meaningId,
          exampleJp,
          exampleId
        }
      }

        return list
          .map((s) => String(s).trim())
          .filter(Boolean)
          .map((s) => {
            const parts = s.split("|")
            return { kanji: parts[0] ?? "", kana: parts[1] ?? "" }
          })
          .filter((x) => x.kanji && x.kana)
      }

      function shuffle(arr) {
        const a = [...arr]
        for (let i = a.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1))
          const tmp = a[i]
          a[i] = a[j]
          a[j] = tmp
        }
        return a
      }

      function pickDistinctIndices(poolLength, count, excludedIndex) {
        const indices = []
        while (indices.length < count) {
          const next = Math.floor(Math.random() * poolLength)
          if (next === excludedIndex) continue
          if (indices.includes(next)) continue
          indices.push(next)
        }
        return indices
      }

        const correctOptionId = options.find((o) => o.text === item.kana)?.id ?? "A"

          options,

        }

      function makeKanjiQuestion(levelKey, item, itemIndex, index) {
        const level = levels[levelKey]
        const vocab = level.vocab
        const distractorIndices = pickDistinctIndices(vocab.length, 2, itemIndex)
        const choices = [item.kanji, ...distractorIndices.map((i) => vocab[i].kanji)]
        const shuffled = shuffle(choices)
        const letters = ["A", "B", "C"]
        const options = shuffled.map((t, i) => ({ id: letters[i], text: t }))
        const correctOptionId = options.find((o) => o.text === item.kanji)?.id ?? "A"
        return {
          id: `${levelKey}-kanji-${String(index + 1).padStart(4, "0")}`,
          type: "kanji",
          typeLabel: "かんじ / Kanji",
          vocabRef: { levelKey, index: itemIndex },
          prompt: { primary: item.kana, secondary: "Pilih bentuk kanji yang benar" },
          questionText: `「${item.kana}」を かんじで かくと どれですか。`,
          questionSub: "Cari bentuk kanji yang sesuai dengan bacaan di atas.",
          options,
          correctOptionId,
          feedbackCorrect: `${item.kanji} (${item.kana})`
        }
      }

      function makeNarabiQuestion(levelKey, entry, index) {
        const shuffledWords = shuffle([...entry.words])
        const starPos = shuffledWords.indexOf(entry.a)
        const wordDisplay = shuffledWords.map((w, i) => `${i + 1}  ${w}`).join("　　")
        const slotDisplay = shuffledWords.map((w, i) => {
          if (i === starPos) return `★`
          return `＿${i + 1}＿`
        }).join("　")
        const promptText = entry.s.replace(/＿＿ ★ ＿＿ ＿＿|＿＿ ＿＿ ★ ＿＿|＿＿ ★ ＿＿|★/, slotDisplay)
        const correctNumber = String(starPos + 1)
        const letters = ["A", "B", "C", "D"]
        const options = shuffledWords.map((w, i) => ({ id: letters[i], text: String(i + 1) }))
        const correctOptionId = letters[starPos]
        return {
          id: `${levelKey}-narabi-${String(index + 1).padStart(4, "0")}`,
          type: "narabi",
          typeLabel: "ならびかえ / Urutan Kata",
          prompt: { primary: promptText, secondary: wordDisplay },

          options,
          correctOptionId,
          feedbackCorrect: correctNumber
        }

      function buildQuestionPool(levelKey) {
        const level = levels[levelKey]
        const pool = []
        for (let i = 0; i < level.vocab.length; i += 1) {
          pool.push(makeReadingQuestion(levelKey, level.vocab[i], i, pool.length))
          pool.push(makeKanjiQuestion(levelKey, level.vocab[i], i, pool.length))
        }
        for (let i = 0; i < level.particleBank.length; i += 1) {
          pool.push(makeParticleQuestion(levelKey, level.particleBank[i], pool.length))
        }
        for (let i = 0; i < level.patternBank.length; i += 1) {
          pool.push(makePatternQuestion(levelKey, level.patternBank[i], pool.length))
        }
        for (let i = 0; i < level.storyBank.length; i += 1) {
          pool.push(makeStoryQuestion(levelKey, level.storyBank[i], pool.length))
          pool.push(makeStoryQuestion(levelKey, level.storyBank[i], pool.length))
        }
        if (level.narabiBank) {
          for (let i = 0; i < level.narabiBank.length; i += 1) {
            pool.push(makeNarabiQuestion(levelKey, level.narabiBank[i], pool.length))
            pool.push(makeNarabiQuestion(levelKey, level.narabiBank[i], pool.length))
          }
        }
        if (level.synonymBank) {
          for (let i = 0; i < level.synonymBank.length; i += 1) {
            pool.push(makeSynonymQuestion(levelKey, level.synonymBank[i], pool.length))
            pool.push(makeSynonymQuestion(levelKey, level.synonymBank[i], pool.length))
          }
        }
        return pool
      }

      function syncN5RoadmapCompletionFromN5Xp() {
        const milestones = n5RoadmapMilestones()
        const xp = roadmapLevelXp("n5")
        const levelKey = "n5"
        if (!state.roadmapCompleted || typeof state.roadmapCompleted !== "object") state.roadmapCompleted = {}
        const prev = state.roadmapCompleted[levelKey] && typeof state.roadmapCompleted[levelKey] === "object"
          ? state.roadmapCompleted[levelKey]
          : {}
        const next = {}
        for (let i = 0; i < milestones.length; i += 1) {
          if (xp >= milestones[i].targetXp) next[String(i)] = true
        }
        const prevKeys = Object.keys(prev)
        const nextKeys = Object.keys(next)
        const changed = prevKeys.length !== nextKeys.length || nextKeys.some((key) => !prev[key])
        state.roadmapCompleted[levelKey] = next
        return changed
      }

      function questionLevelKey(q) {
        if (!q || typeof q !== "object") return state.levelKey
        const refLevelKey = q?.vocabRef?.levelKey
        if (refLevelKey) return refLevelKey
        const id = String(q.id || "")
        const match = id.match(/^([^-]+)-/)
        return match?.[1] || state.levelKey
      }

      function activeSessionPreviewXp() {
        if (state.screen !== "quiz") return 0
        if (state.mode !== "normal") return 0
        if (!state.sessionQuestions.length || state.lastResult) return 0
        return Math.max(0, Number(state.sessionEarnedXp) || 0)
      }

      function trackVocabProgressFromAnswer(q, isCorrect) {
        const ref = q?.vocabRef
        if (!ref) return false
        const key = `${ref.levelKey}:${ref.index}`
        const existing = state.vocabProgress?.[key]
        const next = existing && typeof existing === "object"
          ? { ...existing }
          : { seen: 0, correct: 0, wrong: 0, mastered: false, lastSeenDate: null }
        next.seen = Math.max(0, Number(next.seen) || 0) + 1
        if (isCorrect) next.correct = Math.max(0, Number(next.correct) || 0) + 1
        else next.wrong = Math.max(0, Number(next.wrong) || 0) + 1
        next.mastered = Boolean(next.mastered) || (next.correct >= 3)
        next.lastSeenDate = currentDateKey(new Date())
        if (!state.vocabProgress || typeof state.vocabProgress !== "object") state.vocabProgress = {}
        state.vocabProgress[key] = next
        return true
      }

      function levelProgressData() {
        const xp = (Number(state.profile.totalXp) || 0) + activeSessionPreviewXp()
        const level = levelFromXp(xp)
        const minXp = profileMinXpForLevel(level)
        const nextXp = profileNextXpTarget(level)
        const pct = nextXp ? Math.round(((xp - minXp) / Math.max(1, nextXp - minXp)) * 100) : 100
        return {
          xp,
          level,
          minXp,
          nextXp,
          pct: Math.max(0, Math.min(100, pct)),
          xpNeeded: nextXp ? Math.max(0, nextXp - xp) : 0
        }
      }

      function getResultMetrics() {
        const total = state.sessionQuestions.length

        const accuracy = total ? Math.round((correctCount / total) * 100) : 0
        return { total, maxScore, correctCount, wrongCount, accuracy }

      function n5RoadmapSectionHtml() {
        const xp = state.profile.totalXp
        const milestones = n5RoadmapMilestones()
        const persistedCompleted = state.roadmapCompleted?.n5 || {}
        const finalTarget = milestones[milestones.length - 1]?.targetXp || 1
        const overallPct = Math.max(0, Math.min(100, Math.round((xp / finalTarget) * 100)))
        const completedCount = milestones.reduce((acc, item, index) => acc + ((xp >= item.targetXp || persistedCompleted[String(index)]) ? 1 : 0), 0)

        const itemsHtml = milestones.map((item, index) => {
          const prevTarget = index === 0 ? 0 : milestones[index - 1].targetXp
          const isComplete = xp >= item.targetXp || persistedCompleted[String(index)]
          const isCurrent = !isComplete && xp >= prevTarget
          const pct = isComplete
            ? 100
            : xp <= prevTarget
              ? 0
              : Math.round(((xp - prevTarget) / Math.max(1, item.targetXp - prevTarget)) * 100)

          const statusLabel = isComplete ? "Completed" : isCurrent ? "Current" : "Locked"
          const statusClass = isComplete ? "status-pill--success" : isCurrent ? "status-pill--info" : "status-pill--warning"
          const rowClass = isComplete ? "is-complete" : isCurrent ? "is-current" : "is-locked"
          const segmentCurrent = Math.min(Math.max(0, xp - prevTarget), item.targetXp - prevTarget)

          return `

              <div class="roadmap-marker" aria-hidden="true">

      function recordWrong(q, selectedText, correctText) {
        const existing = state.wrongList.find((item) => item.qId === q.id)
        if (!existing) {
          state.wrongList.push({ qId: q.id, q, selectedText, correctText, count: 1 })
          return
        }
        existing.count += 1
        existing.selectedText = selectedText
        existing.correctText = correctText
      }

      function buildWrongReviewQuestions() {
        const base = state.savedWrongList.length ? state.savedWrongList : state.wrongList
        const uniq = []
        const seen = new Set()
        for (const item of base) {
          const id = item.q?.id
          if (!id || seen.has(id)) continue
          seen.add(id)
          uniq.push(item.q)
        }
        return shuffle(uniq)
      }

      function buildSessionQuestions() {
        const pool = buildQuestionPool(state.levelKey)
        const size = Math.min(Math.max(SESSION_SIZE_TARGET, 100), 200)
        const shuffled = shuffle(pool)
        if (shuffled.length >= size) return shuffled.slice(0, size)
        const out = []
        while (out.length < size) {
          out.push(shuffled[out.length % shuffled.length])
        }
        return out
      }

              ${metricCardHtml("Latest Accuracy", `${formatNumber(result.accuracy)}%`, "Akurasi dari sesi terakhir yang tersimpan di memori aplikasi.")}
              ${metricCardHtml("Latest Score", formatNumber(state.score), "Skor terbaru yang bisa langsung dibandingkan dengan sesi berikutnya.")}
              ${metricCardHtml("Review Items", formatNumber(result.wrongCount), "Jumlah jawaban salah yang siap direview setelah sesi selesai.")}
            </div>
          </section>

          <section class="surface-card">
            <div class="surface-card__header">
              <div>
                <p class="section-caption">Achievement Library</p>
                <h2 class="section-title">Reusable reward cards</h2>
                <p class="section-note">Komponen ini bisa dipakai ulang di dashboard, results, maupun progress screen.</p>
              </div>
            </div>
            <div class="achievement-grid">${achievementCards}</div>
          </section>
        `
      }

      function syncN5RoadmapCompletionFromXp() {
        const milestones = n5RoadmapMilestones()
        const xp = state.profile.totalXp
        const levelKey = "n5"
        if (!state.roadmapCompleted || typeof state.roadmapCompleted !== "object") state.roadmapCompleted = {}
        if (!state.roadmapCompleted[levelKey] || typeof state.roadmapCompleted[levelKey] !== "object") {
          state.roadmapCompleted[levelKey] = {}
        }
        const map = state.roadmapCompleted[levelKey]
        let changed = false
        for (let i = 0; i < milestones.length; i += 1) {
          if (xp >= milestones[i].targetXp && !map[String(i)]) {
            map[String(i)] = true
            changed = true
          }
        }
        return changed
      }
      function render() {
        renderTopbar()
        renderSidebar()
        renderBottomNav()
        renderScreenBanner()
        setDocumentTitle()

        if (state.screen === "home") {
          renderHome()
          return
        }

        if (state.screen === "vocabulary") {
          renderVocabulary()
          return
        }

        if (state.screen === "quiz") {
          renderQuiz()
          return
        }

        if (state.screen === "wrongList") {
          renderWrongList()
          return
        }

        if (state.screen === "progress") {
          renderProgress()
          return
        }

        renderResult()
      }

      function completeSessionIfNeeded() {
        const result = getResultMetrics()
        state.lastResult = result
        if (state.mode !== "reviewWrong" && state.sessionEarnedXp) {
          const xpChanged = addXp(state.profile, state.sessionEarnedXp)
          if (xpChanged) syncN5RoadmapCompletionFromXp()
        }
        if (shouldTrackSessionProgression()) registerSession(state.profile, result.accuracy)
        state.sessionEarnedXp = 0
        persistProgress()
      }

      function rollbackActiveSessionXp() {
        if (state.mode !== "normal") return false
        if (!state.sessionQuestions.length || state.lastResult) return false
        if (!state.sessionEarnedXp) return false
        state.sessionEarnedXp = 0
        return true
      }

      function resetGame() {
        rollbackActiveSessionXp()
        state.screen = "home"
        state.mode = "normal"
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        state.savedWrongList = []
        state.sessionQuestions = []
        state.lastResult = null
        render()
      }

      function startGame() {
        markProfileActive(state.profile)
        syncN5RoadmapCompletionFromXp()
        persistProgress()
        state.screen = "quiz"
        state.mode = "normal"
        state.sessionQuestions = buildSessionQuestions()
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        state.savedWrongList = []
        state.lastResult = null
        render()
      }

      function startWrongReview() {
        const base = state.savedWrongList.length ? state.savedWrongList : state.wrongList
        if (!base.length) {
          state.screen = "wrongList"
          render()
          return
        }
        markProfileActive(state.profile)
        syncN5RoadmapCompletionFromXp()
        persistProgress()
        state.mode = "reviewWrong"
        state.screen = "quiz"
        state.sessionQuestions = buildWrongReviewQuestions()
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        render()
      }

      function restartSession() {
        if (state.mode === "reviewWrong") {
          startWrongReview()
          return
        }
        rollbackActiveSessionXp()
        startGame()
      }

      function goToScreen(screen) {
        if (screen === "quiz" && !state.sessionQuestions.length) {
          state.screen = "quiz"
          render()
          return
        }
        state.screen = screen
        render()
      }

      function onAnswer(optionId) {
        const q = currentQuestion()
        if (!q) return
        const streakChanged = markProfileActive(state.profile)

        const correctOpt = q.options.find((o) => o.id === q.correctOptionId)
        const selectedOpt = q.options.find((o) => o.id === optionId)
        const isCorrect = optionId === q.correctOptionId
        const correctText = q.feedbackCorrect ?? correctOpt?.text ?? ""

        const vocabChanged = trackVocabProgressFromAnswer(q, isCorrect)
        let shouldPersist = streakChanged || vocabChanged

        if (isCorrect) {
          state.score += POINTS_PER_CORRECT
          if (state.mode !== "reviewWrong") {
            state.sessionEarnedXp += POINTS_PER_CORRECT
          }
        } else {
          recordWrong(q, selectedOpt?.text ?? "", correctText)
          shouldPersist = true
        }

        state.feedback = {
          isCorrect,
          selectedId: selectedOpt?.id ?? optionId,
          correctId: q.correctOptionId,
          correctText,
          explanation: buildAnswerExplanation(q, correctText)
        }

        if (shouldPersist) persistProgress()
        render()
      }

      function next() {
        state.feedback = null
        if (state.questionIndex >= state.sessionQuestions.length - 1) {
          completeSessionIfNeeded()
          state.screen = "result"
          render()
          return
        }
        state.questionIndex += 1
        render()
      }

      function handleAction(el) {
        const action = el.getAttribute("data-action")
        if (!action) return

        if (action === "pick-level") {
          const key = el.getAttribute("data-level")
          if (!key || !levels[key]) return
          state.levelKey = key
          render()
          return
        }

        if (action === "navigate") {
          const screen = el.getAttribute("data-screen")
          if (!screen) return
          goToScreen(screen)
          return
        }

        if (action === "start") {
          startGame()
          return
        }

        if (action === "restart") {
          restartSession()
          return
        }

        if (action === "reset") {
          resetGame()
          return
        }

        if (action === "answer") {
          if (state.feedback) return
          const optionId = el.getAttribute("data-option-id")
          if (!optionId) return
          onAnswer(optionId)
          return
        }

        if (action === "next") {
          next()
          return
        }

        if (action === "wrong-list") {
          if (state.wrongList.length) state.savedWrongList = [...state.wrongList]
          state.screen = "wrongList"
          render()
          return
        }

        if (action === "review-wrong") {
          if (!state.savedWrongList.length && state.wrongList.length) {
            state.savedWrongList = [...state.wrongList]
          }
          startWrongReview()
          return
        }

        if (action === "back-result") {
          state.screen = "result"
          render()
        }
      }

      function bindActionRoot(root) {
        root.addEventListener("click", (event) => {
          const el = event.target instanceof Element ? event.target.closest("[data-action]") : null
          if (!el) return
          handleAction(el)
        })
      }

      bindActionRoot(app)
      bindActionRoot(sidebar)
      bindActionRoot(bottomNav)
      bindActionRoot(screenBanner)

      setBrand()
      if (syncN5RoadmapCompletionFromXp()) persistProgress()
      render()
    </script>
  </body>
</html>
