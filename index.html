            { q: `彼女は仕事に（　）、私生活も充実させている。`, choices: [`対して`, `つき`, `おいて`, `加え`], a: 3, explanation: `Pola '～に加え' berarti 'selain itu/ditambah dengan': 仕事に加え、私生活も充実させている (selain pekerjaan, kehidupan pribadinya juga dijalani dengan baik).`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この新技術は業界に革命を（　）と言われている。`, choices: [`うける`, `もたらす`, `あげる`, `つくる`], a: 1, explanation: `もたらす berarti 'mendatangkan': 革命をもたらす (membawa revolusi bagi industri).`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼は自分の過ちを（　）認めた。`, choices: [`しぶしぶ`, `しつこく`, `潔く`, `きっぱりと`], a: 2, explanation: `潔く認めた berarti 'mengakui dengan tegas dan legawa (tanpa ragu/malu)', cocok untuk sikap mengakui kesalahan secara terbuka dan jantan.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この問題に対する彼の対応は（　）適切だった。`, choices: [`もっぱら`, `いっそ`, `あくまで`, `おおむね`], a: 3, explanation: `おおむね berarti 'pada umumnya/secara garis besar', cocok untuk menyatakan penilaian keseluruhan yang cukup baik meski mungkin ada sedikit kekurangan.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼女はその仕事を（　）に引き受けた。`, choices: [`かろうじて`, `快く`, `ようやく`, `しぶしぶ`], a: 1, explanation: `快くに引き受けた berarti 'menerima dengan senang hati/tanpa keberatan'.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この説明では、聞いている人が（　）混乱するだけだ。`, choices: [`かえって`, `せめて`, `とにかく`, `せいぜい`], a: 0, explanation: `かえって berarti 'malah/justru sebaliknya (dari yang diharapkan)': penjelasan ini justru hanya membuat pendengar bingung, bukannya menjadi lebih jelas.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼の説明はあいまいだった。`, choices: [`彼の説明ははっきりしなかった。`, `彼の説明ははっきりしていた。`, `彼の説明は長かった。`, `彼の説明は詳しかった。`], a: 0, explanation: `あいまい (ambigu) sepadan dengan はっきりしなかった (tidak jelas). はっきりしていた (jelas) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この計画は資金不足のため中止せざるを得なかった。`, choices: [`この計画は最初から実行不可能だった。`, `この計画は資金不足のため中止するしかなかった。`, `この計画は資金不足でも続けられた。`, `この計画は資金があったので続いた。`], a: 1, explanation: `～ざるを得なかった (terpaksa harus) sepadan dengan ～するしかなかった (tidak ada pilihan selain). Ini bukan berarti sejak awal mustahil dilaksanakan, melainkan terpaksa dihentikan karena kondisi tertentu (kekurangan dana).`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女はその案に一貫して反対だった。`, choices: [`彼女はその案に最初だけ反対していた。`, `彼女はその案に迷っていた。`, `彼女はその案に途中から賛成した。`, `彼女はその案にずっと反対していた。`], a: 3, explanation: `一貫して反対 (konsisten menentang sejak awal sampai akhir) sepadan dengan ずっと反対していた (menentang terus-menerus). Bukan hanya di awal atau berubah di tengah jalan.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この結果は努力の賜物だ。`, choices: [`この結果は運が良かっただけだ。`, `この結果は誰かに助けられたものだ。`, `この結果は努力によって得られたものだ。`, `この結果は偶然の産物だ。`], a: 2, explanation: `賜物 (buah/hasil dari) sepadan dengan 努力によって得られたもの (diperoleh berkat kerja keras). 偶然/運 (kebetulan/keberuntungan) justru berlawanan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼は周囲の反対をよそに計画を進めた。`, choices: [`彼は周囲の反対を気にせずに計画を進めた。`, `彼は周囲に相談してから計画を進めた。`, `彼は周囲の意見を聞いて計画を変更した。`, `彼は周囲の反対を受けて計画をやめた。`], a: 0, explanation: `をよそに (mengabaikan) sepadan dengan 気にせずに (tanpa peduli). 相談してから (setelah berkonsultasi) dan 聞いて (mendengarkan) justru berlawanan makna dengan sikap mengabaikan.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女はその知らせに呆然とした。`, choices: [`彼女はその知らせを予想していた。`, `彼女はその知らせを冷静に受け止めた。`, `彼女はその知らせに驚いて何も考えられなくなった。`, `彼女はその知らせに喜んだ。`], a: 2, explanation: `呆然とした (tercengang/terpaku) sepadan dengan 驚いて何も考えられなくなった (terkejut sampai tidak bisa berpikir). 冷静に受け止めた (menerima dengan tenang) justru berlawanan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼はその仕事を快く引き受けた。`, choices: [`彼はその仕事を断った。`, `彼はその仕事を気持ちよく引き受けた。`, `彼はその仕事をいやいや引き受けた。`, `彼はその仕事を無視した。`], a: 1, explanation: `快く引き受けた (menerima dengan senang hati) sepadan dengan 気持ちよく引き受けた (menerima dengan perasaan baik). いやいや (terpaksa) justru berlawanan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この地域の人口減少は深刻化している。`, choices: [`この地域の人口は増加している。`, `この地域の人口減少は改善されてきている。`, `この地域の人口は変わっていない。`, `この地域の人口減少はより深刻になってきている。`], a: 3, explanation: `深刻化している (semakin serius) sepadan dengan より深刻になってきている (menjadi semakin serius). 改善 (membaik) justru berlawanan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼は自分の過ちを潔く認めた。`, choices: [`彼は自分の間違いを他人のせいにした。`, `彼は自分の間違いに気づかなかった。`, `彼は自分の間違いをなかなか認めなかった。`, `彼は自分の間違いをすぐに、はっきりと認めた。`], a: 3, explanation: `潔く認めた (mengakui dengan tegas/legawa) sepadan dengan すぐに、はっきりと認めた (segera dan jelas mengakuinya). なかなか認めなかった (tidak kunjung mengaku) justru berlawanan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この問題は見かけほど単純ではない。`, choices: [`この問題は誰にでも解決できる。`, `この問題は見た目どおり簡単だ。`, `この問題は見た目より複雑だ。`, `この問題はもう解決している。`], a: 2, explanation: `見かけほど単純ではない (tidak sesederhana penampilannya) sepadan dengan 見た目より複雑だ (lebih rumit dari penampilannya). 見た目どおり簡単だ (sederhana sesuai penampilan) justru berlawanan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女はその発言に矛盾を感じた。`, choices: [`彼女はその発言に納得した。`, `彼女はその発言が前後で食い違っていると感じた。`, `彼女はその発言に賛成した。`, `彼女はその発言を信じた。`], a: 1, explanation: `矛盾を感じた (merasakan kontradiksi) sepadan dengan 前後で食い違っていると感じた (merasa ada ketidaksesuaian antara pernyataan sebelum dan sesudahnya). 納得/賛成/信じた (setuju/percaya) berlawanan makna dengan curiga akan kontradiksi.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この会社は倒産の危機にある。`, choices: [`この会社はつぶれるかもしれない状態だ。`, `この会社は合併を計画している。`, `この会社はとても順調だ。`, `この会社は成長している。`], a: 0, explanation: `倒産の危機にある (dalam ambang kebangkrutan) sepadan dengan つぶれるかもしれない状態 (dalam kondisi mungkin akan bangkrut). 順調/成長している (berjalan baik/tumbuh) justru berlawanan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼はその案に慎重な態度を示した。`, choices: [`彼はその案に興味を示さなかった。`, `彼はその案にすぐ賛成した。`, `彼はその案に対して注意深い態度を取った。`, `彼はその案を無視した。`], a: 2, explanation: `慎重な態度 (sikap hati-hati) sepadan dengan 注意深い態度 (sikap cermat/berhati-hati). すぐ賛成した (langsung setuju) justru berlawanan makna dengan sikap hati-hati.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女は仕事のかたわら、ボランティア活動をしている。`, choices: [`彼女は仕事を優先し、ボランティアはしていない。`, `彼女は仕事の後にすぐ寝てしまう。`, `彼女は仕事を辞めてボランティアだけをしている。`, `彼女は仕事と並行してボランティア活動をしている。`], a: 3, explanation: `～のかたわら (sambil/di sela-sela) sepadan dengan 並行して (secara paralel/bersamaan). Bukan berarti berhenti kerja, atau sama sekali tidak melakukan volunteer.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼はその発言に強く反発した。`, choices: [`彼はその発言を理解できなかった。`, `彼はその発言に強く反対の態度を示した。`, `彼はその発言を気にしなかった。`, `彼はその発言に賛成した。`], a: 1, explanation: `強く反発した (menentang dengan keras) sepadan dengan 強く反対の態度を示した (menunjukkan sikap menentang dengan kuat). 賛成した (setuju) justru berlawanan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `【あくまで】`, choices: [`これはあくまで個人の意見であり、会社の方針ではありません。`, `あくまで、明日は雨が降るでしょう。`, `彼はあくまで有名な作家です。`, `この料理はあくまでおいしいです。`], a: 0, explanation: `あくまで berarti 'sampai akhir/murni sebagai' menegaskan batasan sesuatu: あくまで個人の意見 (murni sekadar pendapat pribadi, bukan kebijakan resmi). Tidak cocok untuk dugaan cuaca atau sekadar pujian kualitas.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【せざるを得ない】`, choices: [`彼は毎日運動をせざるを得ています。`, `せざるを得ないので、旅行に行きます。`, `この問題は簡単にせざるを得ます。`, `資金が不足しているため、計画を中止せざるを得なかった。`], a: 3, explanation: `せざるを得ない berarti 'terpaksa harus melakukan (meski tidak ingin)': 資金不足のため中止せざるを得なかった (terpaksa membatalkan karena kekurangan dana). Bentuk ini adalah pola tetap, tidak bisa diubah menjadi bentuk lain seperti せざるを得ています atau せざるを得ます.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【もたらす】`, choices: [`彼女は問題をもたらして解決しました。`, `この新技術は業界に大きな変化をもたらすだろう。`, `この料理は健康にもたらします。`, `彼は毎朝新聞をもたらします。`], a: 1, explanation: `もたらす berarti 'mendatangkan/membawa (dampak/hasil)': 変化をもたらす (mendatangkan perubahan). Tidak cocok dipakai untuk mengantar barang fisik seperti koran (harusnya 持ってくる).`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【かたわら】`, choices: [`この本はかたわらとても人気があります。`, `彼はかたわら、有名な作家になりました。`, `彼は会社員として働くかたわら、小説を書いている。`, `かたわら、明日は会議があります。`], a: 2, explanation: `かたわら berarti 'sambil menjalani aktivitas utama, di sela-sela': 会社員として働くかたわら、小説を書く (sambil bekerja sebagai karyawan, menulis novel).`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【呆然】`, choices: [`突然の知らせに、彼女はしばらく呆然としていた。`, `彼は呆然と仕事を進めています。`, `この計画は呆然と成功しました。`, `彼女は呆然と喜んでいます。`], a: 0, explanation: `呆然とする berarti 'tercengang/tidak bisa berpikir karena kaget': 突然の知らせに呆然としていた (terpaku karena kabar mendadak). Tidak cocok dipasangkan dengan aktivitas normal atau perasaan gembira.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【きっぱり】`, choices: [`彼女はきっぱりと悩んでいます。`, `彼はきっぱりとゆっくり歩いています。`, `彼はその誘いをきっぱりと断った。`, `この料理はきっぱりとおいしいです。`], a: 2, explanation: `きっぱり berarti 'dengan tegas': 誘いをきっぱりと断った (menolak ajakan dengan tegas). Tidak cocok dipakai untuk menggambarkan kebimbangan, kecepatan berjalan, atau rasa makanan.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【見極める】`, choices: [`この道を見極めてまっすぐ行ってください。`, `彼は問題の本質を見極めようとしている。`, `彼女は写真を見極めるのが好きです。`, `彼は毎日新聞を見極めます。`], a: 1, explanation: `見極める berarti 'mengamati dengan seksama hingga memahami betul intinya': 問題の本質を見極める (memahami betul hakikat masalah). Tidak cocok untuk aktivitas sederhana seperti mengikuti jalan atau membaca koran biasa.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【打ち込む】`, choices: [`彼はコップに水を打ち込みました。`, `彼女は毎朝コーヒーを打ち込みます。`, `この釘を壁に打ち込むように話しました。`, `彼は学生時代、研究に打ち込んでいた。`], a: 3, explanation: `打ち込む dalam konteks abstrak berarti 'menekuni/mencurahkan diri sepenuhnya': 研究に打ち込んでいた (mencurahkan diri sepenuhnya pada penelitian). Untuk air/kopi, kata yang tepat bukan 打ち込む.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【見落とす】`, choices: [`急いでいたので、大事な情報を見落としてしまった。`, `この映画はとても見落としやすいです。`, `彼女は問題をすぐに見落としました。理解しました。`, `彼は毎晩星を見落とします。`], a: 0, explanation: `見落とす berarti 'terlewat melihat/tidak sengaja tidak menyadari sesuatu': 大事な情報を見落とした (terlewat melihat informasi penting karena terburu-buru).`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【食い違う】`, choices: [`二人の証言が食い違っていて、真相がわからない。`, `彼女は意見が食い違って、すぐ賛成しました。`, `この料理の味は食い違っています。おいしいです。`, `彼はいつも予定が食い違うのが好きです。`], a: 0, explanation: `食い違う berarti 'tidak sinkron/berbeda satu sama lain': 証言が食い違っている (kesaksian dua orang tidak sesuai satu sama lain), sehingga kebenarannya tidak jelas.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【見込み】`, choices: [`彼女は見込みで公園を散歩しています。`, `この本はとても見込みがおもしろいです。`, `彼は毎朝見込みを食べます。`, `今年の業績は去年より良くなる見込みだ。`], a: 3, explanation: `見込み berarti 'perkiraan/prospek': 業績は良くなる見込みだ (kinerja diperkirakan akan membaik). Kata benda ini tidak dipakai untuk aktivitas fisik atau makanan.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【踏まえる】`, choices: [`彼は毎日運動場を踏まえています。`, `彼女は本を踏まえて勉強しました。`, `前回の失敗を踏まえて、新しい計画を立てた。`, `この問題は踏まえてとても簡単です。`], a: 2, explanation: `踏まえる berarti 'berdasarkan/mempertimbangkan (pengalaman/fakta sebelumnya)': 前回の失敗を踏まえて (berdasarkan kegagalan sebelumnya), menyusun rencana baru.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【見合わせる】`, choices: [`この服はサイズが見合わせています。`, `台風が近づいているため、旅行の出発を見合わせることにした。`, `彼女は問題を見合わせて解決しました。`, `彼は毎朝鏡を見合わせます。`], a: 1, explanation: `見合わせる berarti 'menunda/membatalkan sementara suatu rencana': 出発を見合わせる (menunda keberangkatan) karena topan mendekat.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【しぶしぶ】`, choices: [`彼は母に言われて、しぶしぶ部屋を片付けた。`, `この料理はしぶしぶおいしいです。`, `彼はしぶしぶ喜んで旅行に行きました。`, `彼女はしぶしぶ快く引き受けました。`], a: 0, explanation: `しぶしぶ berarti 'dengan berat hati/terpaksa': しぶしぶ部屋を片付けた (membereskan kamar dengan berat hati/terpaksa karena disuruh ibunya). Kata ini bermakna keengganan, jadi tidak logis dipasangkan dengan 喜んで/快く (dengan senang hati).`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【見合う】`, choices: [`この問題は見合ってとても難しいです。`, `彼は毎朝友達と見合います。`, `この仕事の給料は、労働時間に見合っていないと思う。`, `彼女は写真を見合って撮りました。`], a: 2, explanation: `見合う berarti 'sesuai/seimbang dengan': 給料が労働時間に見合っていない (gaji tidak sebanding dengan jam kerja).`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `この計画は資金がなければ実現（　）。`, choices: [`するわけがない`, `しようがない`, `するべきだ`, `したものだ`], a: 1, explanation: `しようがない berarti 'tidak ada cara/mustahil dilakukan': 資金がなければ実現しようがない (kalau tidak ada dana, tidak ada cara untuk merealisasikannya).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼は周囲の反対（　）、自分の考えを貫いた。`, choices: [`にかけて`, `にそって`, `において`, `をよそに`], a: 3, explanation: `をよそに berarti 'mengabaikan/tanpa peduli pada': 周囲の反対をよそに (tanpa peduli penentangan sekitarnya), tetap teguh pada pendiriannya.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この結果は努力（　）、決して偶然ではない。`, choices: [`において`, `あってこそ`, `にとって`, `に関して`], a: 1, explanation: `Pola '～あってこそ' berarti 'hanya berkat adanya...': 努力あってこそ (hanya berkat adanya usaha), hasil ini bisa didapat, sama sekali bukan kebetulan.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼女は試験に落ちた（　）、あきらめずにまた挑戦した。`, choices: [`せいで`, `とおり`, `ばかりに`, `ものの`], a: 3, explanation: `ものの menyatakan pertentangan ringan (meski...tetapi...): 試験に落ちたものの (meski gagal ujian), tidak menyerah dan mencoba lagi.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この問題は専門家（　）簡単には解決できない。`, choices: [`でさえ`, `にとって`, `にしたら`, `において`], a: 0, explanation: `でさえ berarti 'bahkan...pun': 専門家でさえ簡単には解決できない (bahkan ahli pun tidak bisa menyelesaikannya dengan mudah), menekankan tingkat kesulitan yang ekstrem.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼は忙しい仕事の（　）、家族との時間を大切にしている。`, choices: [`とおり`, `うえで`, `かたわら`, `せいで`], a: 2, explanation: `かたわら berarti 'di sela-sela/sambil': 忙しい仕事のかたわら (di sela-sela pekerjaan yang sibuk), tetap meluangkan waktu untuk keluarga.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この新製品は従来品（　）性能が優れています。`, choices: [`にかわって`, `に比べて`, `にとって`, `において`], a: 1, explanation: `に比べて berarti 'dibandingkan dengan': 従来品に比べて性能が優れている (dibandingkan produk sebelumnya, performanya lebih unggul).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼女はその仕事を（　）快く引き受けた。`, choices: [`頼まれるので`, `頼まれれば`, `頼まれるからには`, `頼まれると`], a: 3, explanation: `Pola '～と' menyatakan hasil langsung/otomatis setelah suatu tindakan: 頼まれると快く引き受けた (begitu diminta, langsung menerima dengan senang hati).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この計画が成功する（　）、みんなの協力が必要だ。`, choices: [`のに`, `ので`, `には`, `から`], a: 2, explanation: `には di sini menyatakan tujuan (untuk...): 成功するには (untuk berhasil), perlu kerja sama semua orang.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼はその案に（　）反対した。`, choices: [`断固として`, `断固で`, `断固も`, `断固に`], a: 0, explanation: `断固として adalah bentuk baku dari kata sifat-na 断固 (tegas/keras kepala pada pendirian) sebelum kata kerja: 断固として反対した (menentang dengan tegas).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この制度は利用者の増加（　）拡充された。`, choices: [`にかわり`, `において`, `に伴い`, `にとって`], a: 2, explanation: `に伴い berarti 'seiring dengan/sebagai akibat dari': 利用者の増加に伴い (seiring bertambahnya pengguna), sistem ini diperluas.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼女は仕事（　）、家庭も大切にしている。`, choices: [`ばかりでは`, `しかは`, `だけでは`, `のみならず`], a: 3, explanation: `Pola '～のみならず～も' berarti 'bukan hanya... tapi juga...': 仕事のみならず、家庭も大切にしている (bukan hanya pekerjaan, tapi juga keluarga diperhatikan dengan baik).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この問題を解決する（　）は、まず原因を調べる必要がある。`, choices: [`には`, `から`, `のに`, `けど`], a: 0, explanation: `には di sini menyatakan tujuan: 解決するには (untuk menyelesaikan masalah ini), pertama-tama perlu meneliti penyebabnya.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼は周りから何を言われよう（　）、自分の道を進んだ。`, choices: [`が`, `と`, `けど`, `のに`], a: 1, explanation: `Pola '～ようと' (setelah bentuk volitional) berarti 'apa pun yang terjadi/tak peduli...': 何を言われようと (apa pun yang dikatakan orang), tetap menjalani jalannya sendiri.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この会社は業績不振の（　）、リストラを行うことになった。`, choices: [`末に`, `とおりに`, `うえで`, `かわりに`], a: 0, explanation: `Pola '～の末に' berarti 'pada akhirnya, setelah melalui proses tertentu': 業績不振の末に (setelah melalui masa kinerja buruk berkepanjangan), akhirnya melakukan perampingan karyawan.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼女はその仕事を（　）引き受けざるを得なかった。`, choices: [`頼まれても`, `頼まれれば`, `頼まれるなら`, `頼まれて`], a: 3, explanation: `Bentuk te (頼まれて) menghubungkan alasan sebelum hasil: 頼まれて、引き受けざるを得なかった (karena diminta, terpaksa menerimanya).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この地域は高齢化が進む（　）、若者の流出も深刻だ。`, choices: [`かわりに`, `一方で`, `うえで`, `とおりに`], a: 1, explanation: `一方で berarti 'di sisi lain', menghubungkan dua fakta yang berjalan berdampingan: penuaan penduduk berlangsung, di sisi lain pergerakan keluar anak muda juga serius.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼はその案に（　）、代わりの提案をした。`, choices: [`反対する一方`, `反対しつつ`, `反対しながらも`, `反対したうえで`], a: 2, explanation: `反対しながらも berarti 'meski menentang, tetap...': meski menentang usulan itu, dia tetap memberikan usulan alternatif — menunjukkan pertentangan dalam satu tindakan.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この問題は解決した（　）新たな課題が生まれた。`, choices: [`からには`, `かと思うと`, `とすれば`, `ものの`], a: 1, explanation: `Pola '～かと思うと' berarti 'begitu terjadi..., langsung...': 解決したかと思うと (baru saja terselesaikan), muncul masalah baru — menekankan kejadian berurutan yang cepat.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `彼女は夜遅く（　）、必ずメールを確認している。`, choices: [`であれば`, `であったら`, `であるので`, `であっても`], a: 3, explanation: `であっても berarti 'meskipun...': 夜遅くであっても (meskipun sudah malam), tetap selalu memeriksa email.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Lanjut`, problemNumber: 6 },
            { q: `この計画は ＿＿＿ ＿＿＿ ★ ＿＿＿ 実現しようがない。`, choices: [`③立たない`, `①資金の`, `②めどが`, `④限り`], a: 0, explanation: `Susunan: ①資金の②めどが③立たない④限り実現しようがない (Selama prospek dana belum jelas, rencana ini tidak mungkin terwujud). Posisi ★ (ke-3) diisi oleh ③立たない, menggunakan pola '～ない限り' (selama tidak).`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `彼は ＿＿＿ ＿＿＿ ★ ＿＿＿ 自分の考えを貫いた。`, choices: [`①周囲の`, `③よそに`, `②反対を`, `④押し切って`], a: 1, explanation: `Susunan: ①周囲の②反対を③よそに④押し切って自分の考えを貫いた (Dia mengabaikan penentangan sekitarnya dan tetap teguh pada pendiriannya). Posisi ★ (ke-3) diisi oleh ③よそに, sesuai pola '～をよそに'.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `この結果は ＿＿＿ ＿＿＿ ★ ＿＿＿ と言える。`, choices: [`①長年の`, `②努力の`, `③積み重ねの`, `④賜物`], a: 2, explanation: `Susunan: ①長年の②努力の③積み重ねの④賜物と言える (Hasil ini bisa dikatakan sebagai buah dari akumulasi usaha bertahun-tahun). Posisi ★ (ke-3) diisi oleh ③積み重ねの, karena '努力の積み重ね' (akumulasi usaha) adalah rangkaian kata yang alami, bukan '積み重ねの努力'.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `彼女は ＿＿＿ ＿＿＿ ★ ＿＿＿ 新しい挑戦を続けている。`, choices: [`①一度の`, `②失敗に`, `④に`, `③めげず`], a: 3, explanation: `Susunan: ①一度の②失敗に③めげず④に新しい挑戦を続けている (Tanpa gentar oleh satu kali kegagalan, dia terus mencoba tantangan baru). Posisi ★ (ke-3) diisi oleh ③めげず, dari pola '～にめげず' (tanpa gentar/patah semangat oleh).`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `この問題は ＿＿＿ ＿＿＿ ★ ＿＿＿ 簡単には解決しない。`, choices: [`④原因が`, `①専門家に`, `③複雑すぎて`, `②とっても`], a: 1, explanation: `Susunan: ④原因が③複雑すぎて①専門家に②とっても簡単には解決しない (Penyebabnya terlalu rumit, sehingga bahkan bagi ahli sekalipun, masalah ini tidak mudah diselesaikan). Posisi ★ (ke-3) diisi oleh ①専門家に.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `彼は ＿＿＿ ＿＿＿ ★ ＿＿＿ 家族との時間を大切にしている。`, choices: [`①忙しい`, `②仕事の`, `③かたわら`, `④毎日`], a: 2, explanation: `Susunan: ①忙しい②仕事の③かたわら④毎日家族との時間を大切にしている (Di sela-sela pekerjaannya yang sibuk, dia setiap hari tetap menjaga waktu bersama keluarga). Posisi ★ (ke-3) diisi oleh ③かたわら.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `この新製品は ＿＿＿ ＿＿＿ ★ ＿＿＿ 高い評価を得ている。`, choices: [`①従来品に`, `③比べて`, `②性能の`, `④優れた`], a: 3, explanation: `Susunan: ①従来品に③比べて④優れた②性能の（点で）高い評価を得ている (Dibandingkan produk sebelumnya, produk baru ini mendapat penilaian tinggi karena performanya yang unggul). Posisi ★ (ke-3) diisi oleh ④優れた.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `彼女は ＿＿＿ ＿＿＿ ★ ＿＿＿ 快く引き受けた。`, choices: [`②依頼`, `④その`, `①急な`, `③にもかかわらず`], a: 0, explanation: `Susunan: ④その①急な②依頼③にもかかわらず快く引き受けた (Meski permintaan itu mendadak, dia tetap menerimanya dengan senang hati). Posisi ★ (ke-3) diisi oleh ②依頼.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `この制度は ＿＿＿ ＿＿＿ ★ ＿＿＿ 改正されることになった。`, choices: [`④増加する`, `①利用者の`, `②声を`, `③受けて`], a: 2, explanation: `Susunan: ④増加する①利用者の②声を③受けて改正されることになった (Menanggapi suara pengguna yang semakin bertambah, sistem ini diputuskan untuk direvisi). Posisi ★ (ke-3) diisi oleh ②声を.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `彼は ＿＿＿ ＿＿＿ ★ ＿＿＿ 自分の道を進んだ。`, choices: [`②言われよう`, `③周りから`, `①何を`, `④と`], a: 0, explanation: `Susunan: ③周りから①何を②言われよう④と自分の道を進んだ (Apa pun yang dikatakan orang-orang di sekitarnya, dia tetap menjalani jalannya sendiri). Posisi ★ (ke-3) diisi oleh ②言われよう, dari pola '～ようと' (apa pun yang terjadi).`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `「地方の人口減少問題」: 近年、地方都市の人口減少が（41）深刻な問題になっている。`, choices: [`いまさら`, `せっかく`, `ますます`, `たびたび`], a: 2, explanation: `ますます berarti 'semakin', cocok untuk menyatakan tren masalah yang terus memburuk secara progresif dari waktu ke waktu.`, passage: `<p style="font-weight:700;margin-bottom:6px;">地方の人口減少問題</p><p style="white-space:normal;line-height:1.9;">近年、地方都市の人口減少が（41）深刻な問題になっている。若者が仕事を求めて都会へ出て（42）、地方には高齢者ばかりが残るという状況が続いている。この問題を解決する（43）、地方自治体は様々な取り組みを行っている。例えば、企業の誘致や、子育て支援の充実などである。しかし、こうした対策も、地方の魅力を根本的に高めるものでない（44）、効果は限定的だという指摘もある。今後は、単なる経済的支援だけでなく、地域全体の暮らしやすさを（45）視点が必要とされている。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「地方の人口減少問題」: 若者が仕事を求めて都会へ出て（42）、地方には高齢者ばかりが残るという状況が続いている。`, choices: [`しまうため`, `しまうのに`, `しまうから`, `しまうけど`], a: 0, explanation: `しまうため menyatakan sebab dengan nuansa penyesalan/hal yang terjadi begitu saja: 都会へ出てしまうため (karena para pemuda pergi ke kota), yang tersisa di desa hanya lansia.`, passage: `<p style="font-weight:700;margin-bottom:6px;">地方の人口減少問題</p><p style="white-space:normal;line-height:1.9;">近年、地方都市の人口減少が（41）深刻な問題になっている。若者が仕事を求めて都会へ出て（42）、地方には高齢者ばかりが残るという状況が続いている。この問題を解決する（43）、地方自治体は様々な取り組みを行っている。例えば、企業の誘致や、子育て支援の充実などである。しかし、こうした対策も、地方の魅力を根本的に高めるものでない（44）、効果は限定的だという指摘もある。今後は、単なる経済的支援だけでなく、地域全体の暮らしやすさを（45）視点が必要とされている。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「地方の人口減少問題」: この問題を解決する（43）、地方自治体は様々な取り組みを行っている。`, choices: [`けど`, `のに`, `とも`, `ために`], a: 3, explanation: `ために menyatakan tujuan: 解決するために (demi menyelesaikan masalah ini), pemerintah daerah melakukan berbagai upaya.`, passage: `<p style="font-weight:700;margin-bottom:6px;">地方の人口減少問題</p><p style="white-space:normal;line-height:1.9;">近年、地方都市の人口減少が（41）深刻な問題になっている。若者が仕事を求めて都会へ出て（42）、地方には高齢者ばかりが残るという状況が続いている。この問題を解決する（43）、地方自治体は様々な取り組みを行っている。例えば、企業の誘致や、子育て支援の充実などである。しかし、こうした対策も、地方の魅力を根本的に高めるものでない（44）、効果は限定的だという指摘もある。今後は、単なる経済的支援だけでなく、地域全体の暮らしやすさを（45）視点が必要とされている。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「地方の人口減少問題」: こうした対策も、地方の魅力を根本的に高めるものでない（44）、効果は限定的だという指摘もある。`, choices: [`からには`, `限り`, `とおりに`, `うちに`], a: 1, explanation: `Pola '～ない限り' berarti 'selama tidak...': 高めるものでない限り (selama tidak benar-benar meningkatkan daya tarik daerah secara mendasar), efeknya dianggap terbatas.`, passage: `<p style="font-weight:700;margin-bottom:6px;">地方の人口減少問題</p><p style="white-space:normal;line-height:1.9;">近年、地方都市の人口減少が（41）深刻な問題になっている。若者が仕事を求めて都会へ出て（42）、地方には高齢者ばかりが残るという状況が続いている。この問題を解決する（43）、地方自治体は様々な取り組みを行っている。例えば、企業の誘致や、子育て支援の充実などである。しかし、こうした対策も、地方の魅力を根本的に高めるものでない（44）、効果は限定的だという指摘もある。今後は、単なる経済的支援だけでなく、地域全体の暮らしやすさを（45）視点が必要とされている。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「地方の人口減少問題」: 今後は、単なる経済的支援だけでなく、地域全体の暮らしやすさを（45）視点が必要とされている。`, choices: [`高める`, `高めれば`, `高めた`, `高めて`], a: 0, explanation: `Sebelum kata benda 視点 (sudut pandang), kata kerja menggunakan bentuk kamus sebagai modifier: 暮らしやすさを高める視点 (sudut pandang untuk meningkatkan kenyamanan hidup).`, passage: `<p style="font-weight:700;margin-bottom:6px;">地方の人口減少問題</p><p style="white-space:normal;line-height:1.9;">近年、地方都市の人口減少が（41）深刻な問題になっている。若者が仕事を求めて都会へ出て（42）、地方には高齢者ばかりが残るという状況が続いている。この問題を解決する（43）、地方自治体は様々な取り組みを行っている。例えば、企業の誘致や、子育て支援の充実などである。しかし、こうした対策も、地方の魅力を根本的に高めるものでない（44）、効果は限定的だという指摘もある。今後は、単なる経済的支援だけでなく、地域全体の暮らしやすさを（45）視点が必要とされている。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「テクノロジーと人間関係」: スマートフォンやSNSの普及によって、わたしたちのコミュニケーションの方法は大きく（41）。`, choices: [`変化する`, `変化すれば`, `変化した`, `変化して`], a: 2, explanation: `Kalimat ini menyatakan fakta yang telah terjadi (bentuk lampau selesai): コミュニケーションの方法は大きく変化した (metode komunikasi kita telah berubah besar-besaran).`, passage: `<p style="font-weight:700;margin-bottom:6px;">テクノロジーと人間関係</p><p style="white-space:normal;line-height:1.9;">スマートフォンやSNSの普及によって、わたしたちのコミュニケーションの方法は大きく（41）。以前なら直接会って話していたことも、今ではメッセージ一つで済ませる（42）なった。この変化は便利さをもたらす一方、直接顔を合わせて話す機会が減った（43）、人間関係が浅くなっているという指摘もある。もちろん、テクノロジーそのものが悪い（44）。要は、使い方次第で、人間関係を豊かにも、貧しくもできる（45）ことなのだ。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「テクノロジーと人間関係」: 以前なら直接会って話していたことも、今ではメッセージ一つで済ませる（42）なった。`, choices: [`ために`, `ことに`, `ように`, `とおりに`], a: 2, explanation: `Pola '～ようになる' menyatakan perubahan menjadi mampu/kebiasaan baru: メッセージ一つで済ませるようになった (menjadi terbiasa cukup dengan satu pesan saja).`, passage: `<p style="font-weight:700;margin-bottom:6px;">テクノロジーと人間関係</p><p style="white-space:normal;line-height:1.9;">スマートフォンやSNSの普及によって、わたしたちのコミュニケーションの方法は大きく（41）。以前なら直接会って話していたことも、今ではメッセージ一つで済ませる（42）なった。この変化は便利さをもたらす一方、直接顔を合わせて話す機会が減った（43）、人間関係が浅くなっているという指摘もある。もちろん、テクノロジーそのものが悪い（44）。要は、使い方次第で、人間関係を豊かにも、貧しくもできる（45）ことなのだ。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「テクノロジーと人間関係」: 直接顔を合わせて話す機会が減った（43）、人間関係が浅くなっているという指摘もある。`, choices: [`ため`, `のに`, `とも`, `けど`], a: 0, explanation: `ため menyatakan sebab: 機会が減ったため (karena kesempatan bertatap muka berkurang), ada yang menunjukkan bahwa hubungan antar manusia menjadi dangkal.`, passage: `<p style="font-weight:700;margin-bottom:6px;">テクノロジーと人間関係</p><p style="white-space:normal;line-height:1.9;">スマートフォンやSNSの普及によって、わたしたちのコミュニケーションの方法は大きく（41）。以前なら直接会って話していたことも、今ではメッセージ一つで済ませる（42）なった。この変化は便利さをもたらす一方、直接顔を合わせて話す機会が減った（43）、人間関係が浅くなっているという指摘もある。もちろん、テクノロジーそのものが悪い（44）。要は、使い方次第で、人間関係を豊かにも、貧しくもできる（45）ことなのだ。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「テクノロジーと人間関係」: もちろん、テクノロジーそのものが悪い（44）。`, choices: [`はずがない`, `わけがない`, `ものではない`, `わけではない`], a: 3, explanation: `Pola '～わけではない' berarti 'bukan berarti sepenuhnya...' (menyanggah kesimpulan berlebihan): テクノロジー自体が悪いわけではない (bukan berarti teknologinya sendiri yang jahat), tapi tergantung cara penggunaannya.`, passage: `<p style="font-weight:700;margin-bottom:6px;">テクノロジーと人間関係</p><p style="white-space:normal;line-height:1.9;">スマートフォンやSNSの普及によって、わたしたちのコミュニケーションの方法は大きく（41）。以前なら直接会って話していたことも、今ではメッセージ一つで済ませる（42）なった。この変化は便利さをもたらす一方、直接顔を合わせて話す機会が減った（43）、人間関係が浅くなっているという指摘もある。もちろん、テクノロジーそのものが悪い（44）。要は、使い方次第で、人間関係を豊かにも、貧しくもできる（45）ことなのだ。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「テクノロジーと人間関係」: 要は、使い方次第で、人間関係を豊かにも、貧しくもできる（45）ことなのだ。`, choices: [`とおりの`, `という`, `というより`, `といった`], a: 1, explanation: `Pola '～という' dipakai untuk merangkum/menegaskan suatu pernyataan sebagai kesimpulan: 豊かにも貧しくもできるということなのだ (intinya, bisa membuat hubungan menjadi kaya atau miskin tergantung cara pakainya).`, passage: `<p style="font-weight:700;margin-bottom:6px;">テクノロジーと人間関係</p><p style="white-space:normal;line-height:1.9;">スマートフォンやSNSの普及によって、わたしたちのコミュニケーションの方法は大きく（41）。以前なら直接会って話していたことも、今ではメッセージ一つで済ませる（42）なった。この変化は便利さをもたらす一方、直接顔を合わせて話す機会が減った（43）、人間関係が浅くなっているという指摘もある。もちろん、テクノロジーそのものが悪い（44）。要は、使い方次第で、人間関係を豊かにも、貧しくもできる（45）ことなのだ。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `このメールで伝えたいことは何ですか。`, choices: [`新プロジェクトが完全に中止になったこと。`, `新プロジェクトを今期は実施しないこと。`, `新プロジェクトを今すぐ実施すること。`, `予算が増えたこと。`], a: 1, explanation: `Email menyebutkan proyek ditunda pelaksanaannya untuk periode ini (今期の実施は見送らせていただく) karena masalah anggaran, tapi akan dipertimbangkan lagi pada penyusunan anggaran periode berikutnya — jadi bukan dibatalkan total, hanya ditunda pelaksanaannya periode ini.`, passage: `<p style="font-weight:700;margin-bottom:6px;">メール（田中さんから佐藤様へ）</p><p style="white-space:normal;line-height:1.9;">佐藤様<br><br>いつもお世話になっております。先日ご提案いただいた新プロジェクトの件ですが、社内で検討した結果、予算の都合上、今期の実施は見送らせていただくことになりました。ただし、来期の予算編成の際には改めて検討させていただく予定です。ご期待に沿えず申し訳ございませんが、何卒ご理解いただけますようお願いいたします。<br><br>田中</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `来月から、社員の座席はどうなりますか。`, choices: [`決まった席がなくなり、自由に選べるようになる。`, `全員同じ席で働くことになる。`, `座席が今までより広くなる。`, `在宅勤務に変わる。`], a: 0, explanation: `Pengumuman menjelaskan sistem berubah menjadi free address, di mana tidak ada kursi tetap dan karyawan bebas memilih kursi kosong setiap hari.`, passage: `<p style="font-weight:700;margin-bottom:6px;">お知らせ（社員の皆様へ）</p><p style="white-space:normal;line-height:1.9;">＜社員の皆様へ＞<br><br>来月より、オフィスの座席がフリーアドレス制に変わります。決まった自分の席はなくなり、毎日空いている席を自由に選んで利用していただく形になります。荷物は各自ロッカーで管理してください。詳しい運用ルールは、来週の説明会でご案内いたします。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `この人が最も言いたいことは何ですか。`, choices: [`荷物は必ず網棚に置くべきだということ。`, `公共の場のルールをもっと厳しくすべきだということ。`, `マナーは他人への配慮から自然に生まれるものだということ。`, `電車の中での会話は法律で禁止すべきだということ。`], a: 2, explanation: `Penulis menyimpulkan bahwa etika bukanlah sesuatu yang harus diatur dengan aturan ketat, melainkan muncul secara alami dari kesadaran untuk memikirkan posisi orang lain (相手の立場を想像することから生まれる).`, passage: `<p style="font-weight:700;margin-bottom:6px;">意見・投書（公共の場のマナー）</p><p style="white-space:normal;line-height:1.9;">最近、公共の場でのマナーについて考えさせられることが多い。特に気になるのは、電車内での大声での会話や、通路をふさぐような荷物の置き方だ。これらは決して法律で禁止されているわけではないが、周囲への配慮に欠ける行動だと感じる。マナーとは、規則で縛るものではなく、一人ひとりが相手の立場を想像することから生まれるものではないだろうか。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `この広告の内容と合っているのはどれですか。`, choices: [`対面授業のみで、オンラインでは受けられない。`, `割引は誰でもいつでも受けられる。`, `授業は全部で20回ある。`, `見逃した授業も後で見ることができる。`], a: 3, explanation: `Iklan menyebutkan tersedia rekaman siaran (録画配信) sehingga sesi yang terlewat bisa ditonton kembali nanti. Kursus sepenuhnya online (bukan tatap muka), diskon hanya untuk pendaftar awal (bukan siapa saja kapan saja), dan totalnya 12 kali pertemuan (bukan 20).`, passage: `<p style="font-weight:700;margin-bottom:6px;">広告（オンライン日本語講座）</p><p style="white-space:normal;line-height:1.9;">【期間限定】オンライン日本語講座、受講生募集中！<br>対象：ビジネスレベルの日本語を身につけたい方<br>期間：全12回（週1回、90分）<br>特典：早期申し込み（開講2週間前まで）で受講料10%割引<br>＊オンラインなので、どこからでも受講可能です。録画配信もあり、見逃した回も後から視聴できます。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `筆者が今、実感していることは何ですか。`, choices: [`両親の言葉には意味がなかったということ。`, `失敗は絶対に避けるべきだということ。`, `子供のころの記憶は正確ではないということ。`, `挑戦しないことが最大のリスクだということ。`], a: 3, explanation: `Kolom menutup dengan pernyataan tegas bahwa 'tidak melakukan apa pun sebenarnya adalah risiko terbesar' (何もしないことこそが、実は一番のリスク), sejalan dengan pesan orang tua penulis untuk berani mencoba meski bisa gagal.`, passage: `<p style="font-weight:700;margin-bottom:6px;">コラム（両親の言葉）</p><p style="white-space:normal;line-height:1.9;">わたしが子供のころ、両親はよく「失敗してもいいから、まずやってみなさい」と言っていた。当時はその意味がよくわからなかったが、大人になった今、その言葉の重みを実感している。挑戦しなければ、成功も失敗も存在しない。何もしないことこそが、実は一番のリスクなのかもしれない。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `訓練が中止になるかどうかは、いつ、どうやってわかりますか。`, choices: [`当日朝7時までに、町内放送で知らされる。`, `訓練当日、集合場所で発表される。`, `前日の夜に電話で知らされる。`, `小雨でも必ず中止になる。`], a: 0, explanation: `Pengumuman menyebutkan jika cuaca buruk, pembatalan akan diumumkan lewat siaran warga (町内放送) paling lambat jam 7 pagi di hari pelaksanaan. Hujan ringan tetap dilaksanakan (小雨決行), hanya cuaca ekstrem yang membatalkan acara.`, passage: `<p style="font-weight:700;margin-bottom:6px;">案内（地域防災訓練）</p><p style="white-space:normal;line-height:1.9;">＜地域防災訓練のご案内＞<br><br>参加対象：町内在住の方どなたでも<br>持ち物：動きやすい服装、飲み物<br>＊小雨決行、荒天時は中止です。中止の場合、当日朝7時までに町内放送でお知らせします。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `筆者は、真の働き方改革には何が必要だと考えていますか。`, choices: [`報告書をもっと詳しく書くこと。`, `会議の回数を増やすこと。`, `仕事の進め方そのものを見直すこと。`, `労働時間をとにかく減らすこと。`], a: 2, explanation: `Penulis berpendapat bahwa yang penting bukan sekadar memotong jam kerja, tapi meninjau ulang cara kerja itu sendiri (仕事の進め方そのものを見直すこと), seperti mengurangi rapat yang tidak perlu dan laporan yang sia-sia.`, passage: `<p style="font-weight:700;margin-bottom:6px;">論説文（真の働き方改革）</p><p style="white-space:normal;line-height:1.9;">働き方改革が叫ばれる中、多くの企業が労働時間の削減に取り組んでいる。しかし、単に労働時間を減らすだけでは、生産性の向上にはつながらないという指摘もある。重要なのは、仕事の進め方そのものを見直すことだ。例えば、会議の回数を減らし、本当に必要な議論だけに絞る、あるいは、無駄な報告書の作成をやめるといった工夫が求められる。労働時間の削減を目的化するのではなく、働き方全体を効率化する視点こそが、真の改革につながるのではないだろうか。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `この文章の内容と合っているのはどれですか。`, choices: [`報告書の作成は増やすべきだ。`, `労働時間の削減だけでは生産性は上がらない。`, `会議はできるだけ多く行うべきだ。`, `労働時間を減らせば必ず生産性が上がる。`], a: 1, explanation: `Teks secara eksplisit menyatakan bahwa hanya mengurangi jam kerja saja tidak akan meningkatkan produktivitas (単に労働時間を減らすだけでは、生産性の向上にはつながらない).`, passage: `<p style="font-weight:700;margin-bottom:6px;">論説文（真の働き方改革）</p><p style="white-space:normal;line-height:1.9;">働き方改革が叫ばれる中、多くの企業が労働時間の削減に取り組んでいる。しかし、単に労働時間を減らすだけでは、生産性の向上にはつながらないという指摘もある。重要なのは、仕事の進め方そのものを見直すことだ。例えば、会議の回数を減らし、本当に必要な議論だけに絞る、あるいは、無駄な報告書の作成をやめるといった工夫が求められる。労働時間の削減を目的化するのではなく、働き方全体を効率化する視点こそが、真の改革につながるのではないだろうか。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `筆者が海外で最も強く感じたことは何ですか。`, choices: [`日本の常識は世界共通だということ。`, `「常識」は場所によって違うということ。`, `海外の生活は日本より便利だということ。`, `時間を守ることの大切さ。`], a: 1, explanation: `Penulis menyebutkan bahwa hal yang paling ia rasakan adalah bahwa 'kewajaran/norma umum' sangat berbeda tergantung tempatnya (「常識」というものが場所によって全く違う), berdasarkan pengalaman soal ketepatan waktu yang berbeda antara Jepang dan negara tempat ia tinggal.`, passage: `<p style="font-weight:700;margin-bottom:6px;">エッセイ（海外での気づき）</p><p style="white-space:normal;line-height:1.9;">わたしが海外で暮らして最も強く感じたのは、「常識」というものが場所によって全く違うということだった。日本では時間厳守が当たり前だが、わたしが住んだ国では、多少の遅れは誰も気にしなかった。最初はいらいらすることもあったが、次第に、その土地のペースに合わせることの心地よさに気づいた。異文化に触れることは、自分の中の「当たり前」を疑い、視野を広げるきっかけになる。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `筆者にとって、異文化に触れることはどのような意味がありますか。`, choices: [`自分の当たり前を見直し、視野を広げるきっかけになる。`, `日本の常識を海外に広めることになる。`, `自分の国の文化を否定することになる。`, `外国語を完璧に習得できるようになる。`], a: 0, explanation: `Penulis menutup esainya dengan menyatakan bahwa bersentuhan dengan budaya asing menjadi kesempatan untuk meragukan 'kewajaran' dalam dirinya sendiri dan memperluas wawasan (「当たり前」を疑い、視野を広げるきっかけ).`, passage: `<p style="font-weight:700;margin-bottom:6px;">エッセイ（海外での気づき）</p><p style="white-space:normal;line-height:1.9;">わたしが海外で暮らして最も強く感じたのは、「常識」というものが場所によって全く違うということだった。日本では時間厳守が当たり前だが、わたしが住んだ国では、多少の遅れは誰も気にしなかった。最初はいらいらすることもあったが、次第に、その土地のペースに合わせることの心地よさに気づいた。異文化に触れることは、自分の中の「当たり前」を疑い、視野を広げるきっかけになる。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `食品ロスの原因として挙げられているのは何ですか。`, choices: [`農家の生産量が少なすぎること。`, `食品の値段が高すぎること。`, `過剰な発注や賞味期限への過度な慎重さ。`, `消費者が食べ物を食べすぎること。`], a: 2, explanation: `Teks menyebutkan penyebabnya antara lain pemesanan berlebihan oleh supermarket/minimarket dan sikap terlalu berhati-hati terhadap tanggal kedaluwarsa (過剰な発注や、賞味期限に対する過度に慎重な対応).`, passage: `<p style="font-weight:700;margin-bottom:6px;">説明文（食品ロス）</p><p style="white-space:normal;line-height:1.9;">近年、食品ロスの削減が世界的な課題となっている。日本でも、まだ食べられるのに捨てられてしまう食品の量は年間数百万トンにのぼるとされる。原因の一つとして、スーパーやコンビニでの過剰な発注や、賞味期限に対する過度に慎重な対応が挙げられる。この問題に対して、一部の企業では、賞味期限が近づいた商品を値引きして販売したり、フードバンクに寄付したりする取り組みを始めている。消費者側の意識改革も欠かせない要素であり、必要以上に「見た目のきれいさ」や「新しさ」にこだわらない姿勢が求められている。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `食品ロスを減らすために、消費者に求められている姿勢はどれですか。`, choices: [`常に新しい商品だけを買うこと。`, `賞味期限を気にしないこと。`, `食品を大量に買いだめすること。`, `見た目や新しさに過度にこだわらないこと。`], a: 3, explanation: `Teks menyebutkan konsumen diharapkan tidak terlalu terpaku pada 'tampilan yang sempurna' atau 'kebaruan' produk secara berlebihan (「見た目のきれいさ」や「新しさ」にこだわらない姿勢).`, passage: `<p style="font-weight:700;margin-bottom:6px;">説明文（食品ロス）</p><p style="white-space:normal;line-height:1.9;">近年、食品ロスの削減が世界的な課題となっている。日本でも、まだ食べられるのに捨てられてしまう食品の量は年間数百万トンにのぼるとされる。原因の一つとして、スーパーやコンビニでの過剰な発注や、賞味期限に対する過度に慎重な対応が挙げられる。この問題に対して、一部の企業では、賞味期限が近づいた商品を値引きして販売したり、フードバンクに寄付したりする取り組みを始めている。消費者側の意識改革も欠かせない要素であり、必要以上に「見た目のきれいさ」や「新しさ」にこだわらない姿勢が求められている。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `筆者によると、情報リテラシーを身につけるために、まず何をする習慣が必要ですか。`, choices: [`ニュースを毎日見ること。`, `SNSの利用をやめること。`, `情報の出所を確認すること。`, `情報をできるだけ多く集めること。`], a: 2, explanation: `Teks menyatakan hal pertama yang penting adalah kebiasaan memeriksa sumber informasi (情報の出所を確認する習慣), yaitu menyadari siapa dan untuk tujuan apa informasi tersebut disebarkan.`, passage: `<p style="font-weight:700;margin-bottom:6px;">評論（情報リテラシー）</p><p style="white-space:normal;line-height:1.9;">情報化社会において、わたしたちは日々膨大な量の情報にさらされている。ニュース、SNS、広告など、その情報源は多岐にわたり、真偽の判断が難しいものも少なくない。こうした状況の中で重要になるのが、情報リテラシー、すなわち情報を正しく読み解き、活用する能力である。<br><br>情報リテラシーを身につけるためには、まず情報の出所を確認する習慣が欠かせない。誰が、どのような目的で発信した情報なのかを意識するだけでも、情報を鵜呑みにする危険は大きく減る。また、一つの情報源だけに頼らず、複数の情報を比較検討することも重要だ。異なる立場からの意見を知ることで、より客観的な判断が可能になる。<br><br>学校教育においても、情報リテラシー教育の重要性が高まっている。従来の教育では、知識を覚えることに重点が置かれていたが、これからの時代には、情報を批判的に検討し、自分なりの考えを構築する力を育てることが求められる。情報があふれる時代だからこそ、情報に振り回されるのではなく、情報を主体的に扱う力を養うことが、これからの社会を生きる上で不可欠なのである。</p>`, sectionLabel: `読解 · Bacaan Panjang`, problemNumber: 11 },
            { q: `筆者が、これからの学校教育に求めているのはどのようなことですか。`, choices: [`知識をできるだけ多く覚えさせること。`, `SNSの使い方だけを教えること。`, `テストの点数を重視すること。`, `情報を批判的に検討し、自分の考えを作る力を育てること。`], a: 3, explanation: `Teks menyebutkan pendidikan ke depan perlu menumbuhkan kemampuan berpikir kritis terhadap informasi dan membangun pemikiran sendiri (情報を批判的に検討し、自分なりの考えを構築する力), bukan sekadar menghafal pengetahuan seperti pendidikan konvensional.`, passage: `<p style="font-weight:700;margin-bottom:6px;">評論（情報リテラシー）</p><p style="white-space:normal;line-height:1.9;">情報化社会において、わたしたちは日々膨大な量の情報にさらされている。ニュース、SNS、広告など、その情報源は多岐にわたり、真偽の判断が難しいものも少なくない。こうした状況の中で重要になるのが、情報リテラシー、すなわち情報を正しく読み解き、活用する能力である。<br><br>情報リテラシーを身につけるためには、まず情報の出所を確認する習慣が欠かせない。誰が、どのような目的で発信した情報なのかを意識するだけでも、情報を鵜呑みにする危険は大きく減る。また、一つの情報源だけに頼らず、複数の情報を比較検討することも重要だ。異なる立場からの意見を知ることで、より客観的な判断が可能になる。<br><br>学校教育においても、情報リテラシー教育の重要性が高まっている。従来の教育では、知識を覚えることに重点が置かれていたが、これからの時代には、情報を批判的に検討し、自分なりの考えを構築する力を育てることが求められる。情報があふれる時代だからこそ、情報に振り回されるのではなく、情報を主体的に扱う力を養うことが、これからの社会を生きる上で不可欠なのである。</p>`, sectionLabel: `読解 · Bacaan Panjang`, problemNumber: 11 },
            { q: `子供のころの筆者にとって、祖父の言葉はどのようなものでしたか。`, choices: [`すぐに深く理解できるものだった。`, `意味がよくわからないものだった。`, `怖くて近寄れないものだった。`, `退屈で聞きたくないものだった。`], a: 1, explanation: `Teks menyatakan waktu kecil penulis belum mengerti betul makna kata-kata kakeknya (当時のわたしには、その言葉の重みがよくわからなかった), baru dipahami setelah dewasa dan memiliki pekerjaan sendiri.`, passage: `<p style="font-weight:700;margin-bottom:6px;">随筆（祖父の言葉）</p><p style="white-space:normal;line-height:1.9;">祖父は長年、小さな町工場を営んでいた。子供のころ、わたしはよく祖父の工場に遊びに行き、金属を削る機械の音や、油のにおいに囲まれながら、祖父が黙々と部品を作る姿を眺めていた。祖父はあまり口数の多い人ではなかったが、ものを作ることについて話すときだけは、目を輝かせて饒舌になった。<br><br>「この部品ひとつが、誰かの車を安全に走らせる。そう思うと、手を抜けないんだよ」。祖父はよくそう言っていた。当時のわたしには、その言葉の重みがよくわからなかった。しかし、大人になり、自分自身が仕事を持つようになって、ようやくその意味が少しずつ理解できるようになってきた。<br><br>祖父が亡くなってから、もう十年になる。工場はすでに閉じられ、機械も処分されてしまったが、祖父の言葉は今もわたしの心の中に残っている。目の前の仕事に真摯に向き合うこと。それが、どんな小さな仕事であっても、誰かの役に立っているという誇りを持つこと。祖父から学んだそのことを、わたしは自分の仕事の中で大切にしていきたいと思っている。</p>`, sectionLabel: `読解 · Bacaan Panjang`, problemNumber: 11 },
            { q: `筆者が祖父から学び、大切にしていきたいと思っていることは何ですか。`, choices: [`目の前の仕事に真摯に向き合うこと。`, `大きな会社で働くこと。`, `できるだけ楽に仕事をすること。`, `工場を再建すること。`], a: 0, explanation: `Teks menutup dengan pesan bahwa penulis ingin menjaga sikap serius menghadapi pekerjaan di depan mata (目の前の仕事に真摯に向き合うこと), sebagai warisan berharga dari kakeknya, apa pun besar-kecilnya pekerjaan itu.`, passage: `<p style="font-weight:700;margin-bottom:6px;">随筆（祖父の言葉）</p><p style="white-space:normal;line-height:1.9;">祖父は長年、小さな町工場を営んでいた。子供のころ、わたしはよく祖父の工場に遊びに行き、金属を削る機械の音や、油のにおいに囲まれながら、祖父が黙々と部品を作る姿を眺めていた。祖父はあまり口数の多い人ではなかったが、ものを作ることについて話すときだけは、目を輝かせて饒舌になった。<br><br>「この部品ひとつが、誰かの車を安全に走らせる。そう思うと、手を抜けないんだよ」。祖父はよくそう言っていた。当時のわたしには、その言葉の重みがよくわからなかった。しかし、大人になり、自分自身が仕事を持つようになって、ようやくその意味が少しずつ理解できるようになってきた。<br><br>祖父が亡くなってから、もう十年になる。工場はすでに閉じられ、機械も処分されてしまったが、祖父の言葉は今もわたしの心の中に残っている。目の前の仕事に真摯に向き合うこと。それが、どんな小さな仕事であっても、誰かの役に立っているという誇りを持つこと。祖父から学んだそのことを、わたしは自分の仕事の中で大切にしていきたいと思っている。</p>`, sectionLabel: `読解 · Bacaan Panjang`, problemNumber: 11 },
            { q: `日本語ボランティアの経験が全くない人が、まず受講すべきコースはどれですか。`, choices: [`指導者コース`, `入門コース`, `どのコースでも良い`, `実践コース`], a: 1, explanation: `Tabel menunjukkan 入門コース (kursus pemula) ditujukan untuk orang yang belum berpengalaman sama sekali (未経験者), sehingga inilah kursus pertama yang wajib diambil.`, passage: `<p style="font-weight:700;margin-bottom:6px;">地域日本語ボランティア研修案内</p><p style="margin-bottom:6px;">＜外国人支援　日本語ボランティア養成講座＞</p><table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:6px;"><thead><tr><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">コース</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">対象</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">回数</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">受講料</th></tr></thead><tbody><tr><td style="border:1px solid #ddd;padding:6px 10px;">入門コース</td><td style="border:1px solid #ddd;padding:6px 10px;">未経験者</td><td style="border:1px solid #ddd;padding:6px 10px;">全5回</td><td style="border:1px solid #ddd;padding:6px 10px;">無料</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">実践コース</td><td style="border:1px solid #ddd;padding:6px 10px;">入門コース修了者</td><td style="border:1px solid #ddd;padding:6px 10px;">全8回</td><td style="border:1px solid #ddd;padding:6px 10px;">3,000円</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">指導者コース</td><td style="border:1px solid #ddd;padding:6px 10px;">実践コース修了者、活動歴1年以上</td><td style="border:1px solid #ddd;padding:6px 10px;">全10回</td><td style="border:1px solid #ddd;padding:6px 10px;">5,000円</td></tr></tbody></table><p style="font-size:12px;opacity:.8;margin-top:6px;">＊各コースとも、定員は20名です。定員を超えた場合は抽選になります。<br>＊指導者コースの受講には、活動報告書の提出が必要です。</p>`, sectionLabel: `読解 · Pencarian Informasi`, problemNumber: 12 },
            { q: `活動歴6か月の人は、指導者コースを受講できますか。`, choices: [`できる。ただし定員に空きがある場合のみ。`, `できる。実践コースを修了していれば問題ない。`, `できない。活動歴1年以上という条件を満たしていない。`, `できる。受講料を払えば誰でも受けられる。`], a: 2, explanation: `Tabel mensyaratkan peserta kursus pembina (指導者コース) harus memiliki pengalaman aktivitas minimal 1 tahun (活動歴1年以上). Orang dengan pengalaman 6 bulan belum memenuhi syarat ini, sehingga tidak bisa mendaftar meski sudah lulus kursus praktik.`, passage: `<p style="font-weight:700;margin-bottom:6px;">地域日本語ボランティア研修案内</p><p style="margin-bottom:6px;">＜外国人支援　日本語ボランティア養成講座＞</p><table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:6px;"><thead><tr><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">コース</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">対象</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">回数</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">受講料</th></tr></thead><tbody><tr><td style="border:1px solid #ddd;padding:6px 10px;">入門コース</td><td style="border:1px solid #ddd;padding:6px 10px;">未経験者</td><td style="border:1px solid #ddd;padding:6px 10px;">全5回</td><td style="border:1px solid #ddd;padding:6px 10px;">無料</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">実践コース</td><td style="border:1px solid #ddd;padding:6px 10px;">入門コース修了者</td><td style="border:1px solid #ddd;padding:6px 10px;">全8回</td><td style="border:1px solid #ddd;padding:6px 10px;">3,000円</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">指導者コース</td><td style="border:1px solid #ddd;padding:6px 10px;">実践コース修了者、活動歴1年以上</td><td style="border:1px solid #ddd;padding:6px 10px;">全10回</td><td style="border:1px solid #ddd;padding:6px 10px;">5,000円</td></tr></tbody></table><p style="font-size:12px;opacity:.8;margin-top:6px;">＊各コースとも、定員は20名です。定員を超えた場合は抽選になります。<br>＊指導者コースの受講には、活動報告書の提出が必要です。</p>`, sectionLabel: `読解 · Pencarian Informasi`, problemNumber: 12 },

      function shuffle(arr) {
        const a = [...arr]
        for (let i = a.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1))
          const tmp = a[i]
          a[i] = a[j]
          a[j] = tmp

        return a

      function pickDistinctIndices(poolLength, count, excludedIndex) {
        const indices = []
        while (indices.length < count) {

          if (next === excludedIndex) continue
          if (indices.includes(next)) continue
          indices.push(next)
        }
        return indices
      }

        const options = entry.choices.map((t, i) => ({ id: letters[i], text: t }))
        const correctOptionId = letters[entry.a]
        return {
          id: `${levelKey}-synonym-${String(index + 1).padStart(4, "0")}`,
          type: "synonym",
          typeLabel: "いみ / Sinonim",
          prompt: { primary: entry.s, secondary: "Cari kalimat yang artinya sama" },
          questionText: "＿＿＿＿ の ぶんと だいたい おなじ いみの ぶんは どれですか。",
          questionSub: "Pilih kalimat yang memiliki arti paling mirip.",
          options,
          correctOptionId,
          feedbackCorrect: entry.choices[entry.a]
        }
      }
      function makeOfficialQuestion(levelKey, entry, index) {
        const letters = ["A", "B", "C", "D"]
        const options = entry.choices.map((t, i) => ({ id: letters[i], text: t }))
        const correctOptionId = letters[entry.a]
        return {
          id: `${levelKey}-official-${String(index + 1).padStart(4, "0")}`,
          type: "official",
          problemNumber: entry.problemNumber,
          typeLabel: entry.sectionLabel || "問題 / Latihan Resmi",
          vocabRef: null,
          prompt: { primary: entry.passage || "", secondary: entry.passage ? "Baca teks di atas, lalu jawab pertanyaannya." : "Pilih jawaban yang paling tepat." },
          questionText: entry.q,
          questionSub: entry.sectionLabel || "",
          options,
          correctOptionId,
          feedbackCorrect: entry.choices[entry.a],
          explanationText: entry.explanation
        }
      }

      // officialBank problemNumber schemes differ per level:
      //   N5: 1-5 (vocab/mcq), 6 (narabi), 7-10 (reading)
      //   N4: 1-6 (vocab/mcq incl. single-blank grammar), 7 (narabi), 8-11 (reading)
      //   N3: 1-6 (vocab/mcq incl. advanced grammar pattern), 7 (narabi), 8-12 (reading, incl. an extra
      //       Bacaan Panjang tier between Bacaan Pendek/Menengah and the info-search tier)
      // All three share the same officialBank shape, but the problemNumber ranges differ per level, so
      // category matching for "official" questions is level-aware via the levelKey prefix embedded in
      // q.id (see makeOfficialQuestion: `${levelKey}-official-...`).
      function officialLevelKeyOf(q) {
        return q.id ? q.id.split("-")[0] : null
      }

      const OFFICIAL_LEVEL_SCHEME = {
        n5: { mcqMax: 5, narabi: 6, reading: [7, 8, 9, 10] },
        n4: { mcqMax: 6, narabi: 7, reading: [8, 9, 10, 11] },
        n3: { mcqMax: 6, narabi: 7, reading: [8, 9, 10, 11, 12] }
      }
      function officialSchemeOf(q) {
        return OFFICIAL_LEVEL_SCHEME[officialLevelKeyOf(q)] || OFFICIAL_LEVEL_SCHEME.n5
      }

      const CATEGORY_GROUPS = [
        {
          id: "mcq",
          icon: "📘",
          label: "Pilihan Ganda",
          desc: "Kanji, kosakata, partikel, dan pola tata bahasa.",
          match: (q) => {
            if (q.type !== "official") return ["reading", "kanji", "particle", "pattern", "synonym"].includes(q.type)
            const scheme = officialSchemeOf(q)
            return q.problemNumber >= 1 && q.problemNumber <= scheme.mcqMax
          }
        },
        {
          id: "narabi",
          icon: "★",
          label: "Susunan Kalimat",
          desc: "Latihan menyusun potongan kata menjadi kalimat yang benar.",
          match: (q) => {
            if (q.type !== "official") return q.type === "narabi"
            return q.problemNumber === officialSchemeOf(q).narabi
          }
        },
        {
          id: "reading",
          icon: "📖",
          label: "Pemahaman Bacaan",
          desc: "Lengkapi bacaan dan pahami teks panjang / dokai.",
          match: (q) => {
            if (q.type !== "official") return q.type === "story"
            return officialSchemeOf(q).reading.includes(q.problemNumber)
          }
        }
      ]

      const OFFICIAL_SUBTAGS = [
        { problemNumber: 1, label: "P1" },
        { problemNumber: 2, label: "P2" },
        { problemNumber: 3, label: "P3" },
        { problemNumber: 4, label: "P4" },
        { problemNumber: 5, label: "P5" },
        { problemNumber: 6, label: "P6" },
        { problemNumber: 7, label: "P7" },
        { problemNumber: 8, label: "P8" },
        { problemNumber: 9, label: "P9" },
        { problemNumber: 10, label: "P10" },
        { problemNumber: 11, label: "P11" },
        { problemNumber: 12, label: "P12" }
      ]

      const CATEGORY_SESSION_CAP = 60

      function buildFilteredPool(levelKey, categoryId, problemNumber) {
        const fullPool = buildQuestionPool(levelKey)
        const category = CATEGORY_GROUPS.find((c) => c.id === categoryId)
        let filtered = category ? fullPool.filter(category.match) : fullPool
        if (problemNumber != null) {
          filtered = filtered.filter((q) => q.problemNumber === Number(problemNumber))
        }
        return shuffle(filtered)
      }

      function startCategorySession(categoryId, problemNumber) {
        const filtered = buildFilteredPool(state.levelKey, categoryId, problemNumber)
        if (!filtered.length) return
        markProfileActive(state.profile)
        syncN5RoadmapCompletionFromXp()
        persistProgress()
        state.screen = "quiz"
        state.mode = "normal"
        state.sessionQuestions = filtered.length > CATEGORY_SESSION_CAP ? filtered.slice(0, CATEGORY_SESSION_CAP) : filtered
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        state.savedWrongList = []
        state.lastResult = null
        render()
      }

      function buildQuestionPool(levelKey) {
        const level = levels[levelKey]
        const pool = []

        if ((levelKey === "n5" || levelKey === "n4" || levelKey === "n3") && level.officialBank && level.officialBank.length) {
          for (let i = 0; i < level.officialBank.length; i += 1) {
            pool.push(makeOfficialQuestion(levelKey, level.officialBank[i], pool.length))
          }
          return pool
        }

        const vocabLimit = (levelKey === "n4" || levelKey === "n3") ? 30 : level.vocab.length
        const vocabIndices = shuffle([...Array(level.vocab.length).keys()]).slice(0, vocabLimit)
        for (let vi = 0; vi < vocabIndices.length; vi += 1) { const i = vocabIndices[vi]
          pool.push(makeReadingQuestion(levelKey, level.vocab[i], i, pool.length))
          pool.push(makeKanjiQuestion(levelKey, level.vocab[i], i, pool.length))
        }
        for (let i = 0; i < level.particleBank.length; i += 1) {
          pool.push(makeParticleQuestion(levelKey, level.particleBank[i], pool.length))
        }
        for (let i = 0; i < level.patternBank.length; i += 1) {
          pool.push(makePatternQuestion(levelKey, level.patternBank[i], pool.length))
        }
        for (let i = 0; i < level.storyBank.length; i += 1) {
          pool.push(makeStoryQuestion(levelKey, level.storyBank[i], pool.length))
          pool.push(makeStoryQuestion(levelKey, level.storyBank[i], pool.length))
        }
        if (level.narabiBank) {
          for (let i = 0; i < level.narabiBank.length; i += 1) {
            pool.push(makeNarabiQuestion(levelKey, level.narabiBank[i], pool.length))
            pool.push(makeNarabiQuestion(levelKey, level.narabiBank[i], pool.length))
          }
        }
        if (level.synonymBank) {
          for (let i = 0; i < level.synonymBank.length; i += 1) {
            pool.push(makeSynonymQuestion(levelKey, level.synonymBank[i], pool.length))
            pool.push(makeSynonymQuestion(levelKey, level.synonymBank[i], pool.length))
          }
        }
        return pool
      }

      function persistProgress() {
        saveProgressState({
          profile: state.profile,
          roadmapCompleted: state.roadmapCompleted,
          vocabProgress: state.vocabProgress,
          roadmapLevelXp: state.roadmapLevelXp
        })

      function syncN5RoadmapCompletionFromN5Xp() {
        const milestones = n5RoadmapMilestones()
        const xp = roadmapLevelXp("n5")
        const levelKey = "n5"
        if (!state.roadmapCompleted || typeof state.roadmapCompleted !== "object") state.roadmapCompleted = {}
        const prev = state.roadmapCompleted[levelKey] && typeof state.roadmapCompleted[levelKey] === "object"
          ? state.roadmapCompleted[levelKey]
          : {}
        const next = {}
        for (let i = 0; i < milestones.length; i += 1) {
          if (xp >= milestones[i].targetXp) next[String(i)] = true
        }
        const prevKeys = Object.keys(prev)
        const nextKeys = Object.keys(next)
        const changed = prevKeys.length !== nextKeys.length || nextKeys.some((key) => !prev[key])
        state.roadmapCompleted[levelKey] = next
        return changed
      }

      function questionLevelKey(q) {
        if (!q || typeof q !== "object") return state.levelKey
        const refLevelKey = q?.vocabRef?.levelKey
        if (refLevelKey) return refLevelKey
        const id = String(q.id || "")
        const match = id.match(/^([^-]+)-/)
        return match?.[1] || state.levelKey
      }

      function activeSessionPreviewXp() {
        if (state.screen !== "quiz") return 0
        if (state.mode !== "normal") return 0
        if (!state.sessionQuestions.length || state.lastResult) return 0
        return Math.max(0, Number(state.sessionEarnedXp) || 0)
      }

      function trackVocabProgressFromAnswer(q, isCorrect) {
        const ref = q?.vocabRef
        if (!ref) return false
        const key = `${ref.levelKey}:${ref.index}`
        const existing = state.vocabProgress?.[key]
        const next = existing && typeof existing === "object"
          ? { ...existing }
          : { seen: 0, correct: 0, wrong: 0, mastered: false, lastSeenDate: null }
        next.seen = Math.max(0, Number(next.seen) || 0) + 1
        if (isCorrect) next.correct = Math.max(0, Number(next.correct) || 0) + 1
        else next.wrong = Math.max(0, Number(next.wrong) || 0) + 1
        next.mastered = Boolean(next.mastered) || (next.correct >= 3)
        next.lastSeenDate = currentDateKey(new Date())
        if (!state.vocabProgress || typeof state.vocabProgress !== "object") state.vocabProgress = {}
        state.vocabProgress[key] = next
        return true
      }

      function currentQuestion() {
        return state.sessionQuestions[state.questionIndex]
      }

      function currentLevel() {
        return levels[state.levelKey]
      }

      function sessionProgressPercent() {
        const total = state.sessionQuestions.length
        if (!total) return 0
        return Math.max(0, Math.min(100, Math.round(((state.questionIndex + 1) / total) * 100)))
      }

      function levelProgressData() {
        const xp = (Number(state.profile.totalXp) || 0) + activeSessionPreviewXp()
        const level = levelFromXp(xp)
        const minXp = profileMinXpForLevel(level)
        const nextXp = profileNextXpTarget(level)
        const pct = nextXp ? Math.round(((xp - minXp) / Math.max(1, nextXp - minXp)) * 100) : 100
        return {
          xp,
          level,
          minXp,
          nextXp,
          pct: Math.max(0, Math.min(100, pct)),
          xpNeeded: nextXp ? Math.max(0, nextXp - xp) : 0
        }
      }

      function getResultMetrics() {
        const total = state.sessionQuestions.length
        const maxScore = total * POINTS_PER_CORRECT
        const correctCount = Math.round(state.score / POINTS_PER_CORRECT)
        const wrongCount = state.wrongList.reduce((acc, item) => acc + (item.count ?? 0), 0)
        const accuracy = total ? Math.round((correctCount / total) * 100) : 0
        return { total, maxScore, correctCount, wrongCount, accuracy }
      }

      function resultMessage(score, maxScore) {
        const ratio = maxScore === 0 ? 0 : score / maxScore
        if (ratio >= 0.9) return "Luar biasa. Kamu sudah masuk zona belajar premium."
        if (ratio >= 0.75) return "Bagus banget. Tinggal sedikit lagi untuk performa top-tier."
        if (ratio >= 0.55) return "Progress kamu sehat. Konsistensi akan bikin skor naik cepat."
        return "Pondasinya sudah ada. Review yang salah lalu ulangi dengan ritme santai."
      }

      function learningAchievements() {
        const result = state.lastResult || getResultMetrics()
        const accuracy = shouldTrackSessionProgression()
          ? (result.accuracy || 0)
          : (state.profile.bestAccuracy || 0)
        const xp = state.profile.totalXp

        const sessionsPlayed = state.profile.sessionsPlayed

        return [

      }

      function n5RoadmapMilestones() {
        return [
          { title: "Hiragana & Katakana Mastery", icon: "あ", targetXp: 100 },
          { title: "Core Vocabulary Foundation", icon: "📚", targetXp: 250 },
          { title: "Basic Kanji + Reading Habit", icon: "字", targetXp: 500 },
          { title: "Grammar Patterns & Particles", icon: "🧩", targetXp: 800 },

        ]
      }

      function n5RoadmapSectionHtml() {
        const xp = state.profile.totalXp
        const milestones = n5RoadmapMilestones()
        const persistedCompleted = state.roadmapCompleted?.n5 || {}
        const finalTarget = milestones[milestones.length - 1]?.targetXp || 1
        const overallPct = Math.max(0, Math.min(100, Math.round((xp / finalTarget) * 100)))
        const completedCount = milestones.reduce((acc, item, index) => acc + ((xp >= item.targetXp || persistedCompleted[String(index)]) ? 1 : 0), 0)

        const itemsHtml = milestones.map((item, index) => {
          const prevTarget = index === 0 ? 0 : milestones[index - 1].targetXp
          const isComplete = xp >= item.targetXp || persistedCompleted[String(index)]
          const isCurrent = !isComplete && xp >= prevTarget
          const pct = isComplete
            ? 100
            : xp <= prevTarget
              ? 0
              : Math.round(((xp - prevTarget) / Math.max(1, item.targetXp - prevTarget)) * 100)

          const statusLabel = isComplete ? "Completed" : isCurrent ? "Current" : "Locked"
          const statusClass = isComplete ? "status-pill--success" : isCurrent ? "status-pill--info" : "status-pill--warning"
          const rowClass = isComplete ? "is-complete" : isCurrent ? "is-current" : "is-locked"
          const segmentCurrent = Math.min(Math.max(0, xp - prevTarget), item.targetXp - prevTarget)

          return `
            <article class="roadmap-item ${rowClass}">
              <div class="roadmap-marker" aria-hidden="true">
                <div class="roadmap-marker__icon">${escapeHtml(item.icon)}</div>
              </div>
              <div class="roadmap-body">
                <div class="roadmap-item__top">
                  <div>
                    <h3 class="roadmap-item__title">${escapeHtml(item.title)}</h3>
                    <p class="roadmap-item__meta">Target ${formatNumber(item.targetXp)} XP</p>
                  </div>
                  <span class="status-pill ${statusClass}">${statusLabel}</span>
                </div>
                <div class="roadmap-item__progress">
                  ${miniProgressHtml(pct)}
                  <div class="roadmap-progress__meta">
                    <span>${pct}%</span>
                    <span>${formatNumber(segmentCurrent)} / ${formatNumber(item.targetXp - prevTarget)} XP</span>
                  </div>
                </div>
              </div>
            </article>
          `
        }).join("")

        return `
          <section class="surface-card">
            <div class="surface-card__header">
              <div>
                <p class="section-caption">JLPT N5 Roadmap</p>
                <h2 class="section-title">Roadmap belajar dari nol sampai siap ujian N5</h2>
                <p class="section-note">Milestone membantu kamu melihat progres secara vertikal: selesai, sedang dikerjakan, dan yang masih terkunci.</p>
              </div>
              <span class="status-pill status-pill--info">${overallPct}%</span>
            </div>
            ${progressBarHtml(overallPct, `${completedCount}/${milestones.length} milestone`, `Target ${formatNumber(finalTarget)} XP`)}
            <div class="roadmap">${itemsHtml}</div>
          </section>
        `
      }

      function recordWrong(q, selectedText, correctText) {
        const existing = state.wrongList.find((item) => item.qId === q.id)
        if (!existing) {
          state.wrongList.push({ qId: q.id, q, selectedText, correctText, count: 1 })
          return
        }
        existing.count += 1
        existing.selectedText = selectedText
        existing.correctText = correctText
      }

      function buildWrongReviewQuestions() {
        const base = state.savedWrongList.length ? state.savedWrongList : state.wrongList
        const uniq = []
        const seen = new Set()
        for (const item of base) {
          const id = item.q?.id
          if (!id || seen.has(id)) continue
          seen.add(id)
          uniq.push(item.q)
        }
        return shuffle(uniq)
      }

      function buildSessionQuestions() {
        const pool = buildQuestionPool(state.levelKey)
        const size = Math.min(Math.max(SESSION_SIZE_TARGET, 100), 200)
        const shuffled = shuffle(pool)
        if (shuffled.length >= size) return shuffled.slice(0, size)
        const out = []
        while (out.length < size) {
          out.push(shuffled[out.length % shuffled.length])
        }
        return out
      }

      function renderHome() {
        const activeLevel = currentLevel()
        const stats = levelStats(activeLevel)
        const progress = levelProgressData()
        const achievements = learningAchievements().slice(0, 3)
        const totalQuestions = SESSION_SIZE_TARGET
        const sessionXp = totalQuestions * POINTS_PER_CORRECT

        const achievementCards = achievements.map((item) => `
          <article class="achievement-card ${item.earned ? "is-earned" : ""}">
            <div class="achievement-card__icon" aria-hidden="true">${item.icon}</div>
            <h3 class="achievement-card__title">${item.title}</h3>
            <p class="achievement-card__desc">${item.desc}</p>
          </article>
        `).join("")

        app.innerHTML = `
          <section class="progress-grid">
            ${metricCardHtml("Total XP", formatNumber(progress.xp), progress.nextXp ? `${formatNumber(progress.xpNeeded)} XP lagi ke level selanjutnya.` : "Level maksimum tercapai.", "metric-card__value--primary")}
            ${metricCardHtml("Current Level", `Level ${progress.level}`, `Aktif belajar di track ${currentLevel().label}.`)}
            ${metricCardHtml("Best Accuracy", `${formatNumber(state.profile.bestAccuracy)}%`, "Angka ini membantu pengguna membaca performa terbaiknya dengan cepat.")}
            ${metricCardHtml("Sessions", formatNumber(state.profile.sessionsPlayed), "Total sesi selesai yang tersimpan di local profile.")}
          </section>

          <section class="surface-card progress-panel">
            <div class="progress-head">
              <div>
                <p class="section-caption">XP System</p>
                <h2 class="progress-head__title">Progress bar dan growth system</h2>
                <p class="progress-note">Visual progress dibuat jelas, ringan, dan tetap terasa premium di layar kecil maupun desktop.</p>
              </div>
            </div>
            ${progressBarHtml(progress.pct, `XP ${formatNumber(progress.xp)}`, progress.nextXp ? `Target ${formatNumber(progress.nextXp)}` : "MAX")}
          </section>

          <section class="surface-card">
            <div class="surface-card__header">
              <div>
                <p class="section-caption">Learning Path</p>
                <h2 class="section-title">Track progression per level</h2>
                <p class="section-note">Timeline ini memvisualisasikan jalur pembelajaran seperti dashboard SaaS modern.</p>
              </div>
            </div>
            <div class="performance-grid">${timeline}</div>
          </section>

          <section class="surface-card">
            <div class="surface-card__header">
              <div>
                <p class="section-caption">Session Insight</p>
                <h2 class="section-title">Snapshot performa terbaru</h2>
                <p class="section-note">Cocok untuk menunjukkan progres personal yang mudah dipahami dalam 1 layar.</p>
              </div>
            </div>
            <div class="summary-grid">
              ${metricCardHtml("Latest Accuracy", `${formatNumber(result.accuracy)}%`, "Akurasi dari sesi terakhir yang tersimpan di memori aplikasi.")}
              ${metricCardHtml("Latest Score", formatNumber(state.score), "Skor terbaru yang bisa langsung dibandingkan dengan sesi berikutnya.")}
              ${metricCardHtml("Review Items", formatNumber(result.wrongCount), "Jumlah jawaban salah yang siap direview setelah sesi selesai.")}
            </div>
          </section>

          <section class="surface-card">
            <div class="surface-card__header">
              <div>
                <p class="section-caption">Achievement Library</p>
                <h2 class="section-title">Reusable reward cards</h2>
                <p class="section-note">Komponen ini bisa dipakai ulang di dashboard, results, maupun progress screen.</p>
              </div>
            </div>
            <div class="achievement-grid">${achievementCards}</div>
          </section>
        `
      }

      function syncN5RoadmapCompletionFromXp() {
        const milestones = n5RoadmapMilestones()
        const xp = state.profile.totalXp
        const levelKey = "n5"
        if (!state.roadmapCompleted || typeof state.roadmapCompleted !== "object") state.roadmapCompleted = {}
        if (!state.roadmapCompleted[levelKey] || typeof state.roadmapCompleted[levelKey] !== "object") {
          state.roadmapCompleted[levelKey] = {}
        }
        const map = state.roadmapCompleted[levelKey]
        let changed = false
        for (let i = 0; i < milestones.length; i += 1) {
          if (xp >= milestones[i].targetXp && !map[String(i)]) {
            map[String(i)] = true
            changed = true
          }
        }
        return changed
      }
      function render() {
        renderTopbar()
        renderSidebar()
        renderBottomNav()
        renderScreenBanner()
        setDocumentTitle()

        if (state.screen === "home") {
          renderHome()
          return
        }

        if (state.screen === "vocabulary") {
          renderVocabulary()
          return
        }

        if (state.screen === "quiz") {
          renderQuiz()
          return
        }

        if (state.screen === "wrongList") {
          renderWrongList()
          return
        }

        if (state.screen === "progress") {
          renderProgress()
          return
        }

        if (state.screen === "categories") {
          renderCategories()
          return
        }

        renderResult()
      }

      function completeSessionIfNeeded() {
        const result = getResultMetrics()
        state.lastResult = result
        if (state.mode !== "reviewWrong" && state.sessionEarnedXp) {
          const xpChanged = addXp(state.profile, state.sessionEarnedXp)
          if (xpChanged) syncN5RoadmapCompletionFromXp()
        }
        if (shouldTrackSessionProgression()) registerSession(state.profile, result.accuracy)
        state.sessionEarnedXp = 0
        persistProgress()
      }

      function rollbackActiveSessionXp() {
        if (state.mode !== "normal") return false
        if (!state.sessionQuestions.length || state.lastResult) return false
        if (!state.sessionEarnedXp) return false
        state.sessionEarnedXp = 0
        return true
      }

      function resetGame() {
        rollbackActiveSessionXp()
        state.screen = "home"
        state.mode = "normal"
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        state.savedWrongList = []
        state.sessionQuestions = []
        state.lastResult = null
        render()
      }

      function startGame() {
        markProfileActive(state.profile)
        syncN5RoadmapCompletionFromXp()
        persistProgress()
        state.screen = "quiz"
        state.mode = "normal"
        state.sessionQuestions = buildSessionQuestions()
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        state.savedWrongList = []
        state.lastResult = null
        render()
      }

      function startWrongReview() {
        const base = state.savedWrongList.length ? state.savedWrongList : state.wrongList
        if (!base.length) {
          state.screen = "wrongList"
          render()
          return
        }
        markProfileActive(state.profile)
        syncN5RoadmapCompletionFromXp()
        persistProgress()
        state.mode = "reviewWrong"
        state.screen = "quiz"
        state.sessionQuestions = buildWrongReviewQuestions()
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        render()
      }

      function restartSession() {
        if (state.mode === "reviewWrong") {
          startWrongReview()
          return
        }
        rollbackActiveSessionXp()
        startGame()
      }

      function goToScreen(screen) {
        if (screen === "quiz" && !state.sessionQuestions.length) {
          state.screen = "quiz"
          render()
          return
        }
        state.screen = screen
        render()
      }

      function onAnswer(optionId) {
        const q = currentQuestion()
        if (!q) return
        const streakChanged = markProfileActive(state.profile)

        const correctOpt = q.options.find((o) => o.id === q.correctOptionId)
        const selectedOpt = q.options.find((o) => o.id === optionId)
        const isCorrect = optionId === q.correctOptionId
        const correctText = q.feedbackCorrect ?? correctOpt?.text ?? ""

        const vocabChanged = trackVocabProgressFromAnswer(q, isCorrect)
        let shouldPersist = streakChanged || vocabChanged

        if (isCorrect) {
          state.score += POINTS_PER_CORRECT
          if (state.mode !== "reviewWrong") {
            state.sessionEarnedXp += POINTS_PER_CORRECT
          }
        } else {
          recordWrong(q, selectedOpt?.text ?? "", correctText)
          shouldPersist = true
        }

        state.feedback = {
          isCorrect,
          selectedId: selectedOpt?.id ?? optionId,
          correctId: q.correctOptionId,
          correctText,
          explanation: buildAnswerExplanation(q, correctText)
        }

        if (shouldPersist) persistProgress()
        render()
      }

      function next() {
        state.feedback = null
        if (state.questionIndex >= state.sessionQuestions.length - 1) {
          completeSessionIfNeeded()
          state.screen = "result"
          render()
          return
        }
        state.questionIndex += 1
        render()
      }

      function handleAction(el) {
        const action = el.getAttribute("data-action")
        if (!action) return

        if (action === "pick-level") {
          const key = el.getAttribute("data-level")
          if (!key || !levels[key]) return
          state.levelKey = key
          render()
          return
        }

        if (action === "navigate") {
          const screen = el.getAttribute("data-screen")
          if (!screen) return
          goToScreen(screen)
          return
        }

        if (action === "start") {
          startGame()
          return
        }

        if (action === "start-category") {
          const categoryId = el.getAttribute("data-category")
          const problemNumber = el.getAttribute("data-problem")
          startCategorySession(categoryId, problemNumber ? Number(problemNumber) : null)
          return
        }

        if (action === "restart") {
          restartSession()
          return
        }

        if (action === "reset") {
          resetGame()
          return
        }

        if (action === "answer") {
          if (state.feedback) return
          const optionId = el.getAttribute("data-option-id")
          if (!optionId) return
          onAnswer(optionId)
          return
        }

        if (action === "next") {
          next()
          return
        }

        if (action === "wrong-list") {
          if (state.wrongList.length) state.savedWrongList = [...state.wrongList]
          state.screen = "wrongList"
          render()
          return
        }

        if (action === "review-wrong") {
          if (!state.savedWrongList.length && state.wrongList.length) {
            state.savedWrongList = [...state.wrongList]
          }
          startWrongReview()
          return
        }

        if (action === "back-result") {
          state.screen = "result"
          render()
        }
      }

      function bindActionRoot(root) {
        root.addEventListener("click", (event) => {
          const el = event.target instanceof Element ? event.target.closest("[data-action]") : null
          if (!el) return
          handleAction(el)
        })
      }

      bindActionRoot(app)
      bindActionRoot(sidebar)
      bindActionRoot(bottomNav)
      bindActionRoot(screenBanner)

      setBrand()
      if (syncN5RoadmapCompletionFromXp()) persistProgress()
      render()
    </script>
  </body>
</html>
