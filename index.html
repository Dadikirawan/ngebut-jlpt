<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ngebut JLPT</title>
    <style>
      :root{
        --bg0:#fff7fb;
        --bg1:#f3f7ff;
        --ink:#181a2a;
        --muted:rgba(24,26,42,.72);
        --muted2:rgba(24,26,42,.58);
        --a:#5aa7ff;
        --b:#2fd2b0;
        --c:#ffbf5a;
        --bad:#ff4f8f;
        --good:#2fd2b0;
        --gap:14px;
        --shadow:0 18px 45px rgba(17,20,34,.14);
      }

      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        color:var(--ink);
        background:
          radial-gradient(1200px 600px at 20% 0%, rgba(90,167,255,.20), transparent 60%),
          radial-gradient(1000px 700px at 90% 20%, rgba(47,210,176,.18), transparent 55%),
          radial-gradient(900px 700px at 60% 110%, rgba(255,191,90,.18), transparent 55%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        font-family: ui-sans-serif, -apple-system, system-ui, "Avenir Next", "Avenir", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", sans-serif;
        letter-spacing:.1px;
        -webkit-text-size-adjust:100%;
        text-size-adjust:100%;
      }

      body::before{
        content:"";
        position:fixed;
        inset:-220px;
        background:conic-gradient(from 210deg at 50% 50%, rgba(90,167,255,.20), rgba(47,210,176,.18), rgba(255,191,90,.16), rgba(255,79,143,.14), rgba(90,167,255,.20));
        filter:blur(70px);
        opacity:.55;
        animation:drift 12s ease-in-out infinite alternate;
        pointer-events:none;
        z-index:-1;
      }

      @keyframes drift{from{transform:translate3d(-2%, -1%, 0) rotate(-6deg)}to{transform:translate3d(2%, 1%, 0) rotate(6deg)}}

      .shell{min-height:100%;display:grid;place-items:center;padding:clamp(12px, 3vw, 22px);padding-bottom:calc(clamp(12px, 3vw, 22px) + env(safe-area-inset-bottom));}

      .frame{
        width:min(980px, 100%);
        background:linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.76));
        border:1px solid rgba(24,26,42,.10);
        border-radius:26px;
        box-shadow:var(--shadow);
        padding:clamp(12px, 2.4vw, 18px);
        backdrop-filter: blur(10px);
      }

      .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 8px 16px 8px;}
      .brand{display:flex;align-items:center;gap:12px;}
      .brand__mark{
        width:44px;height:44px;display:grid;place-items:center;border-radius:14px;
        border:1px solid rgba(24,26,42,.14);
        background:linear-gradient(180deg, rgba(90,167,255,.18), rgba(255,255,255,.70));
        color:rgba(24,26,42,.92);
        font-weight:950;
        letter-spacing:.6px;
      }
      .brand__title{font-weight:900;font-size:18px;}
      .brand__subtitle{color:var(--muted2);font-size:12px;margin-top:2px;line-height:1.25;}

      .badge{
        font-weight:900;border:1px solid rgba(24,26,42,.14);border-radius:999px;padding:10px 14px;
        background:linear-gradient(180deg, rgba(255,191,90,.30), rgba(255,255,255,.72));
        color:rgba(24,26,42,.92);
      }

      .stage{
        border-radius:22px;border:1px solid rgba(24,26,42,.10);
        background:linear-gradient(180deg, rgba(255,255,255,.60), rgba(255,255,255,.42));
        padding:clamp(14px, 2.4vw, 18px);
        min-height:min(560px, calc(100vh - 190px));
        position:relative;
        overflow:auto;
      }

      .foot{padding:14px 8px 6px 8px;text-align:center;color:var(--muted2);font-size:12px;}

      .panel{max-width:780px;margin:0 auto;display:grid;gap:var(--gap);}
      .hero{text-align:center;padding:18px 10px;display:grid;gap:12px;}
      .hero__h{font-size:clamp(26px, 4.6vw, 34px);font-weight:950;letter-spacing:.2px;}
      .hero__p{color:var(--muted);font-size:clamp(14px, 2.6vw, 16px);line-height:1.5;}

      .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}

      .pill{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(24,26,42,.12);background:rgba(255,255,255,.60);padding:10px 12px;border-radius:999px;font-weight:900;color:rgba(24,26,42,.92);}
      .pill__muted{color:var(--muted);font-weight:900;}

      .pill--type{border-color:rgba(24,26,42,.12);background:linear-gradient(180deg, rgba(90,167,255,.14), rgba(255,255,255,.62));}

      .card{border:1px solid rgba(24,26,42,.12);border-radius:22px;padding:16px;background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.56));}

      .grid{display:grid;grid-template-columns: 1fr;gap:12px;}

      .level{border:1px solid rgba(24,26,42,.12);border-radius:22px;padding:14px;background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.56));display:grid;gap:10px;}
      .level__top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
      .level__name{font-weight:950;font-size:18px;}
      .level__desc{color:var(--muted2);font-weight:800;font-size:12px;line-height:1.35;margin-top:4px;}
      .level__meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
      .level__lock{color:rgba(24,26,42,.88);font-weight:950;}

      .tag{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;border:1px solid rgba(24,26,42,.12);background:rgba(255,255,255,.66);font-weight:900;color:rgba(24,26,42,.92);font-size:12px;}

      .prompt{display:grid;place-items:center;padding:18px 14px;background:linear-gradient(180deg, rgba(90,167,255,.16), rgba(255,255,255,.62));border-radius:20px;border:1px dashed rgba(24,26,42,.18);}
      .prompt__primary{font-size:clamp(30px, 7vw, 42px);font-weight:950;letter-spacing:.4px;line-height:1.15;text-align:center;}
      .prompt__secondary{color:var(--muted);font-weight:900;font-size:14px;margin-top:10px;text-align:center;}

      .q{font-size:18px;font-weight:900;line-height:1.4;}
      .q__sub{margin-top:8px;color:var(--muted2);font-size:13px;font-weight:800;line-height:1.35;}

      .answers{display:grid;grid-template-columns:1fr;gap:12px;}

      .btn{appearance:none;border:1px solid rgba(24,26,42,.14);background:linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,255,255,.56));border-radius:20px;padding:14px 14px;text-align:left;cursor:pointer;transition: transform .08s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;color:rgba(24,26,42,.92);font-family:inherit;}
      .btn:hover{transform:translateY(-2px);border-color:rgba(24,26,42,.26);box-shadow:0 18px 40px rgba(17,20,34,.18);}
      .btn:active{transform:translateY(1px);}
      .btn:focus-visible{outline:4px solid rgba(90,167,255,.35);outline-offset:2px;}
      .btn[disabled]{cursor:not-allowed;opacity:.75;transform:none;box-shadow:none;}

      .btn__top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
      .btn__label{font-weight:950;font-size:clamp(16px, 2.6vw, 18px);}
      .btn__tag{font-weight:950;width:34px;height:34px;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(24,26,42,.14);background:rgba(255,255,255,.66);color:rgba(24,26,42,.92);}

      .btn--a{border-color:rgba(90,167,255,.42);} .btn--b{border-color:rgba(47,210,176,.42);} .btn--c{border-color:rgba(255,191,90,.42);} 
      .btn--right{border-color:rgba(47,210,176,.72);background:linear-gradient(180deg, rgba(47,210,176,.16), rgba(255,255,255,.56));}
      .btn--wrong{border-color:rgba(255,79,143,.72);background:linear-gradient(180deg, rgba(255,79,143,.12), rgba(255,255,255,.56));animation:shake .18s ease 2;}

      @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}

      .feedback{border-radius:20px;border:1px solid rgba(24,26,42,.12);background:rgba(255,255,255,.70);padding:14px;display:grid;gap:10px;}
      .feedback__h{font-size:18px;font-weight:950;}
      .feedback__p{color:var(--muted);font-weight:850;line-height:1.4;}

      .cta{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:6px;}
      .cta .btn{min-width:min(240px, 100%);width:min(340px, 100%);text-align:center;}

      .small{background:rgba(255,255,255,.66);border:1px solid rgba(24,26,42,.12);border-radius:16px;padding:10px 12px;font-weight:900;cursor:pointer;color:rgba(24,26,42,.92);font-family:inherit;transition: transform .08s ease, border-color .18s ease;}
      .small:hover{transform:translateY(-1px);border-color:rgba(24,26,42,.24);} .small:active{transform:translateY(1px);}

      .progress{height:10px;border-radius:999px;border:1px solid rgba(24,26,42,.12);background:rgba(255,255,255,.56);overflow:hidden;}
      .progress__bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg, rgba(90,167,255,.95), rgba(47,210,176,.95), rgba(255,191,90,.92));box-shadow:0 14px 30px rgba(17,20,34,.12);transition: width .22s ease;}

      .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:rgba(250,245,255,.62);border-radius:22px;}
      .overlay__card{width:min(720px, 100%);border:1px solid rgba(24,26,42,.14);border-radius:24px;padding:16px;background:linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.70));box-shadow:0 30px 70px rgba(17,20,34,.16);}

      .nb-card{border:2px solid rgba(24,26,42,.82);background:rgba(255,255,255,.70);box-shadow:10px 10px 0 rgba(24,26,42,.18);border-radius:18px;padding:16px;}
      .resultGrid{display:grid;grid-template-columns:1fr;gap:12px;}
      .resultHero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
      .scoreBig{font-weight:950;font-size:44px;letter-spacing:.2px;}
      .scoreSub{color:var(--muted);font-weight:850;}
      .ring{width:132px;height:132px;border-radius:999px;display:grid;place-items:center;border:2px solid rgba(24,26,42,.82);box-shadow:10px 10px 0 rgba(24,26,42,.18);background:rgba(255,255,255,.70);}
      .ring__inner{width:96px;height:96px;border-radius:999px;border:2px solid rgba(24,26,42,.82);background:rgba(255,255,255,.66);display:grid;place-items:center;}
      .ring__pct{font-weight:950;font-size:22px;}
      .stats{display:grid;grid-template-columns:1fr;gap:12px;}
      .statKey{color:var(--muted2);font-weight:900;font-size:12px;letter-spacing:.6px;text-transform:uppercase;}
      .statVal{font-weight:950;font-size:20px;margin-top:6px;}

      @media (max-width: 420px){
        .shell{padding:0;padding-bottom:env(safe-area-inset-bottom);}
        .frame{border-radius:0;border:0;box-shadow:none;padding:12px;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;}
        .top{padding:8px 10px 10px 10px;gap:10px;}
        .brand__mark{width:38px;height:38px;border-radius:12px;}
        .brand__title{font-size:16px;}
        .brand__subtitle{font-size:11px;}
        .badge{padding:8px 12px;}
        .stage{padding:12px;min-height:0;flex:1;overflow:auto;border-radius:18px;}
        .foot{padding:10px 12px 14px 12px;}
        .cta .btn{width:100%;min-width:0;}
      }

      @supports (height: 100svh){
        .stage{min-height:min(560px, calc(100svh - 190px));}
      }

      @media (min-width: 560px){
        .answers{grid-template-columns:1fr 1fr;}
      }

      @media (min-width: 760px){
        .answers{grid-template-columns:1fr 1fr 1fr;}
        .grid{grid-template-columns: 1fr 1fr 1fr;}
        .resultGrid{grid-template-columns:1fr 1fr;align-items:stretch;}
        .stats{grid-template-columns:1fr 1fr;}
      }

      @media (min-width: 980px){
        .resultGrid{grid-template-columns:1.1fr .9fr;}
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="frame">
        <header class="top">
          <div class="brand">
            <div class="brand__mark" id="brandMark" aria-hidden="true">NJ</div>
            <div class="brand__text">
              <div class="brand__title" id="brandTitle">Ngebut JLPT</div>
              <div class="brand__subtitle" id="brandSubtitle">Main 10 menit sehari • skor naik, level naik</div>
            </div>
          </div>
          <div class="badge" id="levelBadge">N5</div>
        </header>

        <section class="stage" id="app" aria-live="polite"></section>

        <footer class="foot">Latihan cepat: baca → pilih → feedback → ulangi. Ada Daftar salah untuk review.</footer>
      </div>
    </main>

    <script>
      const APP_NAME = "Ngebut JLPT"
      const APP_TAGLINE = "Main 10 menit sehari • skor naik, level naik"
      const POINTS_PER_CORRECT = 10
      const SESSION_SIZE_TARGET = 100

      const PROFILE_STORAGE_KEY = "nj_profile_v1"
      const XP_LEVEL_THRESHOLDS = [0, 100, 250, 500, 800, 1200, 1700, 2300, 3000, 4000]

      function defaultProfile(){
        return { totalXp: 0, level: 1, streak: 0, lastActiveDate: null }
      }

      function currentDateKey(d){
        const date = d instanceof Date ? d : new Date()
        const y = date.getFullYear()
        const m = String(date.getMonth() + 1).padStart(2, "0")
        const day = String(date.getDate()).padStart(2, "0")
        return `${y}-${m}-${day}`
      }

      function dateKeyOffset(days){
        const d = new Date()
        d.setDate(d.getDate() + days)
        return currentDateKey(d)
      }

      function levelFromXp(totalXp){
        const xp = Math.max(0, Number(totalXp) || 0)
        let level = 1
        for (let i = 0; i < XP_LEVEL_THRESHOLDS.length; i += 1) {
          if (xp >= XP_LEVEL_THRESHOLDS[i]) level = i + 1
        }
        return Math.min(level, XP_LEVEL_THRESHOLDS.length)
      }

      function normalizeProfile(raw){
        const base = defaultProfile()
        if (!raw || typeof raw !== "object") return base
        const totalXp = Math.max(0, Number(raw.totalXp) || 0)
        const streak = Math.max(0, Number(raw.streak) || 0)
        const lastActiveDate = typeof raw.lastActiveDate === "string" ? raw.lastActiveDate : null
        const level = levelFromXp(totalXp)
        return { totalXp, level, streak, lastActiveDate }
      }

      function loadProfile(){
        try {
          const raw = localStorage.getItem(PROFILE_STORAGE_KEY)
          if (!raw) return defaultProfile()
          return normalizeProfile(JSON.parse(raw))
        } catch {
          return defaultProfile()
        }
      }

      function saveProfile(profile){
        try {
          localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile))
        } catch {}
      }

      function profileMinXpForLevel(level){
        const idx = Math.max(1, Math.min(XP_LEVEL_THRESHOLDS.length, Number(level) || 1)) - 1
        return XP_LEVEL_THRESHOLDS[idx] ?? 0
      }

      function profileNextXpTarget(level){
        const idx = Math.max(1, Math.min(XP_LEVEL_THRESHOLDS.length, Number(level) || 1)) - 1
        const next = XP_LEVEL_THRESHOLDS[idx + 1]
        return typeof next === "number" ? next : null
      }

      function markProfileActive(profile){
        const today = currentDateKey(new Date())
        if (profile.lastActiveDate === today) return false
        const yesterday = dateKeyOffset(-1)
        const wasYesterday = profile.lastActiveDate === yesterday
        profile.streak = wasYesterday ? (Math.max(0, Number(profile.streak) || 0) + 1) : 1
        profile.lastActiveDate = today
        return true
      }

      function addXp(profile, delta){
        const next = Math.max(0, (Number(profile.totalXp) || 0) + (Number(delta) || 0))
        if (next == profile.totalXp) return false
        profile.totalXp = next
        profile.level = levelFromXp(next)
        return true
      }


      function initialsFromName(name){
        const cleaned = String(name || "").trim()
        if (!cleaned) return "JP"
        const parts = cleaned.split(/\s+/g).filter(Boolean)
        const letters = parts.slice(0, 2).map((p) => p[0] || "")
        const joined = letters.join("").toUpperCase()
        return joined || cleaned.slice(0, 2).toUpperCase()
      }

      function setBrand(){
        const mark = document.getElementById("brandMark")
        const title = document.getElementById("brandTitle")
        const subtitle = document.getElementById("brandSubtitle")
        if (mark) mark.textContent = initialsFromName(APP_NAME)
        if (title) title.textContent = APP_NAME
        if (subtitle) subtitle.textContent = APP_TAGLINE
      }

      function vocabFromRaw(list){
        return list
          .map((s) => String(s).trim())
          .filter(Boolean)
          .map((s) => {
            const parts = s.split("|")
            return { kanji: parts[0] ?? "", kana: parts[1] ?? "" }
          })
          .filter((x) => x.kanji && x.kana)
      }

            "手|て","足|あし","目|め","耳|みみ","口|くち","頭|あたま","体|からだ","歩く|あるく","走る|はしる","買う|かう","売る|うる","会う|あう","話す|はなす","聞く|きく","待つ|まつ","入る|はいる","出る|でる","上|うえ","下|した","右|みぎ","左|ひだり","前|まえ","後ろ|うしろ"

          particleBank: [

            { s: "わたし（　）ほんを よみます。", a: "は", choices: ["は", "で", "に"] },
            { s: "みず（　）のみます。", a: "を", choices: ["を", "に", "で"] },

            { s: "うみ（　）いきます。", a: "へ", choices: ["へ", "で", "に"] },
            { s: "こうえん（　）あそびます。", a: "で", choices: ["で", "に", "を"] },

      function levelStats(lv){
        const vocabCount = lv.vocab.length
        const particleCount = lv.particleBank.length
        const patternCount = lv.patternBank.length
        const storyCount = lv.storyBank.length
        const poolCount = (vocabCount * 2) + particleCount + patternCount + storyCount
        return { vocabCount, particleCount, patternCount, storyCount, poolCount }
      }

      function rand(list){
        return list[Math.floor(Math.random() * list.length)]
      }

      function shuffle(arr){
        const a = [...arr]
        for (let i = a.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1))
          const tmp = a[i]
          a[i] = a[j]
          a[j] = tmp
        }
        return a
      }

      function pickDistinctIndices(poolLength, count, excludedIndex){
        const indices = []
        while (indices.length < count) {
          const next = Math.floor(Math.random() * poolLength)
          if (next === excludedIndex) continue
          if (indices.includes(next)) continue
          indices.push(next)
        }
        return indices
      }

      function optionClassByIndex(i){
        if (i === 0) return "btn btn--a"
        if (i === 1) return "btn btn--b"
        return "btn btn--c"
      }

      function makeReadingQuestion(levelKey, item, itemIndex, index){
        const level = levels[levelKey]
        const vocab = level.vocab
        const distractorIndices = pickDistinctIndices(vocab.length, 2, itemIndex)
        const choices = [item.kana, ...distractorIndices.map((i) => vocab[i].kana)]
        const shuffled = shuffle(choices)
        const letters = ["A", "B", "C"]
        const options = shuffled.map((t, i) => ({ id: letters[i], text: t }))
        const correctOptionId = options.find((o) => o.text === item.kana)?.id ?? "A"
        return {
          id: `${levelKey}-reading-${String(index + 1).padStart(4, "0")}`,
          type: "reading",
          typeLabel: "よみかた / Bacaan",
          prompt: { primary: item.kanji, secondary: "（　）" },
          questionText: `「${item.kanji}」の よみかたは どれですか。`,
          questionSub: "Pilih hiragana yang benar (ひらがなをえらんでください)。",
          options,
          correctOptionId,
          feedbackCorrect: `${item.kanji}（${item.kana}）`
        }
      }

      function makeKanjiQuestion(levelKey, item, itemIndex, index){
        const level = levels[levelKey]
        const vocab = level.vocab
        const distractorIndices = pickDistinctIndices(vocab.length, 2, itemIndex)
        const choices = [item.kanji, ...distractorIndices.map((i) => vocab[i].kanji)]
        const shuffled = shuffle(choices)
        const letters = ["A", "B", "C"]
        const options = shuffled.map((t, i) => ({ id: letters[i], text: t }))
        const correctOptionId = options.find((o) => o.text === item.kanji)?.id ?? "A"
        return {
          id: `${levelKey}-kanji-${String(index + 1).padStart(4, "0")}`,
          type: "kanji",
          typeLabel: "かんじ / Kanji",
          prompt: { primary: item.kana, secondary: "（　）" },
          questionText: `「${item.kana}」を かんじで かくと どれですか。`,
          questionSub: "Pilih kanji yang benar (かんじをえらんでください)。",
          options,
          correctOptionId,
          feedbackCorrect: `${item.kanji}（${item.kana}）`
        }
      }

      function makeParticleQuestion(levelKey, entry, index){
        const letters = ["A", "B", "C"]
        const opts = shuffle(entry.choices).slice(0, 3)
        const options = opts.map((t, i) => ({ id: letters[i], text: t }))
        const correctOptionId = options.find((o) => o.text === entry.a)?.id ?? "A"
        return {
          id: `${levelKey}-particle-${String(index + 1).padStart(4, "0")}`,
          type: "particle",
          typeLabel: "じょし / Partikel",
          prompt: { primary: entry.s, secondary: "（　）" },
          questionText: "（　）に はいる じょしは どれですか。",
          questionSub: "Pilih partikel yang tepat (ひらがなをえらんでください)。",
          options,
          correctOptionId,
          feedbackCorrect: `${entry.a}`
        }
      }

      function makePatternQuestion(levelKey, entry, index){
        const letters = ["A", "B", "C"]
        const opts = shuffle(entry.choices).slice(0, 3)
        const options = opts.map((t, i) => ({ id: letters[i], text: t }))
        const correctOptionId = options.find((o) => o.text === entry.a)?.id ?? "A"
        return {

      function makeStoryQuestion(levelKey, entry, index){
        const letters = ["A", "B", "C"]
        const opts = shuffle(entry.choices).slice(0, 3)
        const options = opts.map((t, i) => ({ id: letters[i], text: t }))
        const correctOptionId = options.find((o) => o.text === entry.choices[entry.a])?.id ?? "A"
        return {
          id: `${levelKey}-story-${String(index + 1).padStart(4, "0")}`,
          type: "story",
          typeLabel: "どっかい / Dokai",
          prompt: { primary: entry.t, secondary: "Bacaan pendek" },
          questionText: entry.q,
          questionSub: "Baca teks, lalu pilih jawaban yang tepat.",
          options,
          correctOptionId,
          feedbackCorrect: `${entry.choices[entry.a]}`
        }
      }

      function buildQuestionPool(levelKey){
        const level = levels[levelKey]
        const pool = []
        for (let i = 0; i < level.vocab.length; i += 1) {
          pool.push(makeReadingQuestion(levelKey, level.vocab[i], i, pool.length))
          pool.push(makeKanjiQuestion(levelKey, level.vocab[i], i, pool.length))
        }
        for (let i = 0; i < level.particleBank.length; i += 1) {
          pool.push(makeParticleQuestion(levelKey, level.particleBank[i], pool.length))
        }
        for (let i = 0; i < level.patternBank.length; i += 1) {
          pool.push(makePatternQuestion(levelKey, level.patternBank[i], pool.length))
        }
        for (let i = 0; i < level.storyBank.length; i += 1) {
          pool.push(makeStoryQuestion(levelKey, level.storyBank[i], pool.length))
        }
        return pool
      }

      function recordWrong(q, selectedText, correctText){
        const existing = state.wrongList.find((x) => x.qId === q.id)
        if (!existing) {
          state.wrongList.push({ qId: q.id, q, selectedText, correctText, count: 1 })
          return
        }
        existing.count += 1
        existing.selectedText = selectedText
        existing.correctText = correctText
      }

      function buildWrongReviewQuestions(){
        const base = state.savedWrongList.length ? state.savedWrongList : state.wrongList
        const uniq = []
        const seen = new Set()
        for (const item of base) {
          const id = item.q?.id
          if (!id) continue
          if (seen.has(id)) continue
          seen.add(id)
          uniq.push(item.q)
        }
        return shuffle(uniq)
      }

      function buildSessionQuestions(){
        const pool = buildQuestionPool(state.levelKey)
        const size = Math.min(Math.max(SESSION_SIZE_TARGET, 100), 200)
        const shuffled = shuffle(pool)
        if (shuffled.length >= size) return shuffled.slice(0, size)
        const out = []
        while (out.length < size) {
          out.push(shuffled[out.length % shuffled.length])
        }
        return out
      }

      function startWrongReview(){
        if (markProfileActive(state.profile)) saveProfile(state.profile)
        state.mode = "reviewWrong"
        state.screen = "quiz"
        state.sessionQuestions = buildWrongReviewQuestions()
        state.questionIndex = 0
        state.score = 0
        state.feedback = null
        state.wrongList = []
        state.overlay = null
        setBadge()
        render()

        state.feedback = null

      function startGame(){
        if (markProfileActive(state.profile)) saveProfile(state.profile)

        state.mode = "normal"
        state.sessionQuestions = buildSessionQuestions()

      function resultMessage(score, maxScore){
        const ratio = maxScore === 0 ? 0 : score / maxScore
        if (ratio >= 0.9) return "すごい！ (Luar biasa)"
        if (ratio >= 0.75) return "いいね！ (Bagus sekali)"
        if (ratio >= 0.55) return "だいじょうぶ。 (Terus latihan)"
        return "あせらないで。 (Pelan-pelan ya)"
      }

      function renderStart(){

        const maxScore = totalQuestions * POINTS_PER_CORRECT

        const lvl = state.profile.level

        const minXp = profileMinXpForLevel(lvl)
        const nextXp = profileNextXpTarget(lvl)
        const pct = nextXp ? Math.round(((xp - minXp) / Math.max(1, nextXp - minXp)) * 100) : 100
        const xpNeeded = nextXp ? Math.max(0, nextXp - xp) : 0
        const xpLine = nextXp ? `XP <b>${xp}</b> • Butuh <b>${xpNeeded}</b> XP lagi ke Level <b>${lvl + 1}</b>` : `XP <b>${xp}</b> • Level <b>${lvl}</b> (MAX)`

          overlay.innerHTML = `

              </div>
              <div class="card">
                <div class="q">Pilih level</div>
                <div class="q__sub">Bank soal N4/N3 sudah disiapkan dalam jumlah besar dan bisa kamu review.</div>

                <button class="btn" data-action="close-overlay"><span class="btn__label">OK</span></button>

      function renderQuiz(){
        const q = currentQuestion()
        const index = state.questionIndex
        const total = state.sessionQuestions.length

        const optionsHtml = q.options
          .map((opt, i) => {
            const isLocked = Boolean(state.feedback)
            const isSelected = state.feedback?.selectedId === opt.id
            const isCorrect = state.feedback?.correctId === opt.id

            let extra = ""
            if (state.feedback && isSelected && state.feedback.isCorrect) extra = " btn--right"
            if (state.feedback && isSelected && !state.feedback.isCorrect) extra = " btn--wrong"
            if (state.feedback && !isSelected && isCorrect) extra = " btn--right"

            return `
              <button class="${optionClassByIndex(i)}${extra}" data-action="answer" data-option-id="${opt.id}" ${isLocked ? "disabled" : ""}>
                <div class="btn__top">
                  <div class="btn__label">${opt.text}</div>
                  <div class="btn__tag" aria-hidden="true">${opt.id}</div>
                </div>
              </button>
            `
          })
          .join("")

        const feedbackHtml = state.feedback
          ? (() => {
              const isCorrect = state.feedback.isCorrect
              const title = isCorrect ? "せいかい (Benar)" : "ちがいます (Salah)"
              const body = isCorrect
                ? rand(correctMessages)
                : `${rand(wrongMessages)}<br/>こたえ (Jawaban): <b>${state.feedback.correctText}</b>`

              return `
                <div class="feedback" role="status" aria-live="polite">
                  <div class="feedback__h">${title}</div>
                  <div class="feedback__p">${body}</div>
                  <div class="cta">

                    <button class="small" data-action="restart">Ulang</button>
                    <button class="small" data-action="reset">Halaman awal</button>
                  </div>
                </div>
              `
            })()
          : ``

        const primary = q.prompt?.primary ?? ""
        const secondary = q.prompt?.secondary ?? ""

            <div class="row">
              <div class="pill">Soal <span class="pill__muted">${index + 1}</span> / <span class="pill__muted">${total}</span></div>
              <div class="pill">Level <span class="pill__muted">${levels[state.levelKey].label}</span></div>
              <div class="pill pill--type">${q.typeLabel}</div>
              <div class="pill">Skor <span class="pill__muted">${state.score}</span></div>
              <button class="small" data-action="restart">Ulang</button>
              <button class="small" data-action="reset">Halaman awal</button>
            </div>

            <div class="progress" aria-hidden="true"><div class="progress__bar" style="width:${Math.round(((index + 1) / total) * 100)}%"></div></div>

            <div class="card">
              <div class="prompt">
                <div class="prompt__primary">${primary}</div>
                <div class="prompt__secondary">${secondary}</div>
              </div>
            </div>

            <div class="card">
              <div class="q">${q.questionText}</div>
              <div class="q__sub">${q.questionSub}</div>
            </div>

            <div class="answers">${optionsHtml}</div>

            ${feedbackHtml}
          </div>
        `
      }

      function renderWrongList(){
        const list = state.savedWrongList.length ? state.savedWrongList : state.wrongList
        const totalWrong = list.reduce((acc, x) => acc + (x.count ?? 0), 0)

        const itemsHtml = list
          .map((it) => {
            const q = it.q
            const type = q?.typeLabel ?? ""
            const p1 = q?.prompt?.primary ?? ""
            const p2 = q?.prompt?.secondary ?? ""
            const qt = q?.questionText ?? ""
            const sel = it.selectedText ?? ""
            const cor = it.correctText ?? ""
            const count = it.count ?? 1

            return `
              <div class="card">
                <div class="row" style="justify-content:space-between">
                  <div class="pill pill--type">${type}</div>
                  <div class="pill">× <span class="pill__muted">${count}</span></div>
                </div>
                <div style="height:10px"></div>
                <div class="q">${qt}</div>
                <div class="q__sub">${p1} ${p2}</div>
                <div style="height:10px"></div>
                <div class="q__sub">Jawaban kamu: <b>${sel}</b></div>
                <div class="q__sub">Jawaban benar: <b>${cor}</b></div>
              </div>
            `
          })
          .join("")

        app.innerHTML = `
          <div class="panel">
            <div class="hero">
              <div class="hero__h">まちがいリスト (Daftar Salah)</div>
              <div class="hero__p">Total salah: <b>${totalWrong}</b> / item: <b>${list.length}</b></div>
            </div>

            ${list.length ? itemsHtml : `<div class="card"><div class="q" style="text-align:center">Belum ada jawaban salah.</div></div>`}

            <div class="cta">
              <button class="btn" data-action="review-wrong" ${list.length ? "" : "disabled"}><span class="btn__label">Ulangi yang salah</span></button>
              <button class="small" data-action="back-result">Kembali</button>
              <button class="small" data-action="reset">Halaman awal</button>
            </div>
          </div>
        `
      }

      function renderResult(){
        const total = state.sessionQuestions.length
        const maxScore = total * POINTS_PER_CORRECT
        const msg = resultMessage(state.score, maxScore)
        const correctCount = Math.round(state.score / POINTS_PER_CORRECT)
        const wrongCount = state.wrongList.reduce((acc, x) => acc + (x.count ?? 0), 0)
        const accuracy = total ? Math.round((correctCount / total) * 100) : 0
        const st = levelStats(levels[state.levelKey])
        const ringBg = `conic-gradient(rgba(69,230,182,.95) ${accuracy}%, rgba(255,255,255,.10) 0)`

        app.innerHTML = `
          <div class="panel">
            <div class="resultGrid">
              <div class="nb-card">
                <div class="resultHero">
                  <div>
                    <div class="statKey">Result</div>
                    <div class="scoreBig">${state.score}</div>
                    <div class="scoreSub">/ ${maxScore} • Akurasi ${accuracy}%</div>
                    <div class="q__sub" style="margin-top:10px">${msg}</div>
                  </div>
                  <div class="ring" style="background:${ringBg}">
                    <div class="ring__inner"><div class="ring__pct">${accuracy}%</div></div>
                  </div>
                </div>
              </div>

              <div class="stats">
                <div class="nb-card">
                  <div class="statKey">Level</div>
                  <div class="statVal">${levels[state.levelKey].label}</div>
                  <div class="q__sub">Bank: <b>${st.poolCount}</b> soal</div>
                </div>
                <div class="nb-card">
                  <div class="statKey">Benar</div>
                  <div class="statVal">${correctCount}</div>
                  <div class="q__sub">+${POINTS_PER_CORRECT} per soal</div>
                </div>
                <div class="nb-card">
                  <div class="statKey">Salah</div>
                  <div class="statVal">${wrongCount}</div>
                  <button class="small" data-action="wrong-list" ${wrongCount ? "" : "disabled"} style="margin-top:10px">Daftar salah</button>
                </div>
                <div class="nb-card">
                  <div class="statKey">Next</div>
                  <div class="statVal">N4 / N3</div>
                  <div class="q__sub">Coba level lebih tinggi</div>
                </div>
              </div>
            </div>

            <div class="cta">
              <button class="btn" data-action="start"><span class="btn__label">Main lagi</span></button>
              <button class="btn" data-action="review-wrong" ${wrongCount ? "" : "disabled"}><span class="btn__label">Ulangi yang salah</span></button>
              <button class="small" data-action="reset">Halaman awal</button>
            </div>
          </div>
        `
      }

      function render(){
        if (state.screen === "start") {
          renderStart()
          return
        }

        if (state.screen === "quiz") {
          renderQuiz()
          return
        }

        if (state.screen === "wrongList") {
          renderWrongList()
          return
        }

        renderResult()
      }

      function onAnswer(optionId){
        if (markProfileActive(state.profile)) saveProfile(state.profile)
        const q = currentQuestion()
        const correctOpt = q.options.find((o) => o.id === q.correctOptionId)
        const selectedOpt = q.options.find((o) => o.id === optionId)
        const isCorrect = optionId === q.correctOptionId

        if (isCorrect) {
          state.score += POINTS_PER_CORRECT
          if (addXp(state.profile, POINTS_PER_CORRECT)) saveProfile(state.profile)
        }

        const correctText = q.feedbackCorrect ?? (correctOpt?.text ?? "")
        const selectedText = selectedOpt?.text ?? ""
        if (!isCorrect) recordWrong(q, selectedText, correctText)

        state.feedback = {
          isCorrect,
          selectedId: selectedOpt?.id ?? optionId,
          correctId: q.correctOptionId,
          correctText
        }

        render()
      }

      function next(){
        state.feedback = null

        if (state.questionIndex >= state.sessionQuestions.length - 1) {
          state.screen = "result"
          render()
          return
        }

        state.questionIndex += 1
        render()
      }

      app.addEventListener("click", (e) => {
        const el = e.target instanceof Element ? e.target.closest("[data-action]") : null
        if (!el) return

        const action = el.getAttribute("data-action")
        if (!action) return

        if (action === "pick-level") {
          const key = el.getAttribute("data-level")
          if (!key) return
          if (!levels[key]) return
          if (levels[key].locked) {
            showOverlay("locked")
            return
          }
          state.levelKey = key
          setBadge()
          render()
          return
        }

        if (action === "close-overlay") {
          closeOverlay()
          return
        }

        if (action === "start") {
          startGame()
          return
        }

        if (action === "reset") {
          resetGame()
          return
        }

        if (action === "restart") {
          startGame()
          return
        }

        if (action === "wrong-list") {
          if (!state.wrongList.length) return
          state.savedWrongList = [...state.wrongList]
          state.screen = "wrongList"
          render()
          return
        }

        if (action === "back-result") {
          state.screen = "result"
          render()
          return
        }

        if (action === "review-wrong") {
          const base = state.savedWrongList.length ? state.savedWrongList : state.wrongList
          if (!base.length) return
          if (!state.savedWrongList.length) state.savedWrongList = [...state.wrongList]
          startWrongReview()
          return
        }

        if (action === "answer") {
          if (state.feedback) return
          const optionId = el.getAttribute("data-option-id")
          if (!optionId) return
          onAnswer(optionId)
          return
        }

        if (action === "next") {
          next()
        }
      })

      setBrand()
      setBadge()
      render()
    </script>
  </body>
</html>
