            { q: `彼はしけんに<u>ごうかく</u>しました。`, choices: [`合核`, `合絡`, `合各`, `合格`], a: 3, explanation: `'ごうかく' (lulus) ditulis 合格.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `このじこの<u>げんいん</u>はまだわかりません。`, choices: [`原因`, `原員`, `元因`, `現因`], a: 0, explanation: `'げんいん' (penyebab) ditulis 原因.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `彼女は<u>かんきょう</u>もんだいにきょうみがあります。`, choices: [`環鏡`, `環境`, `還境`, `環況`], a: 1, explanation: `'かんきょう' (lingkungan) ditulis 環境.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `このけいかくは<u>しっぱい</u>しました。`, choices: [`失波`, `失敗`, `室敗`, `失配`], a: 1, explanation: `'しっぱい' (gagal) ditulis 失敗.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `彼はだいがくで<u>けんきゅう</u>をしています。`, choices: [`研究`, `研求`, `検究`, `件究`], a: 0, explanation: `'けんきゅう' (riset/penelitian) ditulis 研究.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `このでーたは<u>せいかく</u>ではありません。`, choices: [`性格`, `正核`, `生確`, `正確`], a: 3, explanation: `'せいかく' dalam konteks 'data ini tidak akurat' ditulis 正確 (akurat/tepat), berbeda dengan 性格 (kepribadian) pada soal no.22 meski bunyinya sama.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `彼女は<u>しんせつ</u>にあんないしてくれました。`, choices: [`新切`, `親設`, `親切`, `親接`], a: 2, explanation: `'しんせつ' (baik hati/ramah) ditulis 親切.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `このしゃかいは<u>きゅうそく</u>にへんかしています。`, choices: [`急測`, `急速`, `急促`, `求速`], a: 1, explanation: `'きゅうそく' (cepat/pesat) ditulis 急速.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `彼はむずかしいもんだいに<u>ちょうせん</u>しました。`, choices: [`挑戦`, `挑践`, `跳戦`, `挑選`], a: 0, explanation: `'ちょうせん' (menantang/mencoba tantangan) ditulis 挑戦.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `このけっかは<u>よそう</u>とちがいました。`, choices: [`予装`, `余想`, `予想`, `予相`], a: 2, explanation: `'よそう' (dugaan/prediksi) ditulis 予想.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `彼女はじぶんのいけんを<u>しゅちょう</u>しました。`, choices: [`主帳`, `主長`, `首張`, `主張`], a: 3, explanation: `'しゅちょう' (mengemukakan/menegaskan pendapat) ditulis 主張.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `この会社は最近業績が（　）伸びています。`, choices: [`そろそろ`, `ぐんぐん`, `だんだん`, `どんどん`], a: 3, explanation: `どんどん menyatakan kemajuan yang cepat dan terus-menerus (kinerja meningkat pesat). ぐんぐん juga bermakna mirip tapi kunci jawaban menetapkan どんどん sebagai jawaban paling natural pada konteks pertumbuhan bisnis yang cepat.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼の意見には（　）賛成できません。`, choices: [`どうしても`, `ぜったいに`, `ぜんぜん`, `たしかに`], a: 0, explanation: `どうしても...できません menyatakan 'bagaimanapun juga tidak bisa' (usaha apa pun tetap tidak setuju), menekankan penolakan yang kuat dan personal terhadap pendapat tersebut.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この計画は（　）中止になりました。`, choices: [`したがって`, `結局`, `それとも`, `そのうえ`], a: 1, explanation: `結局 berarti 'pada akhirnya', cocok untuk menyatakan hasil akhir dari suatu proses (rencana ini akhirnya dibatalkan).`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼は困っている人を（　）放っておけません。`, choices: [`見たら`, `見ても`, `見て`, `見ず`], a: 2, explanation: `Pola '～て+放っておけない' menyatakan 'begitu melihat, tidak bisa membiarkan begitu saja': 見て放っておけません (setelah melihat, tidak tega membiarkannya).`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `会議の資料はもう（　）用意してあります。`, choices: [`これから`, `すでに`, `そろそろ`, `いまさら`], a: 1, explanation: `すでに (sudah) cocok dengan もう yang menekankan sesuatu telah selesai dipersiapkan.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この問題を（　）ためには、もっと調査が必要です。`, choices: [`解決した`, `解決すれば`, `解決する`, `解決して`], a: 2, explanation: `Sebelum ために (untuk/demi) yang menyatakan tujuan, kata kerja menggunakan bentuk kamus: 解決するために (untuk menyelesaikan masalah ini).`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼女は仕事が（　）忙しくて、休む時間がありません。`, choices: [`やや`, `少し`, `わずかに`, `非常に`], a: 3, explanation: `非常に (sangat) cocok dengan konteks 'sangat sibuk sampai tidak ada waktu istirahat'. やや, 少し, わずかに semuanya berarti 'sedikit', bertentangan dengan kondisi ekstrem yang dijelaskan.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この薬を飲んだら、頭痛が（　）なくなりました。`, choices: [`すっかり`, `だいたい`, `きっと`, `たぶん`], a: 0, explanation: `すっかりなくなりました berarti 'hilang sepenuhnya/tuntas'. だいたい (kira-kira) tidak menyatakan kesempurnaan, きっと dan たぶん adalah kata dugaan yang tidak cocok dengan pernyataan hasil pasti ini.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼は約束を（　）人ではありません。`, choices: [`破れる`, `破る`, `破られ`, `破って`], a: 1, explanation: `Sebelum menerangkan kata benda 人 (orang), kata kerja menggunakan bentuk kamus: 約束を破る人 (orang yang mengingkari janji).`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この建物は地震に（　）造られています。`, choices: [`強くて`, `強い`, `強さ`, `強く`], a: 3, explanation: `Kata sifat-i berubah menjadi bentuk adverbial (～く) sebelum kata kerja: 地震に強く造られています (dibangun agar kuat terhadap gempa).`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼女の説明を聞いて、やっと（　）理解できました。`, choices: [`納得して`, `誤解して`, `疑って`, `反対して`], a: 0, explanation: `納得して berarti 'menjadi paham/puas dengan penjelasan', cocok dengan 'akhirnya bisa memahami'. 誤解 (salah paham), 疑う (curiga), 反対 (menolak) tidak sesuai konteks positif ini.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この仕事は一人では（　）できません。`, choices: [`ほとんど`, `すっかり`, `とても`, `だいたい`], a: 2, explanation: `とても...できません menyatakan penekanan kuat 'sama sekali tidak bisa/sangat sulit dilakukan sendirian'.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼は試験に（　）ため、毎日勉強しています。`, choices: [`合格すれば`, `合格して`, `合格した`, `合格する`], a: 3, explanation: `Sebelum ため (demi/untuk tujuan), kata kerja menggunakan bentuk kamus: 合格するために毎日勉強しています (belajar setiap hari demi lulus ujian).`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼女はその知らせを聞いて（　）驚きました。`, choices: [`めったに`, `非常に`, `わずかに`, `たまに`], a: 1, explanation: `非常に (sangat) cocok memperkuat 驚きました (terkejut). めったに, わずかに, たまに tidak sesuai konteks intensitas keterkejutan ini.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この部屋は（　）整理されています。`, choices: [`ちゃんと`, `そろそろ`, `だいたい`, `すっかり`], a: 0, explanation: `ちゃんと整理されています berarti 'rapi tertata dengan baik/benar'. Ini adalah pilihan paling alami untuk memuji kerapian suatu ruangan.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼はお金がなくても、幸せな（　）送っています。`, choices: [`生活が`, `生活の`, `生活して`, `生活を`], a: 3, explanation: `Pola '～を送る' berarti 'menjalani ~': 生活を送っています (sedang menjalani kehidupan yang bahagia). Partikel 'を' menandai objek dari kata kerja 送る, sehingga 生活が/生活の/生活して tidak tepat secara tata bahasa pada posisi ini.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `会議は予定より（　）早く終わりました。`, choices: [`だいぶ`, `だんだん`, `そろそろ`, `いまにも`], a: 0, explanation: `だいぶ (jauh/cukup banyak) cocok untuk menyatakan selisih yang cukup besar dari waktu yang direncanakan (selesai jauh lebih cepat dari jadwal).`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼女は自分の失敗を（　）認めました。`, choices: [`べつに`, `きゅうに`, `素直に`, `たまに`], a: 2, explanation: `素直に認めました berarti 'mengakui dengan jujur/tanpa membantah'. Kata ini paling cocok untuk sikap menerima kesalahan sendiri secara terbuka.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この地域は交通が便利な（　）、家賃が高いです。`, choices: [`とおり`, `うえに`, `ばかりで`, `反面`], a: 3, explanation: `反面 menyatakan 'di sisi lain/kebalikannya': daerah ini transportasinya nyaman, tapi di sisi lain sewanya mahal — menunjukkan dua sisi berlawanan dari satu hal.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼は何度も失敗した（　）、あきらめませんでした。`, choices: [`ばかりに`, `にもかかわらず`, `おかげで`, `せいで`], a: 1, explanation: `にもかかわらず berarti 'meskipun/walaupun begitu' (menunjukkan pertentangan): meskipun gagal berkali-kali, dia tidak menyerah.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼はその意見に賛成しました。`, choices: [`彼はその意見にいいと思いました。`, `彼はその意見に反対しました。`, `彼はその意見を疑いました。`, `彼はその意見を無視しました。`], a: 0, explanation: `賛成しました (setuju) sepadan dengan いいと思いました (menganggap baik/setuju). 反対 (menolak) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この計画は中止になりました。`, choices: [`この計画は変更されました。`, `この計画は成功しました。`, `この計画は延期されました。`, `この計画は行われないことになりました。`], a: 3, explanation: `中止になりました (dibatalkan) sepadan dengan 行われないことになりました (menjadi tidak akan dilaksanakan). 延期 (ditunda) berbeda makna karena masih akan dilaksanakan nanti, bukan dibatalkan total.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女はその話を疑っています。`, choices: [`彼女はその話に賛成しています。`, `彼女はその話を信じています。`, `彼女はその話を本当だと思っていません。`, `彼女はその話を知りません。`], a: 2, explanation: `疑っています (curiga/meragukan) sepadan dengan 本当だと思っていません (tidak menganggapnya benar). 信じています (percaya) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この問題は複雑です。`, choices: [`この問題は新しいです。`, `この問題はかんたんではありません。`, `この問題は古いです。`, `この問題はかんたんです。`], a: 1, explanation: `複雑 (rumit) sepadan dengan かんたんではありません (tidak sederhana). かんたんです (sederhana) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼はいつも冷静です。`, choices: [`彼はいつも落ち着いています。`, `彼はいつもあわてています。`, `彼はいつも忙しいです。`, `彼はいつも怒っています。`], a: 0, explanation: `冷静 (tenang/tidak panik) sepadan dengan 落ち着いています (tenang). あわてています (panik) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女はその仕事を断りました。`, choices: [`彼女はその仕事を手伝いました。`, `彼女はその仕事を受けませんでした。`, `彼女はその仕事を頼みました。`, `彼女はその仕事を受けました。`], a: 1, explanation: `断りました (menolak) sepadan dengan 受けませんでした (tidak menerima). 受けました (menerima) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この機械は故障しました。`, choices: [`この機械はよく動きます。`, `この機械は安くなりました。`, `この機械は新しくなりました。`, `この機械は動かなくなりました。`], a: 3, explanation: `故障しました (rusak) sepadan dengan 動かなくなりました (menjadi tidak bisa bergerak/berfungsi). よく動きます (berfungsi baik) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼は約束を守りました。`, choices: [`彼は約束を忘れました。`, `彼は約束を破りました。`, `彼は言ったとおりにしました。`, `彼は約束を変えました。`], a: 2, explanation: `約束を守りました (menepati janji) sepadan dengan 言ったとおりにしました (melakukan sesuai apa yang dikatakan). 破りました (mengingkari) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女はその知らせに驚きました。`, choices: [`彼女はその知らせを聞いてびっくりしました。`, `彼女はその知らせを予想していました。`, `彼女はその知らせを喜びませんでした。`, `彼女はその知らせに興味がありませんでした。`], a: 0, explanation: `驚きました (terkejut) sepadan dengan びっくりしました (kaget). 予想していました (sudah menduga) justru berlawanan makna dengan keterkejutan.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この会社は業績が伸びています。`, choices: [`この会社は小さくなっています。`, `この会社は成績が悪くなっています。`, `この会社は変わっていません。`, `この会社は成績がよくなっています。`], a: 3, explanation: `業績が伸びています (kinerja meningkat) sepadan dengan 成績がよくなっています (hasil/prestasi menjadi lebih baik).`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼は責任を感じています。`, choices: [`彼は他人のせいにしています。`, `彼は何も気にしていません。`, `彼は自分のせいだと思っています。`, `彼はうれしく思っています。`], a: 2, explanation: `責任を感じています (merasa bertanggung jawab) sepadan dengan 自分のせいだと思っています (menganggap itu kesalahannya sendiri). 他人のせいにしています justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女はその意見に反対しました。`, choices: [`彼女はその意見に興味がありました。`, `彼女はその意見はよくないと言いました。`, `彼女はその意見を聞きませんでした。`, `彼女はその意見に賛成しました。`], a: 1, explanation: `反対しました (menentang) sepadan dengan よくないと言いました (mengatakan itu tidak baik). 賛成しました (setuju) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この店は最近繁盛しています。`, choices: [`この店は最近お客さんが減っています。`, `この店は最近閉店しました。`, `この店は最近お客さんが増えています。`, `この店は最近値上げしました。`], a: 2, explanation: `繁盛しています (laris/ramai pengunjung) sepadan dengan お客さんが増えています (pelanggan bertambah). 減っています (berkurang) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼は仕事を辞めるつもりです。`, choices: [`彼は仕事を続けようと考えています。`, `彼は仕事を探しています。`, `彼は転職に反対しています。`, `彼は仕事をやめようと考えています。`], a: 3, explanation: `辞めるつもり (berniat berhenti) sepadan dengan やめようと考えています (berpikir untuk berhenti). 続けようと考えています justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女はミスを素直に認めました。`, choices: [`彼女は自分の間違いをすなおに受け入れました。`, `彼女は他人のせいにしました。`, `彼女は自分の間違いに気づきませんでした。`, `彼女は自分の間違いを隠しました。`], a: 0, explanation: `素直に認めました (mengakui dengan jujur) sepadan dengan すなおに受け入れました (menerima dengan jujur/lapang dada). 隠しました (menyembunyikan) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `【そろそろ】`, choices: [`この店はそろそろ有名です。`, `そろそろ帰らないと、電車がなくなります。`, `彼はそろそろ日本語が上手です。`, `そろそろ、あの映画はおもしろかったです。`], a: 1, explanation: `そろそろ berarti 'sebentar lagi/sudah waktunya' untuk melakukan sesuatu: そろそろ帰らないと (kalau tidak segera pulang...). Kata ini tidak dipakai untuk menyatakan tingkat/kualitas seperti pada opsi lain.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【思い出す】`, choices: [`明日の予定を思い出すつもりです。`, `昔のことを思い出すと、なつかしくなります。`, `友達の顔を思い出して覚えました。`, `新しい単語を思い出しました。`], a: 1, explanation: `思い出す berarti 'teringat kembali (sesuatu di masa lalu)': 昔のことを思い出すと (ketika teringat hal-hal masa lalu). Kata ini dipakai untuk mengingat kembali, bukan untuk rencana masa depan atau menghafal hal baru.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【たまたま】`, choices: [`彼はたまたま日本語が上手です。`, `たまたま宿題をしてから寝ます。`, `駅でたまたま昔の友達に会いました。`, `毎日たまたま同じ電車に乗ります。`], a: 2, explanation: `たまたま berarti 'kebetulan': 駅でたまたま昔の友達に会いました (kebetulan bertemu teman lama di stasiun). Kata ini menyatakan kejadian tak terduga sekali waktu, tidak cocok untuk hal rutin (毎日) atau sifat tetap seseorang.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【気がつく】`, choices: [`財布を忘れたことに気がつきました。`, `毎朝六時に気がつきます。`, `この問題は気がつきにくいです。`, `彼女は料理に気がついています。`], a: 0, explanation: `気がつく berarti 'menyadari': 財布を忘れたことに気がつきました (menyadari bahwa dompetnya tertinggal). Kata ini dipakai untuk kesadaran akan suatu fakta/kejadian, bukan untuk aktivitas rutin atau keahlian.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【せっかく】`, choices: [`せっかく雨が降っています。`, `せっかく駅まで歩いて行きます。`, `彼はせっかく忙しいです。`, `せっかく作った料理なので、残さないでください。`], a: 3, explanation: `せっかく menekankan usaha/kesempatan berharga yang telah dilakukan: せっかく作った料理 (masakan yang sudah repot-repot dibuat), jadi sayang kalau disisakan.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【思い切って】`, choices: [`毎日思い切って勉強しています。`, `彼は思い切って優しい人です。`, `思い切って、駅まで歩いて十分です。`, `思い切って、新しい仕事に挑戦することにしました。`], a: 3, explanation: `思い切って berarti 'memberanikan diri/nekat mengambil keputusan': 思い切って新しい仕事に挑戦する (memberanikan diri mencoba pekerjaan baru). Tidak cocok untuk aktivitas rutin atau deskripsi sifat/jarak.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【済ませる】`, choices: [`済ませる前に電話しました。`, `昼ご飯はパンで済ませました。`, `彼は仕事を済ませが好きです。`, `この本を済ませて読みました。`], a: 1, explanation: `済ませる berarti 'menyelesaikan dengan seadanya/praktis': 昼ご飯はパンで済ませました (makan siang cukup dengan roti saja). Kata ini menekankan penyelesaian secara sederhana/singkat.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【しかたがない】`, choices: [`しかたがなく、明日は晴れるでしょう。`, `この問題はしかたがなく簡単です。`, `雨が降っているので、出かけないのはしかたがないです。`, `彼はしかたがなく親切です。`], a: 2, explanation: `しかたがない berarti 'tidak ada pilihan lain/mau tidak mau': karena hujan, tidak keluar rumah memang tidak bisa dihindari (しかたがない).`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【つい】`, choices: [`疲れていたので、つい居眠りをしてしまいました。`, `彼はついとても真面目です。`, `毎日つい六時に起きます。`, `つい、明日は休みです。`], a: 0, explanation: `つい menyatakan 'tanpa sengaja/tidak sadar melakukan sesuatu': つい居眠りをしてしまいました (tanpa sadar tertidur). Tidak cocok untuk sifat tetap atau kebiasaan rutin.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【首になる】`, choices: [`彼は会社を休みすぎて、首になりました。`, `彼女は仕事が早くて首になりました。`, `首になったので、給料が上がりました。`, `この会社は首になって有名です。`], a: 0, explanation: `首になる berarti 'dipecat dari pekerjaan': karena terlalu sering absen, dia dipecat (首になりました). Tidak cocok dikaitkan dengan kenaikan gaji atau prestasi positif.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【工夫する】`, choices: [`工夫すると、問題が難しくなります。`, `この料理は工夫して、まずくなりました。`, `時間がないので、勉強の方法を工夫しています。`, `彼は工夫するのが下手で、いつも失敗します。`], a: 2, explanation: `工夫する berarti 'mencari cara/berkreasi agar lebih baik': 勉強の方法を工夫しています (mencari cara belajar yang lebih efektif). Kata ini bermakna positif, jadi tidak logis kalau hasilnya justru memburuk (lebih sulit/lebih tidak enak).`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【がっかりする】`, choices: [`彼はがっかりして、元気になりました。`, `試験に合格して、がっかりしました。`, `彼女はがっかりして、喜んでいます。`, `試験に落ちて、とてもがっかりしました。`], a: 3, explanation: `がっかりする berarti 'kecewa': 試験に落ちて、がっかりしました (kecewa karena gagal ujian). Tidak logis dipasangkan dengan hasil positif seperti lulus ujian atau menjadi senang/bersemangat.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【詳しい】`, choices: [`彼女は詳しくて優しいです。`, `彼は歴史に詳しいので、何でも知っています。`, `この部屋は詳しくて広いです。`, `この料理は詳しくておいしいです。`], a: 1, explanation: `詳しい berarti 'menguasai/paham betul suatu bidang': 歴史に詳しい (paham betul soal sejarah). Kata ini tidak dipakai untuk mendeskripsikan sifat orang, ruangan, atau rasa makanan secara umum.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【思いやり】`, choices: [`思いやりを食べました。`, `この問題には思いやりが必要です。`, `彼女は思いやりがあって、いつも人を助けます。`, `彼は思いやりが速いです。`], a: 2, explanation: `思いやり berarti 'sikap peduli/berempati pada orang lain': 思いやりがあって、人を助けます (memiliki sikap peduli sehingga selalu membantu orang). Kata benda ini tidak bisa 'dimakan' atau memiliki kecepatan.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `【我慢する】`, choices: [`彼は我慢して、すぐに諦めました。`, `この料理は我慢しておいしいです。`, `彼女は我慢して、すぐ怒りました。`, `眠かったですが、宿題が終わるまで我慢しました。`], a: 3, explanation: `我慢する berarti 'menahan diri/bersabar': 宿題が終わるまで我慢しました (menahan kantuk sampai PR selesai). Kata ini bermakna bertahan/tidak menyerah, sehingga tidak logis kalau hasilnya justru langsung menyerah atau marah.`, passage: ``, sectionLabel: `文字・語彙 · Penggunaan Kata (用法)`, problemNumber: 5 },
            { q: `この本は難しくて、なかなか読み（　）。半分も進んでいません。`, choices: [`終わらない`, `終わりすぎる`, `終わっている`, `終わりがたい`], a: 0, explanation: `Pola '～終わる' (selesai melakukan) diberi negasi なかなか～終わらない berarti 'tak kunjung selesai dibaca', sesuai konteks 'baru setengah jalan'.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `空が急に暗くなって、雨が降り（　）。傘を持っていなくて困った。`, choices: [`つづけた`, `だした`, `かけた`, `きった`], a: 1, explanation: `Pola '～だす' menyatakan awal mula suatu kejadian tiba-tiba: 雨が降りだした (hujan mulai/tiba-tiba turun), sesuai konteks 'langit mendadak gelap'.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `先生に注意された（　）、次のテストでは同じミスをしませんでした。`, choices: [`ばかりに`, `せいで`, `ものの`, `おかげで`], a: 3, explanation: `おかげで menyatakan sebab yang membawa hasil positif (berkat): berkat ditegur guru, tidak mengulangi kesalahan yang sama di tes berikutnya. せいで/ばかりに dipakai untuk hasil negatif.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `彼は忙しい（　）、頼めばいつも手伝ってくれます。だから助かります。`, choices: [`ものなら`, `わりに`, `につけ`, `からには`], a: 1, explanation: `わりに berarti 'padahal/dibandingkan dengan keadaannya': 忙しいわりに、いつも手伝ってくれる (padahal sibuk, tapi tetap selalu membantu) — menunjukkan sesuatu di luar dugaan berdasarkan kondisinya.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `このボタンを押す（　）、自動で電気が消える仕組みになっています。（一般的な事実）`, choices: [`ばこそ`, `としたら`, `と`, `なら`], a: 2, explanation: `Pola '～と' dipakai untuk menyatakan hubungan sebab-akibat yang bersifat otomatis/pasti (fakta umum): ボタンを押すと、電気が消える (kalau tombol ditekan, lampu otomatis mati).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `彼女は英語（　）フランス語も話せるので、通訳の仕事をしています。`, choices: [`だけでなく`, `というより`, `にしては`, `はさておき`], a: 0, explanation: `Pola '～だけでなく～も' berarti 'bukan hanya... tapi juga...': 英語だけでなくフランス語も話せる (bukan hanya bahasa Inggris, tapi juga bahasa Prancis bisa dibicarakan).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `この資料、部長にちょっと（　）もらいたいんですが、今お時間ありますか。`, choices: [`見て`, `見られて`, `見せて`, `拝見して`], a: 0, explanation: `Pola '～てもらう' berarti meminta orang lain melakukan sesuatu untuk kita: 見てもらいたい (ingin diperiksa/dilihatkan oleh atasan). 見せて berarti 'memperlihatkan' yang salah subjeknya di sini.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `子供のころ、父はよく私を博物館に（　）くれました。`, choices: [`連れて行かされて`, `連れて行かれて`, `連れて行って`, `連れて行かせて`], a: 2, explanation: `Pola '～てくれる' menyatakan orang lain melakukan sesuatu yang menguntungkan pembicara: 連れて行ってくれました (ayah mengajak/membawa saya pergi). Bentuk pasif/kausatif pada opsi lain tidak sesuai konteks.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `台風が近づいている（　）、外の看板を片付けておいたほうがいい。`, choices: [`からといって`, `にしては`, `とはいえ`, `ので`], a: 3, explanation: `ので menyatakan sebab yang wajar/objektif: karena topan sedang mendekat, sebaiknya papan reklame di luar dibereskan dulu.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `予算が足りないなら、この計画は中止（　）を得ないだろう。`, choices: [`しない`, `せざる`, `させない`, `されない`], a: 1, explanation: `Pola '～ざるを得ない' berarti 'terpaksa/mau tidak mau harus': 中止せざるを得ない (mau tidak mau harus dibatalkan). Bentuk ini memerlukan bentuk negatif klasik (ざる) dari kata kerja する, yaitu せざる.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `母は毎晩、私が読みやすい（　）、字の大きい本を選んでくれました。`, choices: [`上で`, `ように`, `とおりに`, `からには`], a: 1, explanation: `Pola '～ように' menyatakan tujuan (agar): 読みやすいように、字の大きい本を選んだ (memilih buku dengan huruf besar agar mudah dibaca).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `彼はまだ若い（　）、判断力があって頼りになる。`, choices: [`わりに`, `につけ`, `ばかりに`, `ことから`], a: 0, explanation: `わりに berarti 'padahal/dibandingkan usianya': まだ若いわりに、判断力がある (padahal masih muda, tapi punya kemampuan menilai yang baik) — menunjukkan hal di luar dugaan.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `彼女は試験に落ちた（　）、部屋にこもって出てこない。ドア越しに泣き声が聞こえる。`, choices: [`ように見えて`, `そうに`, `らしく`, `みたいに`], a: 2, explanation: `らしく di sini berasal dari らしい (tampaknya, berdasarkan bukti tak langsung seperti suara tangisan): 試験に落ちたらしく (sepertinya gagal ujian, terlihat dari tanda-tanda yang ada).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `電車が遅れた（　）、大事な会議に遅刻してしまい、上司にひどく怒られた。`, choices: [`とすれば`, `からいって`, `としても`, `ために`], a: 3, explanation: `ために menyatakan sebab-akibat: 電車が遅れたために、会議に遅刻した (karena kereta terlambat, jadi terlambat rapat).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `この薬は苦いので、子供に（　）飲ませるのが大変です。`, choices: [`せっかく`, `無理やり`, `かえって`, `わざと`], a: 1, explanation: `無理やり berarti 'dengan paksa': 無理やり飲ませる (memaksa anak meminumnya), sesuai konteks obat yang pahit sehingga sulit diberikan.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `彼に何度も説明した（　）、彼はまだ手順を間違えている。`, choices: [`のに`, `ことだし`, `上で`, `ものだから`], a: 0, explanation: `のに menyatakan pertentangan (padahal): 何度も説明したのに、まだ間違えている (padahal sudah dijelaskan berkali-kali, tapi masih salah).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `この部屋は去年から禁煙（　）なっているのに、たばこのにおいがする。`, choices: [`と`, `の`, `に`, `で`], a: 2, explanation: `Pola '～になる' menyatakan perubahan keadaan: 禁煙になっている (sudah menjadi area bebas rokok), diikuti partikel に sebelum なる.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `会議室は今、田中さんが（　）いるので、あとで使ってください。`, choices: [`使わせて`, `使えて`, `使われて`, `使って`], a: 3, explanation: `Bentuk ～ている biasa (使っている) menyatakan sedang dipakai oleh Tanaka: 田中さんが使っています (Tanaka sedang memakainya). Bentuk pasif/kausatif tidak sesuai subjeknya di sini.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `この問題については、専門家の意見を聞いた（　）決めたほうがいい。`, choices: [`ところで`, `上に`, `上で`, `あげく`], a: 2, explanation: `Pola '～た上で' berarti 'setelah melakukan..., baru...': 意見を聞いた上で決める (memutuskan setelah mendengar pendapat ahli terlebih dahulu).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `彼は風邪をひいた（　）、それでも会社を休まずに出勤した。`, choices: [`ので`, `ことに`, `とおり`, `ものの`], a: 3, explanation: `ものの menyatakan pertentangan ringan (meskipun...tetapi...): 風邪をひいたものの、休まず出勤した (meskipun terkena flu, tetap masuk kerja tanpa absen).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `この店のパンは焼き（　）で、まだ温かい。`, choices: [`気味`, `たて`, `つつ`, `がち`], a: 1, explanation: `Pola '～たて' berarti 'baru saja selesai melakukan': 焼きたて (baru selesai dipanggang), sehingga masih hangat.`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `彼女は忙しい（　）、毎日ボランティア活動を続けている。`, choices: [`にもかかわらず`, `としたら`, `ときたら`, `とばかりに`], a: 0, explanation: `にもかかわらず menyatakan pertentangan (meskipun): 忙しいにもかかわらず、続けている (meskipun sibuk, tetap melanjutkan kegiatan sukarela).`, passage: ``, sectionLabel: `文法 · Pola Kalimat Tingkat Menengah`, problemNumber: 6 },
            { q: `この仕事は ＿＿＿ ＿＿＿ ★ ＿＿＿ できません。`, choices: [`④終わらせることが`, `①一人では`, `③時間内に`, `②とても`], a: 2, explanation: `Susunan: ①一人では②とても③時間内に④終わらせることができません (Pekerjaan ini sangat tidak mungkin diselesaikan tepat waktu sendirian). Posisi ★ (ke-3) diisi oleh ③時間内に.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `彼女は ＿＿＿ ＿＿＿ ★ ＿＿＿ しまいました。`, choices: [`④うっかり`, `②電車の中で`, `①財布を`, `③忘れて`], a: 2, explanation: `Susunan: ②電車の中で④うっかり①財布を③忘れてしまいました (Dia tanpa sengaja meninggalkan dompetnya di dalam kereta). Posisi ★ (ke-3) diisi oleh ①財布を.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `台風が ＿＿＿ ＿＿＿ ★ ＿＿＿ 延期になりました。`, choices: [`②いる`, `①近づいて`, `③運動会は`, `④ので`], a: 3, explanation: `Susunan: ①近づいて②いる④ので③運動会は延期になりました (Karena topan sedang mendekat, acara olahraga ditunda). Posisi ★ (ke-3) diisi oleh ④ので.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `この薬は ＿＿＿ ＿＿＿ ★ ＿＿＿ いけません。`, choices: [`①子供に`, `④注意しないと`, `③絶対に`, `②飲ませては`], a: 0, explanation: `Susunan: ④注意しないと③絶対に①子供に②飲ませてはいけません (Harus hati-hati, obat ini sama sekali tidak boleh diminumkan ke anak-anak). Posisi ★ (ke-3) diisi oleh ①子供に.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `彼は ＿＿＿ ＿＿＿ ★ ＿＿＿ 医者になりました。`, choices: [`④末に`, `②とうとう`, `①努力の`, `③長年の`], a: 0, explanation: `Susunan: ③長年の①努力の④末に②とうとう医者になりました (Setelah bertahun-tahun berusaha keras, akhirnya menjadi dokter). Posisi ★ (ke-3) diisi oleh ④末に.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `先生に ＿＿＿ ＿＿＿ ★ ＿＿＿ レポートを書き直しました。`, choices: [`③何度も`, `②とおりに`, `④きちんと`, `①言われた`], a: 0, explanation: `Susunan: ①言われた②とおりに③何度も④きちんとレポートを書き直しました (Berkali-kali menulis ulang laporan dengan teliti, persis seperti yang dikatakan guru). Posisi ★ (ke-3) diisi oleh ③何度も.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `彼女は ＿＿＿ ＿＿＿ ★ ＿＿＿ 決めました。`, choices: [`③ことに`, `②大学を`, `①留学する`, `④卒業したら`], a: 2, explanation: `Susunan: ②大学を④卒業したら①留学する③ことに決めました (Dia memutuskan akan belajar ke luar negeri setelah lulus kuliah). Posisi ★ (ke-3) diisi oleh ①留学する.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `この問題は ＿＿＿ ＿＿＿ ★ ＿＿＿ 解決しません。`, choices: [`①話し合わない`, `④限り`, `③うちに`, `②みんなで`], a: 1, explanation: `Pola ‘～ない限り’ (~nai kagiri) berarti ‘selama/sepanjang tidak...’: みんなで話し合わない限り、解決しません (masalah ini tidak akan terpecahkan selama semua orang tidak berunding bersama). ③うちに (sementara/selagi) tidak membentuk pola yang bermakna di sini, sehingga hanya ④限り yang tepat mengisi posisi ★.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `彼は ＿＿＿ ＿＿＿ ★ ＿＿＿ 会社を辞めました。`, choices: [`④勤めた`, `③長年`, `②理由で`, `①健康上の`], a: 3, explanation: `Susunan: ③長年④勤めた①健康上の②理由で会社を辞めました (Karena alasan kesehatan, dia berhenti dari perusahaan yang sudah lama ditekuninya). Posisi ★ (ke-3) diisi oleh ①健康上の.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `この規則は ＿＿＿ ＿＿＿ ★ ＿＿＿ 守らなければなりません。`, choices: [`④確実に`, `③例外なく`, `②全員が`, `①社員`], a: 1, explanation: `Susunan: ①社員②全員が③例外なく④確実に守らなければなりません (Semua karyawan tanpa terkecuali harus benar-benar mematuhi aturan ini). Posisi ★ (ke-3) diisi oleh ③例外なく.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 7 },
            { q: `「ゴミの分別について」: わたしの住んでいる市では、ゴミの分別が（41）厳しくなっています。`, choices: [`せっかく`, `だんだん`, `いよいよ`, `たまたま`], a: 1, explanation: `だんだん berarti 'lambat laun/berangsur-angsur', cocok untuk menyatakan aturan yang semakin ketat secara bertahap seiring waktu.`, passage: `<p style="font-weight:700;margin-bottom:6px;">ゴミの分別について</p><p style="white-space:normal;line-height:1.9;">わたしの住んでいる市では、ゴミの分別が（41）厳しくなっています。以前は燃えるゴミと燃えないゴミの二種類だけでしたが、今はプラスチック、缶、瓶、紙など細かく分けなければ（42）。最初は面倒だと感じましたが、慣れて（43）、それほど大変ではなくなりました。市の職員の話によると、ゴミを正しく分別する（44）、リサイクルの効率がよくなり、環境にもいい影響が（45）そうです。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「ゴミの分別について」: 今はプラスチック、缶、瓶、紙など細かく分けなければ（42）。`, choices: [`なりません`, `けっこうです`, `いいです`, `かまいません`], a: 0, explanation: `Pola '～なければなりません' berarti 'harus/wajib melakukan': 細かく分けなければなりません (harus memilah sampah secara detail).`, passage: `<p style="font-weight:700;margin-bottom:6px;">ゴミの分別について</p><p style="white-space:normal;line-height:1.9;">わたしの住んでいる市では、ゴミの分別が（41）厳しくなっています。以前は燃えるゴミと燃えないゴミの二種類だけでしたが、今はプラスチック、缶、瓶、紙など細かく分けなければ（42）。最初は面倒だと感じましたが、慣れて（43）、それほど大変ではなくなりました。市の職員の話によると、ゴミを正しく分別する（44）、リサイクルの効率がよくなり、環境にもいい影響が（45）そうです。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「ゴミの分別について」: 最初は面倒だと感じましたが、慣れて（43）、それほど大変ではなくなりました。`, choices: [`しまったら`, `みたら`, `きたら`, `きても`], a: 2, explanation: `Pola '～てくる' menyatakan perubahan bertahap menuju keadaan sekarang: 慣れてきたら (setelah mulai terbiasa), menjadi tidak terlalu berat lagi.`, passage: `<p style="font-weight:700;margin-bottom:6px;">ゴミの分別について</p><p style="white-space:normal;line-height:1.9;">わたしの住んでいる市では、ゴミの分別が（41）厳しくなっています。以前は燃えるゴミと燃えないゴミの二種類だけでしたが、今はプラスチック、缶、瓶、紙など細かく分けなければ（42）。最初は面倒だと感じましたが、慣れて（43）、それほど大変ではなくなりました。市の職員の話によると、ゴミを正しく分別する（44）、リサイクルの効率がよくなり、環境にもいい影響が（45）そうです。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「ゴミの分別について」: ゴミを正しく分別する（44）、リサイクルの効率がよくなり...`, choices: [`ことにおいて`, `ことにより`, `ことにとって`, `ことによって`], a: 3, explanation: `Pola '～ことによって' berarti 'dengan cara/melalui...': 正しく分別することによって (dengan memilah sampah secara benar), efisiensi daur ulang menjadi lebih baik.`, passage: `<p style="font-weight:700;margin-bottom:6px;">ゴミの分別について</p><p style="white-space:normal;line-height:1.9;">わたしの住んでいる市では、ゴミの分別が（41）厳しくなっています。以前は燃えるゴミと燃えないゴミの二種類だけでしたが、今はプラスチック、缶、瓶、紙など細かく分けなければ（42）。最初は面倒だと感じましたが、慣れて（43）、それほど大変ではなくなりました。市の職員の話によると、ゴミを正しく分別する（44）、リサイクルの効率がよくなり、環境にもいい影響が（45）そうです。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「ゴミの分別について」: 環境にもいい影響が（45）そうです。`, choices: [`あり`, `あって`, `ある`, `あった`], a: 2, explanation: `Sebelum ～そうです (bentuk 'katanya/menurut informasi'), kata kerja menggunakan bentuk kamus: 影響がある そうです (katanya memberi dampak baik).`, passage: `<p style="font-weight:700;margin-bottom:6px;">ゴミの分別について</p><p style="white-space:normal;line-height:1.9;">わたしの住んでいる市では、ゴミの分別が（41）厳しくなっています。以前は燃えるゴミと燃えないゴミの二種類だけでしたが、今はプラスチック、缶、瓶、紙など細かく分けなければ（42）。最初は面倒だと感じましたが、慣れて（43）、それほど大変ではなくなりました。市の職員の話によると、ゴミを正しく分別する（44）、リサイクルの効率がよくなり、環境にもいい影響が（45）そうです。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「リモートワークの経験」: わたしの会社では、去年からリモートワークが（41）なりました。`, choices: [`できないように`, `できるように`, `できそうに`, `できるらしく`], a: 1, explanation: `Pola '～ようになる' menyatakan perubahan menjadi bisa melakukan sesuatu: リモートワークができるようになりました (menjadi bisa bekerja dari rumah, sejak tahun lalu).`, passage: `<p style="font-weight:700;margin-bottom:6px;">リモートワークの経験</p><p style="white-space:normal;line-height:1.9;">わたしの会社では、去年からリモートワークが（41）なりました。最初は自宅で集中できるか心配でしたが、実際に（42）、意外と快適に仕事ができています。通勤時間が（43）ので、その分、家族と過ごす時間が増えました。ただ、同僚と直接話す機会が減った（44）、コミュニケーションが取りにくくなったと感じることも（45）あります。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「リモートワークの経験」: 実際に（42）、意外と快適に仕事ができています。`, choices: [`やってみると`, `やってみても`, `やってみれば`, `やってみたら`], a: 0, explanation: `Pola '～と' menyatakan hasil yang langsung ditemukan setelah mencoba: 実際にやってみると (ketika benar-benar dicoba), ternyata di luar dugaan nyaman untuk bekerja.`, passage: `<p style="font-weight:700;margin-bottom:6px;">リモートワークの経験</p><p style="white-space:normal;line-height:1.9;">わたしの会社では、去年からリモートワークが（41）なりました。最初は自宅で集中できるか心配でしたが、実際に（42）、意外と快適に仕事ができています。通勤時間が（43）ので、その分、家族と過ごす時間が増えました。ただ、同僚と直接話す機会が減った（44）、コミュニケーションが取りにくくなったと感じることも（45）あります。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「リモートワークの経験」: 通勤時間が（43）ので、その分、家族と過ごす時間が増えました。`, choices: [`多くなった`, `長くなった`, `少なくなる`, `なくなった`], a: 3, explanation: `なくなった berarti 'menjadi hilang/tidak ada sama sekali'. Karena kerja dari rumah, waktu perjalanan komuter menjadi hilang, sehingga waktu bersama keluarga bertambah.`, passage: `<p style="font-weight:700;margin-bottom:6px;">リモートワークの経験</p><p style="white-space:normal;line-height:1.9;">わたしの会社では、去年からリモートワークが（41）なりました。最初は自宅で集中できるか心配でしたが、実際に（42）、意外と快適に仕事ができています。通勤時間が（43）ので、その分、家族と過ごす時間が増えました。ただ、同僚と直接話す機会が減った（44）、コミュニケーションが取りにくくなったと感じることも（45）あります。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「リモートワークの経験」: 同僚と直接話す機会が減った（44）、コミュニケーションが取りにくくなったと感じることもあります。`, choices: [`けど`, `のに`, `ため`, `だけ`], a: 2, explanation: `ため menyatakan sebab: 機会が減ったため (karena kesempatan berkurang), komunikasi menjadi lebih sulit dirasakan.`, passage: `<p style="font-weight:700;margin-bottom:6px;">リモートワークの経験</p><p style="white-space:normal;line-height:1.9;">わたしの会社では、去年からリモートワークが（41）なりました。最初は自宅で集中できるか心配でしたが、実際に（42）、意外と快適に仕事ができています。通勤時間が（43）ので、その分、家族と過ごす時間が増えました。ただ、同僚と直接話す機会が減った（44）、コミュニケーションが取りにくくなったと感じることも（45）あります。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `「リモートワークの経験」: コミュニケーションが取りにくくなったと感じることも（45）あります。`, choices: [`決して`, `時々`, `全く`, `めったに`], a: 1, explanation: `時々 (kadang-kadang) cocok dengan konteks perasaan yang muncul sesekali, bukan selalu (bukan pernyataan negatif seperti 決して/全く/めったに yang butuh bentuk negatif).`, passage: `<p style="font-weight:700;margin-bottom:6px;">リモートワークの経験</p><p style="white-space:normal;line-height:1.9;">わたしの会社では、去年からリモートワークが（41）なりました。最初は自宅で集中できるか心配でしたが、実際に（42）、意外と快適に仕事ができています。通勤時間が（43）ので、その分、家族と過ごす時間が増えました。ただ、同僚と直接話す機会が減った（44）、コミュニケーションが取りにくくなったと感じることも（45）あります。</p>`, sectionLabel: `文法 ・ Tata Bahasa dalam Bacaan`, problemNumber: 8 },
            { q: `このメールで一番伝えたいことは何ですか。`, choices: [`商品が完売してしまったこと。`, `新しい商品が入荷したこと。`, `注文がキャンセルされたこと。`, `商品の到着が予定より遅れること。`], a: 3, explanation: `Email menjelaskan barang stoknya habis dan pengiriman akan terlambat sekitar seminggu, dengan pesan inti bahwa kedatangan barang akan mundur dari jadwal. Pesan tidak menyatakan pesanan dibatalkan (justru menawarkan opsi pembatalan jika mau), dan tidak fokus pada 'barang laris terjual' melainkan kekosongan stok yang menyebabkan keterlambatan.`, passage: `<p style="font-weight:700;margin-bottom:6px;">メール（山田商店から鈴木様へ）</p><p style="white-space:normal;line-height:1.9;">鈴木様<br><br>お世話になっております。先日ご注文いただいた商品ですが、在庫がなくなってしまい、お届けが一週間ほど遅れる見込みです。誠に申し訳ございません。もしキャンセルをご希望の場合は、お手数ですがご連絡ください。<br><br>山田商店</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `住民は、工事の前に何をしておく必要がありますか。`, choices: [`水をためておく。`, `マンションから出ておく。`, `管理会社に連絡する。`, `電気を止めておく。`], a: 0, explanation: `Pengumuman meminta penghuni menyiapkan diri karena air akan dimatikan sementara saat perbaikan pipa, dengan menyarankan menyimpan/menampung air terlebih dahulu (水をためておく).`, passage: `<p style="font-weight:700;margin-bottom:6px;">お知らせ（マンション住民の皆様へ）</p><p style="white-space:normal;line-height:1.9;">＜マンション住民の皆様へ＞<br><br>来週火曜日、9時から12時まで、水道管の点検工事を行います。この間、水道が使えなくなりますので、あらかじめ水をためておくなど、ご準備をお願いいたします。ご不便をおかけしますが、ご理解のほどよろしくお願いいたします。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `このアルバイトに応募できる人は誰ですか。`, choices: [`週三日以上働ける人。`, `夏祭りの経験者だけ。`, `毎日フルタイムで働ける人。`, `交通費が自己負担できない人だけ。`], a: 0, explanation: `Syarat lowongan menyebutkan minimal bekerja 3 hari per minggu (週三日以上), dengan jam kerja fleksibel dan menerima orang tanpa pengalaman (未経験者歓迎), jadi tidak diwajibkan berpengalaman atau bekerja penuh waktu setiap hari.`, passage: `<p style="font-weight:700;margin-bottom:6px;">広告（短期アルバイト募集）</p><p style="white-space:normal;line-height:1.9;">【短期アルバイト募集】<br>期間：七月一日〜八月三十一日<br>仕事内容：夏祭りの受付・案内<br>時給：1,200円（交通費別）<br>条件：週三日以上、時間帯応相談<br>＊未経験者歓迎。学生さん、主婦の方も大歓迎です。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `雨が降った場合、防災訓練はどうなりますか。`, choices: [`翌日に行われる。`, `一週間後に行われる。`, `中止になり、行われない。`, `予定どおり行われる。`], a: 1, explanation: `Pengumuman menyebutkan jika hujan, latihan akan ditunda selama satu minggu (一週間後に延期), bukan dibatalkan total atau ditunda hanya satu hari.`, passage: `<p style="font-weight:700;margin-bottom:6px;">回覧板（町内会の皆様へ）</p><p style="white-space:normal;line-height:1.9;">町内会の皆様<br><br>来月の防災訓練は、雨天の場合、一週間後に延期します。開催の有無は、前日の午後六時までに、町内会の掲示板でお知らせしますので、ご確認ください。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `この人が旅行で一番印象に残ったことは何ですか。`, choices: [`言葉が全く通じなかったこと。`, `道に迷って困ったこと。`, `現地の人がとても親切だったこと。`, `旅行のお金が高かったこと。`], a: 2, explanation: `Blog menyebutkan yang paling berkesan adalah keramahan orang lokal (現地の人がとても親切), termasuk contoh ada yang mengantarkan sampai tujuan saat tersesat.`, passage: `<p style="font-weight:700;margin-bottom:6px;">ブログ（一人旅の思い出）</p><p style="white-space:normal;line-height:1.9;">先週、初めて一人で海外旅行に行ってきました。言葉が通じるか不安でしたが、身振り手振りでなんとかなりました。特に印象に残ったのは、現地の人がとても親切だったことです。道に迷ったとき、わざわざ目的地まで案内してくれた人もいました。次はもっと長く滞在して、いろいろな場所を巡ってみたいです。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `当日、自習室の予約をキャンセルしたい場合、どうすればいいですか。`, choices: [`何もしなくていい。`, `インターネットで連絡する。`, `カウンターに直接行く。`, `電話で連絡する。`], a: 3, explanation: `Aturan menyebutkan pembatalan pada hari yang sama harus dilakukan melalui telepon (必ずお電話でご連絡ください), bukan lewat internet atau datang langsung ke konter.`, passage: `<p style="font-weight:700;margin-bottom:6px;">案内（図書館 自習室のご利用について）</p><p style="white-space:normal;line-height:1.9;">＜図書館 自習室のご利用について＞<br><br>自習室は予約制です。ご利用の一週間前から、カウンターまたはインターネットでご予約いただけます。当日のキャンセルは、必ずお電話でご連絡ください。連絡なしのキャンセルが続いた場合、今後のご利用をお断りすることがあります。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `この人が伝えたいことは何ですか。`, choices: [`電車はいつも混雑しているということ。`, `子育て中の人は電車に乗るべきではないということ。`, `電車利用の際、周りへの配慮も大切だということ。`, `ベビーカーは電車に乗せてはいけないということ。`], a: 2, explanation: `Penulis mengusulkan agar stroller dilipat saat kereta ramai demi kenyamanan bersama, sambil tetap memahami kesulitan orang tua yang membawa anak — intinya menekankan pentingnya saling memperhatikan sesama penumpang, bukan melarang total penggunaan stroller.`, passage: `<p style="font-weight:700;margin-bottom:6px;">意見・投書（電車のベビーカーについて）</p><p style="white-space:normal;line-height:1.9;">最近、電車の中でベビーカーを広げたまま乗る人が増えていると感じます。混雑時には他の乗客の迷惑になることもあるので、可能であればたたんで乗るなど、周りへの配慮も必要ではないでしょうか。もちろん子育て中の方の大変さも理解していますが、お互いに気持ちよく利用できる工夫が大切だと思います。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `二時間駐車した場合、料金はいくらになりますか。`, choices: [`二百円`, `千五百円`, `千円`, `六百円`], a: 3, explanation: `30 menit pertama gratis, setelahnya setiap 30 menit dikenakan 200 yen. Dalam 2 jam (120 menit), setelah 30 menit gratis tersisa 90 menit = 3 periode 30 menit × 200 yen = 600 yen.`, passage: `<p style="font-weight:700;margin-bottom:6px;">掲示（駐車場ご利用の皆様へ）</p><p style="white-space:normal;line-height:1.9;">＜駐車場ご利用の皆様へ＞<br><br>本日より、駐車場の料金体系が変わります。最初の三十分は無料、以降三十分ごとに二百円がかかります。一日の上限は千五百円です。ご不明な点は、管理事務所までお問い合わせください。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 9 },
            { q: `この人がボランティアを始めたきっかけは何ですか。`, choices: [`会社から勧められたこと。`, `近所の人に言われたこと。`, `子供のころからの夢だったこと。`, `テレビでボランティアの番組を見たこと。`], a: 1, explanation: `Teks menyebutkan pemicunya adalah perkataan nenek tetangga (隣に住むおばあさん) yang berharap anak muda lebih peduli pada komunitas sekitarnya.`, passage: `<p style="font-weight:700;margin-bottom:6px;">エッセイ（ボランティア活動）</p><p style="white-space:normal;line-height:1.9;">わたしは去年から、週末に地域のボランティア活動に参加している。最初は近所の公園の掃除だけだったが、今では子供たちに勉強を教える活動にも関わるようになった。ボランティアを始めたきっかけは、隣に住むおばあさんから「若い人がもっと地域に関心を持ってくれたら」と言われたことだった。実際にやってみると、思っていた以上に多くのことを学ぶことができた。特に、いろいろな世代の人と話す機会が増えたことは、自分にとって大きな財産になっている。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `この人にとって、ボランティアで一番大きな収穫は何ですか。`, choices: [`いろいろな世代の人と話す機会が増えたこと。`, `有名になったこと。`, `仕事が楽になったこと。`, `お金がもらえるようになったこと。`], a: 0, explanation: `Penulis menyebutkan secara eksplisit bahwa bertambahnya kesempatan berbicara dengan orang dari berbagai generasi menjadi 'aset besar' (大きな財産) baginya.`, passage: `<p style="font-weight:700;margin-bottom:6px;">エッセイ（ボランティア活動）</p><p style="white-space:normal;line-height:1.9;">わたしは去年から、週末に地域のボランティア活動に参加している。最初は近所の公園の掃除だけだったが、今では子供たちに勉強を教える活動にも関わるようになった。ボランティアを始めたきっかけは、隣に住むおばあさんから「若い人がもっと地域に関心を持ってくれたら」と言われたことだった。実際にやってみると、思っていた以上に多くのことを学ぶことができた。特に、いろいろな世代の人と話す機会が増えたことは、自分にとって大きな財産になっている。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `リモートワークの課題として挙げられているのは何ですか。`, choices: [`社員同士のコミュニケーションが不足しやすいこと。`, `給料が下がること。`, `自分のペースで仕事ができないこと。`, `通勤時間が長くなること。`], a: 0, explanation: `Teks menyebutkan tantangan utama remote work adalah komunikasi antar karyawan yang mudah berkurang (コミュニケーションが不足しやすい), yang berujung pada karyawan baru butuh waktu lebih lama beradaptasi.`, passage: `<p style="font-weight:700;margin-bottom:6px;">説明文（リモートワークの広がり）</p><p style="white-space:normal;line-height:1.9;">近年、日本の多くの企業でリモートワークが広がっている。この働き方には、通勤時間が減る、自分のペースで仕事ができるといった利点がある一方で、課題も指摘されている。例えば、社員同士のコミュニケーションが不足しやすく、新入社員が仕事に慣れるまでに時間がかかることがある。そのため、多くの企業では、週に数回は出社する「ハイブリッド型」の働き方を導入している。この方法によって、リモートワークの利点を生かしながら、コミュニケーション不足という課題を解決しようとしているのである。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `「ハイブリッド型」の働き方とは、どのような働き方ですか。`, choices: [`会社を辞めて自由に働く方法。`, `毎日必ず出社する方法。`, `完全に在宅だけで働く方法。`, `週に数回出社し、それ以外はリモートで働く方法。`], a: 3, explanation: `Teks menjelaskan model hybrid adalah masuk kantor beberapa kali dalam seminggu sementara sisanya bekerja dari jarak jauh, menggabungkan keuntungan remote work dengan tetap menjaga komunikasi langsung.`, passage: `<p style="font-weight:700;margin-bottom:6px;">説明文（リモートワークの広がり）</p><p style="white-space:normal;line-height:1.9;">近年、日本の多くの企業でリモートワークが広がっている。この働き方には、通勤時間が減る、自分のペースで仕事ができるといった利点がある一方で、課題も指摘されている。例えば、社員同士のコミュニケーションが不足しやすく、新入社員が仕事に慣れるまでに時間がかかることがある。そのため、多くの企業では、週に数回は出社する「ハイブリッド型」の働き方を導入している。この方法によって、リモートワークの利点を生かしながら、コミュニケーション不足という課題を解決しようとしているのである。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `子供にスマートフォンを持たせることに賛成する理由の一つは何ですか。`, choices: [`勉強しなくてもよくなること。`, `友達と遊ぶ時間が増えること。`, `災害時の連絡手段として役立つこと。`, `親が安心して外出できること。`], a: 2, explanation: `Teks menyebutkan salah satu alasan pihak yang setuju adalah kegunaannya sebagai sarana komunikasi darurat saat bencana (災害時の連絡手段として役立つ).`, passage: `<p style="font-weight:700;margin-bottom:6px;">意見文（子供のスマートフォン利用）</p><p style="white-space:normal;line-height:1.9;">子供のスマートフォン利用について、様々な意見がある。早くから持たせるべきだという意見の理由は、災害時の連絡手段として役立つことや、情報を集める力が身につくことである。一方、反対意見の理由は、スマートフォンに依存しすぎることや、有害な情報に触れる危険があることだ。わたし自身は、年齢に応じてルールを決めた上で持たせるのがよいと考える。例えば、使用時間を制限したり、フィルタリング機能を使ったりすることで、危険をある程度減らすことができるからだ。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `この人の考えに合っているものはどれですか。`, choices: [`子供には自由にスマートフォンを使わせるべきだ。`, `ルールを決めた上で、子供にスマートフォンを持たせるのがよい。`, `スマートフォンには危険がないので心配ない。`, `子供には絶対にスマートフォンを持たせるべきではない。`], a: 1, explanation: `Penulis menyatakan pendapat pribadinya bahwa sebaiknya anak diberi ponsel setelah menetapkan aturan sesuai usia terlebih dahulu (年齢に応じてルールを決めた上で持たせる), bukan bebas tanpa batas maupun dilarang sama sekali.`, passage: `<p style="font-weight:700;margin-bottom:6px;">意見文（子供のスマートフォン利用）</p><p style="white-space:normal;line-height:1.9;">子供のスマートフォン利用について、様々な意見がある。早くから持たせるべきだという意見の理由は、災害時の連絡手段として役立つことや、情報を集める力が身につくことである。一方、反対意見の理由は、スマートフォンに依存しすぎることや、有害な情報に触れる危険があることだ。わたし自身は、年齢に応じてルールを決めた上で持たせるのがよいと考える。例えば、使用時間を制限したり、フィルタリング機能を使ったりすることで、危険をある程度減らすことができるからだ。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 10 },
            { q: `日本語を学び始めて二年の人は、どの部門に応募できますか。`, choices: [`中級部門`, `初級部門`, `上級部門`, `どの部門にも応募できない`], a: 0, explanation: `Tabel menunjukkan kategori 中級部門 ditujukan untuk pembelajar bahasa Jepang selama 1-3 tahun. Orang yang belajar selama 2 tahun masuk dalam rentang ini, jadi cocok mendaftar kategori menengah.`, passage: `<p style="font-weight:700;margin-bottom:6px;">日本語スピーチコンテスト参加案内</p><p style="margin-bottom:6px;">＜第10回 外国人日本語スピーチコンテスト＞</p><table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:6px;"><thead><tr><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">部門</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">対象</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">スピーチ時間</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">応募締切</th></tr></thead><tbody><tr><td style="border:1px solid #ddd;padding:6px 10px;">初級部門</td><td style="border:1px solid #ddd;padding:6px 10px;">日本語学習1年未満</td><td style="border:1px solid #ddd;padding:6px 10px;">3分以内</td><td style="border:1px solid #ddd;padding:6px 10px;">9月10日</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">中級部門</td><td style="border:1px solid #ddd;padding:6px 10px;">日本語学習1〜3年</td><td style="border:1px solid #ddd;padding:6px 10px;">5分以内</td><td style="border:1px solid #ddd;padding:6px 10px;">9月10日</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">上級部門</td><td style="border:1px solid #ddd;padding:6px 10px;">日本語学習3年以上</td><td style="border:1px solid #ddd;padding:6px 10px;">7分以内</td><td style="border:1px solid #ddd;padding:6px 10px;">9月20日</td></tr></tbody></table><p style="font-size:12px;opacity:.8;margin-top:6px;">＊応募は市役所国際交流課の窓口、またはメールで受け付けます。<br>＊メールでの応募には、原稿（日本語）を添付してください。<br>＊当日は自由に見学できます（予約不要）。</p>`, sectionLabel: `読解 · Pencarian Informasi`, problemNumber: 11 },
            { q: `上級部門に応募したい人は、いつまでに申し込む必要がありますか。`, choices: [`当日まで`, `9月20日`, `10月1日`, `9月10日`], a: 1, explanation: `Tabel menunjukkan batas pendaftaran kategori 上級部門 (tingkat mahir) adalah tanggal 20 September, berbeda dari kategori pemula/menengah yang batasnya 10 September.`, passage: `<p style="font-weight:700;margin-bottom:6px;">日本語スピーチコンテスト参加案内</p><p style="margin-bottom:6px;">＜第10回 外国人日本語スピーチコンテスト＞</p><table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:6px;"><thead><tr><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">部門</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">対象</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">スピーチ時間</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">応募締切</th></tr></thead><tbody><tr><td style="border:1px solid #ddd;padding:6px 10px;">初級部門</td><td style="border:1px solid #ddd;padding:6px 10px;">日本語学習1年未満</td><td style="border:1px solid #ddd;padding:6px 10px;">3分以内</td><td style="border:1px solid #ddd;padding:6px 10px;">9月10日</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">中級部門</td><td style="border:1px solid #ddd;padding:6px 10px;">日本語学習1〜3年</td><td style="border:1px solid #ddd;padding:6px 10px;">5分以内</td><td style="border:1px solid #ddd;padding:6px 10px;">9月10日</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">上級部門</td><td style="border:1px solid #ddd;padding:6px 10px;">日本語学習3年以上</td><td style="border:1px solid #ddd;padding:6px 10px;">7分以内</td><td style="border:1px solid #ddd;padding:6px 10px;">9月20日</td></tr></tbody></table><p style="font-size:12px;opacity:.8;margin-top:6px;">＊応募は市役所国際交流課の窓口、またはメールで受け付けます。<br>＊メールでの応募には、原稿（日本語）を添付してください。<br>＊当日は自由に見学できます（予約不要）。</p>`, sectionLabel: `読解 · Pencarian Informasi`, problemNumber: 11 },
            { q: `70歳の人が一人でプールを2時間利用する場合、料金はいくらですか。`, choices: [`500円`, `300円`, `250円`, `無料`], a: 2, explanation: `Tabel menunjukkan tarif kolam renang untuk kategori usia 65 tahun ke atas adalah 250 yen untuk 2 jam. Orang berusia 70 tahun termasuk dalam kategori ini.`, passage: `<p style="font-weight:700;margin-bottom:6px;">市民スポーツセンター利用案内</p><p style="margin-bottom:6px;">＜市民スポーツセンター　施設利用料金＞</p><table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:6px;"><thead><tr><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">施設</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">利用時間</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">一般</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">学生</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">65歳以上</th></tr></thead><tbody><tr><td style="border:1px solid #ddd;padding:6px 10px;">プール</td><td style="border:1px solid #ddd;padding:6px 10px;">2時間</td><td style="border:1px solid #ddd;padding:6px 10px;">500円</td><td style="border:1px solid #ddd;padding:6px 10px;">300円</td><td style="border:1px solid #ddd;padding:6px 10px;">250円</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">トレーニングルーム</td><td style="border:1px solid #ddd;padding:6px 10px;">2時間</td><td style="border:1px solid #ddd;padding:6px 10px;">400円</td><td style="border:1px solid #ddd;padding:6px 10px;">200円</td><td style="border:1px solid #ddd;padding:6px 10px;">200円</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">体育館（バスケットコート）</td><td style="border:1px solid #ddd;padding:6px 10px;">2時間</td><td style="border:1px solid #ddd;padding:6px 10px;">1,500円（団体）</td><td style="border:1px solid #ddd;padding:6px 10px;">1,000円（団体）</td><td style="border:1px solid #ddd;padding:6px 10px;">ー</td></tr></tbody></table><p style="font-size:12px;opacity:.8;margin-top:6px;">＊学生の方は学生証をご提示ください。<br>＊体育館は団体での利用のみで、個人利用はできません。</p>`, sectionLabel: `読解 · Pencarian Informasi`, problemNumber: 11 },
            { q: `学生が一人で体育館を利用したいです。できますか。`, choices: [`できる。65歳以上と同じ料金になる。`, `できる。ただし料金が2倍になる。`, `できる。学生証を見せれば個人利用できる。`, `できない。体育館は団体利用のみである。`], a: 3, explanation: `Keterangan tabel menyebutkan gedung olahraga (体育館) hanya bisa digunakan secara berkelompok, bukan perorangan (個人利用はできません), sehingga siswa sendirian tidak bisa menggunakannya walau menunjukkan kartu pelajar.`, passage: `<p style="font-weight:700;margin-bottom:6px;">市民スポーツセンター利用案内</p><p style="margin-bottom:6px;">＜市民スポーツセンター　施設利用料金＞</p><table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:6px;"><thead><tr><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">施設</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">利用時間</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">一般</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">学生</th><th style="border:1px solid #ddd;padding:6px 10px;background:#f3eaf1;">65歳以上</th></tr></thead><tbody><tr><td style="border:1px solid #ddd;padding:6px 10px;">プール</td><td style="border:1px solid #ddd;padding:6px 10px;">2時間</td><td style="border:1px solid #ddd;padding:6px 10px;">500円</td><td style="border:1px solid #ddd;padding:6px 10px;">300円</td><td style="border:1px solid #ddd;padding:6px 10px;">250円</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">トレーニングルーム</td><td style="border:1px solid #ddd;padding:6px 10px;">2時間</td><td style="border:1px solid #ddd;padding:6px 10px;">400円</td><td style="border:1px solid #ddd;padding:6px 10px;">200円</td><td style="border:1px solid #ddd;padding:6px 10px;">200円</td></tr><tr><td style="border:1px solid #ddd;padding:6px 10px;">体育館（バスケットコート）</td><td style="border:1px solid #ddd;padding:6px 10px;">2時間</td><td style="border:1px solid #ddd;padding:6px 10px;">1,500円（団体）</td><td style="border:1px solid #ddd;padding:6px 10px;">1,000円（団体）</td><td style="border:1px solid #ddd;padding:6px 10px;">ー</td></tr></tbody></table><p style="font-size:12px;opacity:.8;margin-top:6px;">＊学生の方は学生証をご提示ください。<br>＊体育館は団体での利用のみで、個人利用はできません。</p>`, sectionLabel: `読解 · Pencarian Informasi`, problemNumber: 11 },

      function levelStats(lv) {
        const vocabCount = lv.vocab.length

        return { vocabCount, particleCount, patternCount, storyCount, poolCount }

      function rand(list) {
        return list[Math.floor(Math.random() * list.length)]
      }

      function shuffle(arr) {
        const a = [...arr]
        for (let i = a.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1))
          const tmp = a[i]
          a[i] = a[j]
          a[j] = tmp
        }
        return a
      }

      function pickDistinctIndices(poolLength, count, excludedIndex) {
        const indices = []
        while (indices.length < count) {
          const next = Math.floor(Math.random() * poolLength)
          if (next === excludedIndex) continue
          if (indices.includes(next)) continue
          indices.push(next)
        }
        return indices
      }

        return "answer-btn answer-btn--c"
      }

        const level = levels[levelKey]
        const vocab = level.vocab
        const distractorIndices = pickDistinctIndices(vocab.length, 2, itemIndex)
        const choices = [item.kana, ...distractorIndices.map((i) => vocab[i].kana)]
        const shuffled = shuffle(choices)
        const letters = ["A", "B", "C"]
        const options = shuffled.map((t, i) => ({ id: letters[i], text: t }))
        const correctOptionId = options.find((o) => o.text === item.kana)?.id ?? "A"
        return {
          id: `${levelKey}-reading-${String(index + 1).padStart(4, "0")}`,
          type: "reading",
          typeLabel: "よみかた / Bacaan",
          vocabRef: { levelKey, index: itemIndex },
          prompt: { primary: item.kanji, secondary: "Pilih bacaan hiragana yang benar" },
          questionText: `「${item.kanji}」の よみかたは どれですか。`,
          questionSub: "Pilih hiragana yang benar untuk kanji di atas.",

        const category = CATEGORY_GROUPS.find((c) => c.id === categoryId)
        let filtered = category ? fullPool.filter(category.match) : fullPool
        if (problemNumber != null) {
          filtered = filtered.filter((q) => q.problemNumber === Number(problemNumber))
        }
        return shuffle(filtered)
      }

      function startCategorySession(categoryId, problemNumber) {
        const filtered = buildFilteredPool(state.levelKey, categoryId, problemNumber)
        if (!filtered.length) return
        markProfileActive(state.profile)
        syncN5RoadmapCompletionFromXp()
        persistProgress()
        state.screen = "quiz"
        state.mode = "normal"
        state.sessionQuestions = filtered.length > CATEGORY_SESSION_CAP ? filtered.slice(0, CATEGORY_SESSION_CAP) : filtered
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        state.savedWrongList = []
        state.lastResult = null
        render()
      }

      function buildQuestionPool(levelKey) {
        const level = levels[levelKey]
        const pool = []

        if ((levelKey === "n5" || levelKey === "n4") && level.officialBank && level.officialBank.length) {
          for (let i = 0; i < level.officialBank.length; i += 1) {
            pool.push(makeOfficialQuestion(levelKey, level.officialBank[i], pool.length))
          }
          return pool
        }

        const vocabLimit = (levelKey === "n4" || levelKey === "n3") ? 30 : level.vocab.length
        const vocabIndices = shuffle([...Array(level.vocab.length).keys()]).slice(0, vocabLimit)
        for (let vi = 0; vi < vocabIndices.length; vi += 1) { const i = vocabIndices[vi]
          pool.push(makeReadingQuestion(levelKey, level.vocab[i], i, pool.length))
          pool.push(makeKanjiQuestion(levelKey, level.vocab[i], i, pool.length))
        }
        for (let i = 0; i < level.particleBank.length; i += 1) {
          pool.push(makeParticleQuestion(levelKey, level.particleBank[i], pool.length))
        }
        for (let i = 0; i < level.patternBank.length; i += 1) {
          pool.push(makePatternQuestion(levelKey, level.patternBank[i], pool.length))
        }
        for (let i = 0; i < level.storyBank.length; i += 1) {
          pool.push(makeStoryQuestion(levelKey, level.storyBank[i], pool.length))
          pool.push(makeStoryQuestion(levelKey, level.storyBank[i], pool.length))
        }
        if (level.narabiBank) {
          for (let i = 0; i < level.narabiBank.length; i += 1) {
            pool.push(makeNarabiQuestion(levelKey, level.narabiBank[i], pool.length))
            pool.push(makeNarabiQuestion(levelKey, level.narabiBank[i], pool.length))
          }
        }
        if (level.synonymBank) {
          for (let i = 0; i < level.synonymBank.length; i += 1) {
            pool.push(makeSynonymQuestion(levelKey, level.synonymBank[i], pool.length))
            pool.push(makeSynonymQuestion(levelKey, level.synonymBank[i], pool.length))
          }
        }
        return pool
      }

      function syncN5RoadmapCompletionFromN5Xp() {
        const milestones = n5RoadmapMilestones()
        const xp = roadmapLevelXp("n5")
        const levelKey = "n5"
        if (!state.roadmapCompleted || typeof state.roadmapCompleted !== "object") state.roadmapCompleted = {}
        const prev = state.roadmapCompleted[levelKey] && typeof state.roadmapCompleted[levelKey] === "object"
          ? state.roadmapCompleted[levelKey]
          : {}
        const next = {}
        for (let i = 0; i < milestones.length; i += 1) {
          if (xp >= milestones[i].targetXp) next[String(i)] = true
        }
        const prevKeys = Object.keys(prev)
        const nextKeys = Object.keys(next)
        const changed = prevKeys.length !== nextKeys.length || nextKeys.some((key) => !prev[key])
        state.roadmapCompleted[levelKey] = next
        return changed
      }

      function questionLevelKey(q) {
        if (!q || typeof q !== "object") return state.levelKey
        const refLevelKey = q?.vocabRef?.levelKey
        if (refLevelKey) return refLevelKey
        const id = String(q.id || "")
        const match = id.match(/^([^-]+)-/)
        return match?.[1] || state.levelKey
      }

      function activeSessionPreviewXp() {
        if (state.screen !== "quiz") return 0
        if (state.mode !== "normal") return 0
        if (!state.sessionQuestions.length || state.lastResult) return 0
        return Math.max(0, Number(state.sessionEarnedXp) || 0)
      }

      function trackVocabProgressFromAnswer(q, isCorrect) {
        const ref = q?.vocabRef
        if (!ref) return false
        const key = `${ref.levelKey}:${ref.index}`
        const existing = state.vocabProgress?.[key]
        const next = existing && typeof existing === "object"
          ? { ...existing }
          : { seen: 0, correct: 0, wrong: 0, mastered: false, lastSeenDate: null }
        next.seen = Math.max(0, Number(next.seen) || 0) + 1
        if (isCorrect) next.correct = Math.max(0, Number(next.correct) || 0) + 1
        else next.wrong = Math.max(0, Number(next.wrong) || 0) + 1
        next.mastered = Boolean(next.mastered) || (next.correct >= 3)
        next.lastSeenDate = currentDateKey(new Date())
        if (!state.vocabProgress || typeof state.vocabProgress !== "object") state.vocabProgress = {}
        state.vocabProgress[key] = next
        return true
      }

      function currentQuestion() {
        return state.sessionQuestions[state.questionIndex]
      }

      function currentLevel() {
        return levels[state.levelKey]
      }

      function sessionProgressPercent() {
        const total = state.sessionQuestions.length
        if (!total) return 0
        return Math.max(0, Math.min(100, Math.round(((state.questionIndex + 1) / total) * 100)))
      }

      function levelProgressData() {
        const xp = (Number(state.profile.totalXp) || 0) + activeSessionPreviewXp()
        const level = levelFromXp(xp)
        const minXp = profileMinXpForLevel(level)
        const nextXp = profileNextXpTarget(level)
        const pct = nextXp ? Math.round(((xp - minXp) / Math.max(1, nextXp - minXp)) * 100) : 100
        return {
          xp,
          level,
          minXp,
          nextXp,
          pct: Math.max(0, Math.min(100, pct)),
          xpNeeded: nextXp ? Math.max(0, nextXp - xp) : 0
        }
      }

      function getResultMetrics() {
        const total = state.sessionQuestions.length
        const maxScore = total * POINTS_PER_CORRECT
        const correctCount = Math.round(state.score / POINTS_PER_CORRECT)
        const wrongCount = state.wrongList.reduce((acc, item) => acc + (item.count ?? 0), 0)
        const accuracy = total ? Math.round((correctCount / total) * 100) : 0
        return { total, maxScore, correctCount, wrongCount, accuracy }
      }

      function resultMessage(score, maxScore) {
        const ratio = maxScore === 0 ? 0 : score / maxScore
        if (ratio >= 0.9) return "Luar biasa. Kamu sudah masuk zona belajar premium."

        if (ratio >= 0.55) return "Progress kamu sehat. Konsistensi akan bikin skor naik cepat."
        return "Pondasinya sudah ada. Review yang salah lalu ulangi dengan ritme santai."
      }

        const persistedCompleted = state.roadmapCompleted?.n5 || {}
        const finalTarget = milestones[milestones.length - 1]?.targetXp || 1
        const overallPct = Math.max(0, Math.min(100, Math.round((xp / finalTarget) * 100)))
        const completedCount = milestones.reduce((acc, item, index) => acc + ((xp >= item.targetXp || persistedCompleted[String(index)]) ? 1 : 0), 0)

        const itemsHtml = milestones.map((item, index) => {

          const isCurrent = !isComplete && xp >= prevTarget
          const pct = isComplete

          const segmentCurrent = Math.min(Math.max(0, xp - prevTarget), item.targetXp - prevTarget)

          return `

            <div class="roadmap">${itemsHtml}</div>

      function recordWrong(q, selectedText, correctText) {
        const existing = state.wrongList.find((item) => item.qId === q.id)
        if (!existing) {
          state.wrongList.push({ qId: q.id, q, selectedText, correctText, count: 1 })
          return
        }
        existing.count += 1
        existing.selectedText = selectedText
        existing.correctText = correctText
      }

      function buildWrongReviewQuestions() {
        const base = state.savedWrongList.length ? state.savedWrongList : state.wrongList
        const uniq = []
        const seen = new Set()
        for (const item of base) {
          const id = item.q?.id
          if (!id || seen.has(id)) continue
          seen.add(id)
          uniq.push(item.q)
        }
        return shuffle(uniq)
      }

      function buildSessionQuestions() {
        const pool = buildQuestionPool(state.levelKey)
        const size = Math.min(Math.max(SESSION_SIZE_TARGET, 100), 200)
        const shuffled = shuffle(pool)
        if (shuffled.length >= size) return shuffled.slice(0, size)
        const out = []
        while (out.length < size) {
          out.push(shuffled[out.length % shuffled.length])
        }
        return out
      }

      function syncN5RoadmapCompletionFromXp() {
        const milestones = n5RoadmapMilestones()
        const xp = state.profile.totalXp
        const levelKey = "n5"
        if (!state.roadmapCompleted || typeof state.roadmapCompleted !== "object") state.roadmapCompleted = {}
        if (!state.roadmapCompleted[levelKey] || typeof state.roadmapCompleted[levelKey] !== "object") {
          state.roadmapCompleted[levelKey] = {}
        }
        const map = state.roadmapCompleted[levelKey]
        let changed = false
        for (let i = 0; i < milestones.length; i += 1) {
          if (xp >= milestones[i].targetXp && !map[String(i)]) {
            map[String(i)] = true
            changed = true
          }
        }
        return changed
      }

        if (state.screen === "vocabulary") {
          renderVocabulary()
          return
        }

        if (state.screen === "quiz") {
          renderQuiz()
          return
        }

        if (state.screen === "wrongList") {
          renderWrongList()
          return
        }

        if (state.screen === "progress") {

        if (state.screen === "categories") {

          return
        }

        renderResult()
      }

          if (xpChanged) syncN5RoadmapCompletionFromXp()
        }
        if (shouldTrackSessionProgression()) registerSession(state.profile, result.accuracy)
        state.sessionEarnedXp = 0
        persistProgress()
      }

      function rollbackActiveSessionXp() {
        if (state.mode !== "normal") return false
        if (!state.sessionQuestions.length || state.lastResult) return false
        if (!state.sessionEarnedXp) return false
        state.sessionEarnedXp = 0
        return true
      }

      function resetGame() {
        rollbackActiveSessionXp()
        state.screen = "home"
        state.mode = "normal"
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        state.savedWrongList = []
        state.sessionQuestions = []
        state.lastResult = null
        render()
      }

      function startGame() {
        markProfileActive(state.profile)
        syncN5RoadmapCompletionFromXp()
        persistProgress()
        state.screen = "quiz"
        state.mode = "normal"
        state.sessionQuestions = buildSessionQuestions()
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        state.savedWrongList = []
        state.lastResult = null
        render()
      }

      function startWrongReview() {
        const base = state.savedWrongList.length ? state.savedWrongList : state.wrongList
        if (!base.length) {
          state.screen = "wrongList"
          render()
          return
        }
        markProfileActive(state.profile)
        syncN5RoadmapCompletionFromXp()
        persistProgress()
        state.mode = "reviewWrong"
        state.screen = "quiz"
        state.sessionQuestions = buildWrongReviewQuestions()
        state.questionIndex = 0
        state.score = 0
        state.sessionEarnedXp = 0
        state.feedback = null
        state.wrongList = []
        render()
      }

      function restartSession() {
        if (state.mode === "reviewWrong") {
          startWrongReview()
          return
        }
        rollbackActiveSessionXp()
        startGame()
      }

      function goToScreen(screen) {
        if (screen === "quiz" && !state.sessionQuestions.length) {
          state.screen = "quiz"
          render()
          return
        }
        state.screen = screen
        render()
      }

      function onAnswer(optionId) {
        const q = currentQuestion()
        if (!q) return
        const streakChanged = markProfileActive(state.profile)

        const correctOpt = q.options.find((o) => o.id === q.correctOptionId)
        const selectedOpt = q.options.find((o) => o.id === optionId)
        const isCorrect = optionId === q.correctOptionId
        const correctText = q.feedbackCorrect ?? correctOpt?.text ?? ""

        const vocabChanged = trackVocabProgressFromAnswer(q, isCorrect)
        let shouldPersist = streakChanged || vocabChanged

        if (isCorrect) {
          state.score += POINTS_PER_CORRECT
          if (state.mode !== "reviewWrong") {
            state.sessionEarnedXp += POINTS_PER_CORRECT
          }
        } else {
          recordWrong(q, selectedOpt?.text ?? "", correctText)
          shouldPersist = true
        }

        state.feedback = {
          isCorrect,
          selectedId: selectedOpt?.id ?? optionId,
          correctId: q.correctOptionId,
          correctText,
          explanation: buildAnswerExplanation(q, correctText)
        }

        if (shouldPersist) persistProgress()
        render()
      }

      function next() {
        state.feedback = null
        if (state.questionIndex >= state.sessionQuestions.length - 1) {
          completeSessionIfNeeded()
          state.screen = "result"
          render()
          return
        }
        state.questionIndex += 1
        render()
      }

      function handleAction(el) {
        const action = el.getAttribute("data-action")
        if (!action) return

        if (action === "pick-level") {
          const key = el.getAttribute("data-level")
          if (!key || !levels[key]) return
          state.levelKey = key
          render()
          return
        }

        if (action === "navigate") {
          const screen = el.getAttribute("data-screen")
          if (!screen) return
          goToScreen(screen)
          return
        }

        if (action === "start") {
          startGame()
          return
        }

        if (action === "start-category") {
          const categoryId = el.getAttribute("data-category")
          const problemNumber = el.getAttribute("data-problem")
          startCategorySession(categoryId, problemNumber ? Number(problemNumber) : null)
          return
        }

        if (action === "restart") {
          restartSession()
          return
        }

        if (action === "reset") {
          resetGame()
          return
        }

        if (action === "answer") {
          if (state.feedback) return
          const optionId = el.getAttribute("data-option-id")
          if (!optionId) return
          onAnswer(optionId)
          return
        }

        if (action === "next") {
          next()
          return
        }

        if (action === "wrong-list") {
          if (state.wrongList.length) state.savedWrongList = [...state.wrongList]
          state.screen = "wrongList"
          render()
          return
        }

        if (action === "review-wrong") {
          if (!state.savedWrongList.length && state.wrongList.length) {
            state.savedWrongList = [...state.wrongList]
          }
          startWrongReview()
          return
        }

        if (action === "back-result") {
          state.screen = "result"
          render()
        }
      }

      function bindActionRoot(root) {
        root.addEventListener("click", (event) => {
          const el = event.target instanceof Element ? event.target.closest("[data-action]") : null
          if (!el) return
          handleAction(el)
        })
      }

      bindActionRoot(app)
      bindActionRoot(sidebar)
      bindActionRoot(bottomNav)
      bindActionRoot(screenBanner)

      setBrand()
      if (syncN5RoadmapCompletionFromXp()) persistProgress()
      render()
    </script>
  </body>
</html>
