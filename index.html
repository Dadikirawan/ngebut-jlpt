      function defaultProfile() {
        return { totalXp: 0, level: 1, streak: 0, lastActiveDate: null, sessionsPlayed: 0, bestAccuracy: 0 }
      }

      function currentDateKey(d) {
        const date = d instanceof Date ? d : new Date()
        const y = date.getFullYear()
        const m = String(date.getMonth() + 1).padStart(2, "0")
        const day = String(date.getDate()).padStart(2, "0")
        return `${y}-${m}-${day}`
      }

      function dateKeyOffset(days) {
        const d = new Date()
        d.setDate(d.getDate() + days)
        return currentDateKey(d)
      }

      function levelFromXp(totalXp) {
        const xp = Math.max(0, Number(totalXp) || 0)
        let level = 1
        for (let i = 0; i < XP_LEVEL_THRESHOLDS.length; i += 1) {
          if (xp >= XP_LEVEL_THRESHOLDS[i]) level = i + 1
        }
        return Math.min(level, XP_LEVEL_THRESHOLDS.length)
      }

      function normalizeProfile(raw) {
        const base = defaultProfile()
        if (!raw || typeof raw !== "object") return base

        const totalXp = Math.max(0, Number(raw.totalXp) || 0)
        const streak = Math.max(0, Number(raw.streak) || 0)
        const sessionsPlayed = Math.max(0, Number(raw.sessionsPlayed) || 0)
        const bestAccuracy = Math.max(0, Math.min(100, Number(raw.bestAccuracy) || 0))
        const lastActiveDate = typeof raw.lastActiveDate === "string" ? raw.lastActiveDate : null

        return {
          totalXp,
          level: levelFromXp(totalXp),
          streak,
          lastActiveDate,
          sessionsPlayed,
          bestAccuracy
        }
      }

      function loadProfile() {
        try {
          const raw = localStorage.getItem(PROFILE_STORAGE_KEY)
          if (!raw) return defaultProfile()
          return normalizeProfile(JSON.parse(raw))
        } catch {
          return defaultProfile()
        }
      }

      function saveProfile(profile) {
        try {
          localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile))
        } catch {}
      }

      function defaultProgressState() {
        return { version: 1, profile: defaultProfile(), roadmapCompleted: {}, vocabProgress: {}, roadmapLevelXp: {} }
      }

      function normalizeRoadmapCompleted(raw) {
        if (!raw || typeof raw !== "object") return {}
        const out = {}
        for (const [levelKey, levelMap] of Object.entries(raw)) {
          if (!levelMap || typeof levelMap !== "object") continue
          const inner = {}
          for (const [id, value] of Object.entries(levelMap)) {
            if (value) inner[String(id)] = true
          }
          if (Object.keys(inner).length) out[String(levelKey)] = inner
        }
        return out
      }

      function normalizeVocabProgress(raw) {
        if (!raw || typeof raw !== "object") return {}
        const out = {}
        for (const [key, value] of Object.entries(raw)) {
          if (!value || typeof value !== "object") continue
          const seen = Math.max(0, Number(value.seen) || 0)
          const correct = Math.max(0, Number(value.correct) || 0)
          const wrong = Math.max(0, Number(value.wrong) || 0)
          const mastered = Boolean(value.mastered) || correct >= 3
          const lastSeenDate = typeof value.lastSeenDate === "string" ? value.lastSeenDate : null
          out[String(key)] = { seen, correct, wrong, mastered, lastSeenDate }
        }
        return out
      }

      function normalizeRoadmapLevelXp(raw) {
        if (!raw || typeof raw !== "object") return {}
        const out = {}
        for (const [levelKey, value] of Object.entries(raw)) {
          out[String(levelKey)] = Math.max(0, Number(value) || 0)
        }
        return out
      }

      function normalizeProgressState(raw) {
        const base = defaultProgressState()
        if (!raw || typeof raw !== "object") return base
        return {
          version: 1,
          profile: normalizeProfile(raw.profile),
          roadmapCompleted: normalizeRoadmapCompleted(raw.roadmapCompleted),
          vocabProgress: normalizeVocabProgress(raw.vocabProgress),
          roadmapLevelXp: normalizeRoadmapLevelXp(raw.roadmapLevelXp)
        }
      }

      function saveProgressState(progress) {
        try {
          localStorage.setItem(
            PROGRESS_STORAGE_KEY,
            JSON.stringify({
              version: 1,
              profile: progress.profile,
              roadmapCompleted: progress.roadmapCompleted,
              vocabProgress: progress.vocabProgress,
              roadmapLevelXp: progress.roadmapLevelXp
            })
          )
        } catch {}
        saveProfile(progress.profile)
      }

      function loadProgressState() {
        try {
          const raw = localStorage.getItem(PROGRESS_STORAGE_KEY)
          if (raw) return normalizeProgressState(JSON.parse(raw))
        } catch {}

        const legacyProfile = loadProfile()
        const migrated = defaultProgressState()
        migrated.profile = legacyProfile
        saveProgressState(migrated)
        return migrated
      }

      function profileMinXpForLevel(level) {
        const idx = Math.max(1, Math.min(XP_LEVEL_THRESHOLDS.length, Number(level) || 1)) - 1
        return XP_LEVEL_THRESHOLDS[idx] ?? 0
      }

      function profileNextXpTarget(level) {
        const idx = Math.max(1, Math.min(XP_LEVEL_THRESHOLDS.length, Number(level) || 1)) - 1
        const next = XP_LEVEL_THRESHOLDS[idx + 1]
        return typeof next === "number" ? next : null
      }

      function markProfileActive(profile) {
        const today = currentDateKey(new Date())
        if (profile.lastActiveDate === today) return false
        const yesterday = dateKeyOffset(-1)
        const wasYesterday = profile.lastActiveDate === yesterday
        profile.streak = wasYesterday ? (Math.max(0, Number(profile.streak) || 0) + 1) : 1
        profile.lastActiveDate = today
        return true
      }

      function addXp(profile, delta) {
        const next = Math.max(0, (Number(profile.totalXp) || 0) + (Number(delta) || 0))
        if (next === profile.totalXp) return false
        profile.totalXp = next
        profile.level = levelFromXp(next)
        return true
      }

      function addRoadmapLevelXp(levelKey, delta) {
        if (!levelKey) return false
        if (!state.roadmapLevelXp || typeof state.roadmapLevelXp !== "object") state.roadmapLevelXp = {}
        const current = Math.max(0, Number(state.roadmapLevelXp[levelKey]) || 0)
        const next = Math.max(0, current + (Number(delta) || 0))
        if (next === current) return false
        state.roadmapLevelXp[levelKey] = next
        return true
      }

      function roadmapLevelXp(levelKey) {
        return Math.max(0, Number(state.roadmapLevelXp?.[levelKey]) || 0)
      }

      function registerSession(profile, accuracy) {
        profile.sessionsPlayed = Math.max(0, Number(profile.sessionsPlayed) || 0) + 1
        profile.bestAccuracy = Math.max(profile.bestAccuracy || 0, Number(accuracy) || 0)
      }

      function shouldTrackSessionProgression() {
        return state.mode !== "reviewWrong"
      }

      function initialsFromName(name) {
        const cleaned = String(name || "").trim()
        if (!cleaned) return "NJ"
        const parts = cleaned.split(/\s+/g).filter(Boolean)
        const letters = parts.slice(0, 2).map((part) => part[0] || "")
        return (letters.join("") || cleaned.slice(0, 2)).toUpperCase()
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;")
      }


      function normalizeKana(input) {
        const s = String(input || "")
        let out = ""
        for (let i = 0; i < s.length; i += 1) {
          const code = s.charCodeAt(i)
          if (code >= 0x30a1 && code <= 0x30f6) {
            out += String.fromCharCode(code - 0x60)
            continue
          }
          out += s[i]
        }
        return out
      }

      function geminatePrefix(romaji) {
        if (!romaji) return ""
        if (/^[aeiou]/.test(romaji)) return ""
        if (romaji.startsWith("ch")) return "t"
        return romaji[0]
      }

      function kanaToRomaji(input) {
        const s = normalizeKana(input)
        let out = ""
        let geminate = false

        for (let i = 0; i < s.length; i += 1) {
          const ch = s[i]

          if (ch === "っ") {
            geminate = true
            continue
          }

          if (ch === "ー") {
            const lastVowel = out.match(/[aeiou](?!.*[aeiou])/)
            if (lastVowel) out += lastVowel[0]
            continue
          }

          const digraph = i + 1 < s.length ? s.slice(i, i + 2) : ""
          let next = digraph && ROMAJI_DIGRAPHS[digraph] ? ROMAJI_DIGRAPHS[digraph] : null
          if (next) i += 1
          if (!next) next = ROMAJI_BASE[ch] ?? ch

          if (geminate) {
            out += geminatePrefix(next)
            geminate = false
          }

          out += next
        }

        return out
      }

      function extractKanaFromCorrectText(value) {
        const s = String(value || "")
        const match = s.match(/\(([^)]+)\)/)
        if (match && match[1]) return match[1].trim()
        return s.trim()
      }

      function extractHeadText(value) {
        const s = String(value || "")
        const idx = s.indexOf("(")
        if (idx === -1) return s.trim()
        return s.slice(0, idx).trim()
      }

      function buildAnswerExplanation(q, correctText) {
        const correctAnswer = String(correctText || "")

        if (q?.type === "official") {
          return {
            correctAnswer,
            romaji: "",
            meaningId: "",
            exampleJp: q?.prompt?.primary || "",
            exampleId: q?.explanationText || ""
          }
        }

        const kana = extractKanaFromCorrectText(correctAnswer)
        const romaji = kana ? kanaToRomaji(kana) : ""
        const meaningId = ANSWER_MEANING_ID[kana] ?? ""
        let exampleJp = ""
        let exampleId = ""

        if (q?.type === "particle" || q?.type === "pattern") {
          exampleJp = String(q?.prompt?.primary || "").replace("（　）", kana)
        } else if (q?.type === "story") {
          exampleJp = String(q?.prompt?.primary || "")
        } else if (q?.type === "reading" || q?.type === "kanji") {
          const head = extractHeadText(correctAnswer)
          if (head && kana) {
            exampleJp = `「${head}」は「${kana}」です。`
            exampleId = `“${head}” dibaca “${romaji}”.`
          }
        }

        return {
          correctAnswer,
          romaji,
          meaningId,
          exampleJp,
          exampleId
        }
      }

      function vocabFromRaw(list) {
        return list
          .map((s) => String(s).trim())
          .filter(Boolean)
          .map((s) => {
            const parts = s.split("|")
            return { kanji: parts[0] ?? "", kana: parts[1] ?? "" }
          })
          .filter((x) => x.kanji && x.kana)
      }

            { q: `<u>今日</u>は天気がいいです。`, choices: [`きょうじつ`, `こんにち`, `きょう`, `こんじつ`], a: 2, explanation: `今日 dibaca 'きょう' yang berarti 'hari ini'. 'こんにち' hanya dipakai dalam kata majemuk seperti こんにちは (salam 'halo'), sedangkan 'こんじつ' dan 'きょうじつ' bukan cara baca yang benar untuk kata ini.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `わたしの<u>誕生日</u>は三月です。`, choices: [`たんしょうび`, `たんじょうひ`, `だんじょうび`, `たんじょうび`], a: 3, explanation: `誕生日 dibaca 'たんじょうび' (tanggal lahir). Opsi lain salah karena kesalahan kecil pada bunyi: たんじょうひ (harusnya び bukan ひ), だんじょうび (harusnya た bukan だ), たんしょうび (harusnya じょう bukan しょう).`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `<u>毎朝</u>六時に起きます。`, choices: [`まいあさ`, `まいじょう`, `めいあさ`, `まいちょう`], a: 0, explanation: `毎朝 dibaca 'まいあさ' yang berarti 'setiap pagi'. 毎 dibaca 'まい' dan 朝 dibaca 'あさ' saat berdiri sendiri seperti ini, bukan 'ちょう' atau 'じょう'.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `この<u>荷物</u>はとても重いです。`, choices: [`にぶつ`, `にもつ`, `がもつ`, `かもつ`], a: 1, explanation: `荷物 dibaca 'にもつ' yang berarti 'barang bawaan'. がもつ, にぶつ, dan かもつ bukan cara baca yang tepat untuk kata ini (かもつ sebenarnya adalah cara baca 貨物 'barang kargo', bukan 荷物).`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `<u>来週</u>友達と旅行します。`, choices: [`らいじゅう`, `らいしゅ`, `きしゅう`, `らいしゅう`], a: 3, explanation: `来週 dibaca 'らいしゅう' yang berarti 'minggu depan'. 週 selalu dibaca 'しゅう' (bukan じゅう) pada kata ini, jadi らいじゅう dan らいしゅ salah.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `駅の<u>近く</u>にスーパーがあります。`, choices: [`きんく`, `こんく`, `ちかく`, `ちかい`], a: 2, explanation: `近く (kata benda/keterangan tempat 'di dekat') dibaca 'ちかく'. 'ちかい' adalah bentuk kata sifat 'dekat' (今日は近い日です), bukan bentuk yang dipakai di sini.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `<u>兄</u>は銀行で働いています。`, choices: [`あに`, `あにき`, `けい`, `きょう`], a: 0, explanation: `兄 (kakak laki-laki, dipakai saat membicarakan kakak sendiri ke orang lain) dibaca 'あに'. 'あにき' adalah sebutan informal/akrab, sedangkan 'けい' dan 'きょう' bukan cara baca yang benar di sini.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `この問題は<u>難しい</u>です。`, choices: [`むずかしい`, `むつかしい`, `むずがしい`, `むづかしい`], a: 0, explanation: `難しい dibaca 'むずかしい' (sulit). Perhatikan huruf 'ず' (bukan つ, づ, atau が) — ini kesalahan ejaan umum yang sering diujikan.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `今日は<u>一日中</u>雨でした。`, choices: [`ついたちじゅう`, `いちじつちゅう`, `いちにちじゅう`, `いちにちちゅう`], a: 2, explanation: `一日中 dibaca 'いちにちじゅう' yang berarti 'sepanjang hari'. Akhiran 中 di sini dibaca 'じゅう' (bukan ちゅう) karena menunjukkan durasi penuh.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `父は<u>病院</u>で働いています。`, choices: [`びょうき`, `びょういん`, `びよういん`, `ひょういん`], a: 1, explanation: `病院 (rumah sakit) dibaca 'びょういん'. 'びよういん' adalah 美容院 (salon kecantikan) — homofon yang mirip tapi beda kanji, 'びょうき' berarti 'sakit/penyakit' (kata berbeda).`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `<u>夕方</u>から雨が降るでしょう。`, choices: [`ゆうがた`, `ゆがた`, `せきかた`, `ゆうほう`], a: 0, explanation: `夕方 dibaca 'ゆうがた' yang berarti 'sore hari'. Opsi lain merupakan gabungan bunyi yang tidak sesuai dengan kanji ini.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `この道を<u>右</u>に曲がってください。`, choices: [`ゆう`, `みぎ`, `みき`, `う`], a: 1, explanation: `右 (kanan) dibaca 'みぎ'. 'みき' hampir mirip tapi salah huruf terakhir (harus konsonan 'g' bukan 'k').`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `<u>地下鉄</u>で会社へ行きます。`, choices: [`ちがてつ`, `ちかてづ`, `ちかてつ`, `じかてつ`], a: 2, explanation: `地下鉄 (kereta bawah tanah/subway) dibaca 'ちかてつ'. 地 dibaca 'ち' (bukan じ), 下 dibaca 'か' (bukan が), dan 鉄 dibaca 'てつ' (bukan てづ).`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `彼女は<u>有名</u>な歌手です。`, choices: [`ゆうめい`, `ゆうみょう`, `ゆめい`, `ゆうめん`], a: 0, explanation: `有名 (terkenal) dibaca 'ゆうめい'. 名 di kata ini dibaca 'めい' bukan 'みょう' atau 'めん'.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `<u>今夜</u>は早く寝ます。`, choices: [`いまや`, `こんよる`, `こんや`, `きんや`], a: 2, explanation: `今夜 (malam ini) dibaca 'こんや'. 夜 di sini dibaca 'や' bukan 'よる' karena bergabung dengan 今 (こん).`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `駅前に新しい<u>建物</u>ができました。`, choices: [`たてもの`, `けんもつ`, `たてぶつ`, `けんぶつ`], a: 0, explanation: `建物 (bangunan) dibaca 'たてもの'. 'けんぶつ' berarti 'melihat-lihat/tamasya' (見物), sebuah kata yang sama sekali berbeda meski kanjinya beda juga.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `<u>妹</u>はまだ小学生です。`, choices: [`いもおと`, `いもうとお`, `まい`, `いもうと`], a: 3, explanation: `妹 (adik perempuan) dibaca 'いもうと'. Perhatikan ejaan vokal panjangnya: bukan 'いもおと' atau 'いもうとお'.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `この箱は<u>軽い</u>ので一人で運べます。`, choices: [`かるい`, `けいい`, `かるいい`, `かろい`], a: 0, explanation: `軽い (ringan) dibaca 'かるい'. Opsi lain adalah kesalahan ejaan (かるいい kelebihan huruf, かろい salah vokal).`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `卒業<u>試験</u>は来月です。`, choices: [`じけん`, `しけん`, `しいけん`, `しげん`], a: 1, explanation: `試験 (ujian) dibaca 'しけん'. 'じけん' berarti 'kejadian/insiden' (事件), kata yang berbeda arti sama sekali.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `会議は<u>午後</u>三時から始まります。`, choices: [`ごほう`, `ごご`, `こうご`, `ごこ`], a: 1, explanation: `午後 (siang/sore, setelah tengah hari) dibaca 'ごご'. Ini salah satu kata yang paling sering keliru diucapkan pemula, pastikan hafal 'ごご' bukan 'こうご'.`, passage: ``, sectionLabel: `文字・語彙 · Cara Baca Kanji`, problemNumber: 1 },
            { q: `らいしゅう <u>りょこう</u>に いきます。`, choices: [`旅衍`, `旅航`, `旅行`, `族行`], a: 2, explanation: `'りょこう' (bepergian/wisata) ditulis 旅行. 旅 = perjalanan, 行 = pergi. Opsi lain memakai kanji yang salah atau tidak ada gabungan katanya.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `この <u>みせ</u>は やすくて おいしいです。`, choices: [`店`, `庄`, `占`, `床`], a: 0, explanation: `'みせ' (toko) ditulis 店. 占 (占う=meramal), 床 (lantai), dan 庄 bukan kanji untuk 'toko'.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `<u>でんしゃ</u>の なかで ほんを よみます。`, choices: [`電東`, `電車`, `電軍`, `雷車`], a: 1, explanation: `'でんしゃ' (kereta listrik) ditulis 電車. 電 (listrik) sering tertukar dengan 雷 (petir) karena bentuknya mirip — perhatikan baik-baik.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `まいにち <u>こうえん</u>を さんぽします。`, choices: [`公演`, `工園`, `公園`, `広園`], a: 2, explanation: `'こうえん' (taman) ditulis 公園. 公演 (こうえん juga tapi beda kanji) berarti 'pertunjukan', jadi harus hati-hati membedakan konteks.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `きのうは <u>あめ</u>でした。`, choices: [`雨`, `雲`, `雪`, `雫`], a: 0, explanation: `'あめ' (hujan) ditulis 雨. 雪 = salju (ゆき), 雲 = awan (くも), 雫 = tetesan (しずく).`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `この <u>えいが</u>は とても おもしろいです。`, choices: [`英画`, `映画`, `栄画`, `映書`], a: 1, explanation: `'えいが' (film) ditulis 映画. Pastikan tidak tertukar dengan gabungan kanji lain yang mirip bunyi/bentuknya.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `たんじょうびに <u>ケーキ</u>を たべます。`, choices: [`ケーキ`, `ケイキ`, `ケーギ`, `ゲーキ`], a: 0, explanation: `'kue/cake' ditulis dalam katakana ケーキ dengan tanda panjang (ー), bukan ゲーキ/ケーギ (huruf dakuten salah tempat) atau ケイキ (tanpa tanda panjang).`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `きょうしつに <u>がくせい</u>が じゅうにん います。`, choices: [`学正`, `学青`, `字生`, `学生`], a: 3, explanation: `'がくせい' (siswa/mahasiswa) ditulis 学生. Opsi lain menggunakan kanji mirip bentuk tapi salah (字, 正, 青).`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `<u>でぱーと</u>で あたらしい くつを かいました。`, choices: [`デパト`, `デパート`, `デパード`, `テパート`], a: 1, explanation: `'department store' ditulis デパート. Perhatikan huruf ド (dengan dakuten) dan tanda panjang ー yang tepat posisinya.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `<u>びょういん</u>へ いって くすりを もらいました。`, choices: [`痛院`, `病院`, `病完`, `病員`], a: 1, explanation: `'びょういん' (rumah sakit) ditulis 病院. 病員/病完/痛院 bukan kata yang benar.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `まいあさ <u>しんぶん</u>を よみます。`, choices: [`新聞`, `親聞`, `新文`, `新問`], a: 0, explanation: `'しんぶん' (koran) ditulis 新聞. 新 = baru, 聞 = mendengar/berita.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `<u>そら</u>が きれいな いろに なりました。`, choices: [`究`, `穴`, `空`, `室`], a: 2, explanation: `'そら' (langit) ditulis 空. Opsi lain (穴=lubang, 室=ruangan, 究=meneliti) tidak berkaitan.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `らいねん <u>だいがく</u>に はいります。`, choices: [`大字`, `大楽`, `太学`, `大学`], a: 3, explanation: `'だいがく' (universitas) ditulis 大学. 大 = besar, 学 = belajar/ilmu.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `<u>でんわ</u>ばんごうを おしえて ください。`, choices: [`電話`, `雷話`, `電活`, `電語`], a: 0, explanation: `'でんわ' (telepon) ditulis 電話. 電 = listrik, 話 = bicara. Awas jangan tertukar dengan 雷 (petir).`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `けさは <u>さむかった</u>です。`, choices: [`寒がった`, `実かった`, `塞かった`, `寒かった`], a: 3, explanation: `'さむかった' (dingin, bentuk lampau) ditulis 寒かった. 実 dan 塞 kanjinya mirip 寒 tapi salah, dan 寒がった salah karena harusnya かった bukan がった.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `にほんごの <u>しけん</u>を うけます。`, choices: [`試検`, `試験`, `詩験`, `式験`], a: 1, explanation: `'しけん' (ujian) ditulis 試験. Opsi lain menggunakan kanji mirip bentuk (詩=puisi, 式=upacara/rumus, 検 salah pasangan kanji).`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `この <u>みち</u>を まっすぐ いって ください。`, choices: [`首`, `道`, `通`, `導`], a: 1, explanation: `'みち' (jalan) ditulis 道. 導 (membimbing), 首 (leher), 通 (melewati) adalah kanji lain yang mirip tapi tidak tepat di sini.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `<u>らじお</u>で にゅーすを ききます。`, choices: [`ラヅオ`, `ラジヲ`, `ラジォ`, `ラジオ`], a: 3, explanation: `'radio' ditulis ラジオ dengan katakana オ ukuran normal (bukan ォ kecil) dan huruf ジ (bukan ヅ).`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `あにの しごとは <u>いしゃ</u>です。`, choices: [`矢者`, `医院`, `医社`, `医者`], a: 3, explanation: `'いしゃ' (dokter) ditulis 医者. 医院 berarti 'klinik' (tempat, bukan orang), jadi meski mirip, artinya berbeda.`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `きょうは <u>かぞく</u>と しょくじします。`, choices: [`家族`, `家属`, `加族`, `家俗`], a: 0, explanation: `'かぞく' (keluarga) ditulis 家族. Opsi lain memakai kanji mirip bentuk tapi salah (属, 加, 俗).`, passage: ``, sectionLabel: `文字・語彙 · Penulisan Kanji`, problemNumber: 2 },
            { q: `毎朝、コーヒーを（　）飲みます。`, choices: [`一台`, `一杯`, `一冊`, `一枚`], a: 1, explanation: `Untuk menghitung 'segelas/secangkir' minuman digunakan satuan 杯 (はい), jadi 一杯 (secangkir kopi). 一冊 untuk buku, 一台 untuk mesin/kendaraan, 一枚 untuk benda tipis/lembaran.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `教室の中は（　）静かでした。`, choices: [`たぶん`, `ぜんぜん`, `とても`, `あまり`], a: 2, explanation: `Kalimat ini positif (静かでした = tenang), jadi kata keterangan yang cocok adalah とても (sangat). あまり dan ぜんぜん biasanya dipasangkan dengan bentuk negatif (静かではなかった), dan たぶん (mungkin) tidak sesuai konteks kepastian ini.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `電車が（　）来ないので、遅刻しました。`, choices: [`きっと`, `なかなか`, `もう`, `だんだん`], a: 1, explanation: `なかなか来ない berarti 'tak kunjung datang, sudah ditunggu lama tapi belum juga'. もう (sudah), きっと (pasti), だんだん (lambat laun) tidak cocok pada konteks penantian yang lama ini.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この本を（　）ください。すぐ返します。`, choices: [`あげて`, `貸して`, `返して`, `借りて`], a: 1, explanation: `Karena pembicara meminta buku dari lawan bicara dan berjanji akan segera mengembalikannya, kata yang tepat adalah 貸して (pinjamkan, dari sudut pandang si pemberi pinjaman). 借りて berarti 'meminjam' tapi bentuknya tidak pas untuk permintaan langsung di sini, あげて (memberi) dan 返して (mengembalikan) tidak sesuai makna.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `台風で電車が（　）、会社に行けませんでした。`, choices: [`止まって`, `着いて`, `動いて`, `走って`], a: 0, explanation: `Karena topan menyebabkan tidak bisa berangkat kerja, keretanya pasti 止まって (berhenti beroperasi). 走って (berjalan/berlari), 着いて (tiba), 動いて (bergerak) tidak sesuai konteks gangguan tersebut.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `テストの前に、教科書を（　）復習しました。`, choices: [`まだ`, `もっと`, `もう一度`, `もうすぐ`], a: 2, explanation: `もう一度 berarti 'sekali lagi', cocok untuk konteks meninjau ulang buku pelajaran sebelum tes. まだ (masih belum), もうすぐ (sebentar lagi), もっと (lebih) tidak pas di sini.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼は日本語が（　）上手です。`, choices: [`とても`, `あまり`, `ぜんぜん`, `すこし`], a: 0, explanation: `上手です (mahir) adalah pernyataan positif, jadi keterangan yang cocok adalah とても (sangat). ぜんぜん dan あまり memerlukan bentuk negatif, すこし kurang natural dengan 上手.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この道は狭いので、車が（　）通れません。`, choices: [`一台も`, `一台しか`, `一台に`, `一台まで`], a: 1, explanation: `Pola '～しか～ません' berarti 'hanya... yang bisa' (dengan makna terbatas). 一台しか通れません = 'hanya satu mobil yang bisa lewat'. Opsi lain tidak membentuk pola gramatikal yang benar dengan ～ません.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `冷蔵庫に卵が（　）しか　残っていません。`, choices: [`二つ`, `二人`, `二回`, `二冊`], a: 0, explanation: `Telur adalah benda bulat/kecil yang dihitung dengan satuan つ, jadi 二つ (dua butir). 二回 (dua kali/frekuensi), 二人 (dua orang), 二冊 (dua buku) tidak sesuai untuk telur.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `友達に手紙を（　）、返事を待っています。`, choices: [`出して`, `出て`, `出させて`, `出られて`], a: 0, explanation: `手紙を出す berarti 'mengirim surat'. Bentuk te-nya adalah 出して, sehingga kalimatnya berarti 'setelah mengirim surat ke teman, sedang menunggu balasannya'. Bentuk lain (自動詞 出る, pasif 出られて, kausatif 出させて) tidak cocok dengan objek 手紙を.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `赤ちゃんが泣いているので、（　）抱きました。`, choices: [`はやく`, `やさしく`, `きびしく`, `うるさく`], a: 1, explanation: `Saat bayi menangis, wajar jika dipeluk dengan やさしく (lembut). きびしく (keras/tegas), うるさく (berisik) tidak cocok untuk tindakan menenangkan bayi.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `会議の資料は（　）用意しておきました。`, choices: [`そろそろ`, `これから`, `やっと`, `すでに`], a: 3, explanation: `すでに berarti 'sudah' (menunjukkan sesuatu telah selesai dipersiapkan sebelumnya). これから (mulai sekarang), そろそろ (sebentar lagi), やっと (akhirnya) tidak cocok dengan konteks persiapan yang sudah selesai.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `エアコンを（　）から寝ました。`, choices: [`消して`, `消えて`, `つく`, `つけて`], a: 0, explanation: `Sebelum tidur biasanya AC dimatikan, jadi 消して (mematikan, bentuk transitif dari 消す). つけて berarti 'menyalakan' yang kurang lazim sebelum tidur, つく dan 消えて adalah bentuk intransitif yang tidak cocok dengan objek エアコンを.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `駅まで歩いて（　）分くらいです。`, choices: [`十五年`, `十五`, `十五回`, `十五時`], a: 1, explanation: `Untuk menyatakan lama waktu dalam menit, cukup angka + 分 yang sudah tertulis setelah kurung, jadi hanya diperlukan angka '十五' (lima belas). 年 (tahun), 回 (kali), 時 (jam) tidak sesuai satuan menit yang dimaksud.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この店のラーメンは（　）おいしいと評判です。`, choices: [`まさに`, `べつに`, `たまに`, `とくに`], a: 3, explanation: `とくに berarti 'terutama/khususnya', cocok untuk menekankan bahwa ramen di toko ini istimewa enaknya. べつに (tidak juga/khususnya jika negatif), たまに (kadang-kadang), まさに (benar-benar/persis) kurang pas di konteks pujian reputasi ini.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `彼女は毎日日記を（　）います。`, choices: [`つけて`, `よんで`, `かいて`, `つくって`], a: 0, explanation: `日記をつける adalah ungkapan tetap yang berarti 'menulis buku harian secara rutin'. Meski 書く (menulis) juga masuk akal secara harfiah, ungkapan baku dan alami untuk kebiasaan menulis diari adalah つける.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この部分は問題（　）ところです。`, choices: [`がある`, `でない`, `とある`, `がない`], a: 0, explanation: `問題がある berarti 'ada masalah'. Kalimat ini menjelaskan bahwa bagian ini adalah bagian yang bermasalah, jadi 問題があるところ (bagian yang ada masalahnya). がない (tidak ada) berlawanan makna, でない dan とある tidak membentuk pola yang tepat.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `その部屋は暗いので、電気を（　）ください。`, choices: [`けして`, `つけて`, `しめて`, `とめて`], a: 1, explanation: `Karena ruangan gelap, wajar diminta untuk つけて (menyalakan) lampu. けして (mematikan) berlawanan makna, とめて (menghentikan) dan しめて (menutup) tidak cocok untuk 'lampu/listrik'.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `妹は人形で（　）遊んでいます。`, choices: [`ばかり`, `しか`, `だけ`, `よく`], a: 0, explanation: `～ばかり setelah kata benda + で menunjukkan 'selalu/hanya itu saja yang dilakukan', jadi 人形でばかり遊んでいます berarti 'selalu bermain boneka saja'. だけ dan しか memerlukan struktur partikel berbeda, よく (sering) kurang menekankan makna 'melulu' seperti konteksnya.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `宿題を忘れたので、先生に（　）ました。`, choices: [`よばれ`, `ほめられ`, `たのまれ`, `しかられ`], a: 3, explanation: `Karena lupa mengerjakan PR, wajar jika dimarahi guru: 叱られる (bentuk pasif dari 叱る = memarahi) → しかられました. たのまれ (diminta tolong), よばれ (dipanggil), ほめられ (dipuji) tidak sesuai dengan konteks kesalahan lupa PR.`, passage: ``, sectionLabel: `文字・語彙 · Pemilihan Kata sesuai Konteks`, problemNumber: 3 },
            { q: `この部屋はきれいです。`, choices: [`この部屋は暗いです。`, `この部屋はにぎやかです。`, `この部屋は広いです。`, `この部屋はよごれていません。`], a: 3, explanation: `きれい di sini berarti 'bersih/rapi', yang maknanya sama dengan 'tidak kotor' → よごれていません. 広い (luas), 暗い (gelap), にぎやか (ramai) adalah makna yang berbeda dari 'bersih'.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `田中さんはひまです。`, choices: [`田中さんはねむいです。`, `田中さんはいそがしくないです。`, `田中さんはうれしいです。`, `田中さんはいそがしいです。`], a: 1, explanation: `ひま berarti 'senggang/tidak sibuk', sepadan dengan いそがしくないです (tidak sibuk). いそがしい (sibuk) justru lawan katanya, sedangkan ねむい (mengantuk) dan うれしい (senang) tidak berkaitan.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この店は安いです。`, choices: [`この店は古いです。`, `この店はねだんが高くないです。`, `この店は小さいです。`, `この店はおいしくないです。`], a: 1, explanation: `安い (murah) berarti harganya tidak mahal, sepadan dengan ねだんが高くないです (harganya tidak mahal). Opsi lain membicarakan hal yang tidak berkaitan dengan harga.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `きのう、母にしかられました。`, choices: [`きのう、母はわたしにおこりました。`, `きのう、母はわたしをほめました。`, `きのう、母はわたしにあいました。`, `きのう、母はわたしをよびました。`], a: 0, explanation: `しかられました (dimarahi) berarti ibu marah kepada saya, sepadan dengan 母はわたしにおこりました (ibu marah pada saya). ほめました (memuji) berlawanan makna, あいました (bertemu) dan よびました (memanggil) tidak sesuai.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `山田さんは病気で会社を休みました。`, choices: [`山田さんは元気で会社に行きました。`, `山田さんは会社をやめました。`, `山田さんは体の具合が悪くて会社に行きませんでした。`, `山田さんは休みが好きです。`], a: 2, explanation: `病気で休みました berarti tidak masuk kerja karena sakit, sepadan dengan 体の具合が悪くて会社に行きませんでした (kondisi badan buruk sehingga tidak pergi kerja). やめました berarti 'berhenti kerja' (permanen), berbeda maknanya.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この問題はやさしいです。`, choices: [`この問題はふくざつです。`, `この問題はむずかしいです。`, `この問題はかんたんです。`, `この問題は長いです。`], a: 2, explanation: `やさしい di sini berarti 'mudah', sepadan dengan かんたんです (sederhana/mudah). むずかしい (sulit) dan ふくざつ (rumit) justru lawan katanya.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `田中さんは料理が上手です。`, choices: [`田中さんは料理がすきではありません。`, `田中さんは料理がへたです。`, `田中さんは料理がじょうずにできます。`, `田中さんは料理をつくりません。`], a: 2, explanation: `上手です (mahir) sepadan dengan じょうずにできます (bisa melakukan dengan baik). へた (tidak mahir) justru lawan katanya, opsi lain juga tidak sesuai makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼はとても親切です。`, choices: [`彼は人にやさしくします。`, `彼は人にきょうみがありません。`, `彼は人にきびしいです。`, `彼は人がすきではありません。`], a: 0, explanation: `親切 (baik hati/ramah) sepadan dengan やさしくします (bersikap lembut/baik pada orang). きびしい (keras/tegas) adalah lawan makna, opsi lain tidak berkaitan.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この道はとても静かです。`, choices: [`この道はせまいです。`, `この道はにぎやかです。`, `この道は音があまりしません。`, `この道は工事中です。`], a: 2, explanation: `静か (tenang/sepi) berarti minim suara, sepadan dengan 音があまりしません (tidak banyak bersuara). にぎやか (ramai) justru lawan katanya.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `妹は父ににています。`, choices: [`妹と父はかおがよく似ています。`, `妹は父がすきではありません。`, `妹は父とけんかしました。`, `妹と父は全然ちがいます。`], a: 0, explanation: `にています (mirip) berarti wajahnya serupa, sepadan dengan かおがよく似ています (wajahnya sangat mirip). ちがいます (berbeda) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この仕事はもう終わりました。`, choices: [`この仕事はこれからです。`, `この仕事はまだです。`, `この仕事はもうすみました。`, `この仕事はやめました。`], a: 2, explanation: `終わりました (sudah selesai) sepadan dengan もうすみました (sudah selesai). まだ (belum) dan これから (mulai sekarang) berlawanan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `電車がこんでいます。`, choices: [`電車がとまっています。`, `電車の中に人がたくさんいます。`, `電車がおくれています。`, `電車の中に人がすくないです。`], a: 1, explanation: `こんでいます (penuh sesak) sepadan dengan 人がたくさんいます (banyak orang di dalamnya). すくない (sedikit) justru lawan makna, とまっています (berhenti) dan おくれています (terlambat) tidak berkaitan.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `この花はめずらしいです。`, choices: [`この花はきれいではありません。`, `この花はよく見かけます。`, `この花はあまり見かけません。`, `この花はやすいです。`], a: 2, explanation: `めずらしい (langka/jarang) sepadan dengan あまり見かけません (jarang terlihat). よく見かけます (sering terlihat) justru lawan makna.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `兄は背が高いです。`, choices: [`兄は体重が重いです。`, `兄は年上です。`, `兄は足が長いです。`, `兄は身長が高いです。`], a: 3, explanation: `背が高い (tinggi badannya tinggi) sepadan dengan 身長が高いです (tinggi badannya tinggi). Opsi lain membahas usia, panjang kaki, atau berat badan yang tidak sama artinya.`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `彼女はよく忘れ物をします。`, choices: [`彼女はものをよく壊します。`, `彼女はものをよく置いてきてしまいます。`, `彼女はものをよく貸します。`, `彼女はものをよくなくします。`], a: 1, explanation: `忘れ物をします berarti 'sering meninggalkan/melupakan barangnya di suatu tempat', sepadan dengan ものをよく置いてきてしまいます (sering meninggalkan barang tanpa sengaja). なくします berarti 'menghilangkan barang' yang maknanya sedikit berbeda (bisa hilang di mana saja, bukan tertinggal di tempat tertentu).`, passage: ``, sectionLabel: `文字・語彙 · Ungkapan Sepadan (Paraphrase)`, problemNumber: 4 },
            { q: `きのう、友達（　）映画を見に行きました。`, choices: [`の`, `を`, `と`, `が`], a: 2, explanation: `Partikel と digunakan untuk menyatakan 'bersama dengan' (teman sebagai partner aktivitas): 友達と映画を見に行きました (pergi nonton film bersama teman).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `このスープはとても熱い（　）、気をつけてください。`, choices: [`けど`, `とき`, `し`, `ので`], a: 3, explanation: `ので menyatakan sebab-akibat secara halus/objektif: 'karena sup ini sangat panas, harap hati-hati'. し dipakai untuk menyusun beberapa alasan sekaligus, とき berarti 'saat', dan けど berarti 'tetapi' — semuanya tidak pas di sini.`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `毎朝、パン（　）食べます。`, choices: [`が`, `で`, `に`, `を`], a: 3, explanation: `Partikel を menandai objek langsung dari kata kerja 食べます (makan): パンを食べます (makan roti).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `テストが終わった（　）、遊びに行きましょう。`, choices: [`ら`, `なら`, `ても`, `たら`], a: 0, explanation: `Pola ～たら dibentuk dari bentuk lampau (た-form) + ら, bukan menambahkan 'たら' utuh. Karena '終わった' sudah berbentuk lampau, cukup tambahkan 'ら' saja → 終わったら (setelah selesai), lalu ayo pergi bermain. Kalau ditambah 'たら' lagi hasilnya jadi '終わったたら' yang salah (dobel た). 'なら' menyatakan syarat dengan konteks berbeda, 'ても' berarti 'meskipun'.`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `この本はあなた（　）あげます。`, choices: [`を`, `が`, `に`, `で`], a: 2, explanation: `Partikel に menandai penerima pada pola ～をあげます (memberi kepada): あなたにあげます (memberikan kepadamu).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `雨が降って（　）、試合は中止になりました。`, choices: [`きて`, `いる`, `いたので`, `きたので`], a: 2, explanation: `いたので (bentuk lampau 'sedang' + karena) menjelaskan sebab pertandingan dibatalkan: karena hujan sedang/sudah turun (kondisi berlangsung), pertandingan dibatalkan. Konteks lampau pada 中止になりました menuntut alasan dalam bentuk lampau juga.`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `妹はピアノ（　）弾くことができます。`, choices: [`で`, `を`, `に`, `が`], a: 3, explanation: `Pada pola '～ことができます' (bisa melakukan), objek kemampuan sering ditandai partikel が: ピアノが弾くことができます (bisa memainkan piano).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `駅（　）歩いて十分ぐらいかかります。`, choices: [`まで`, `から`, `を`, `に`], a: 0, explanation: `まで menyatakan titik akhir/tujuan jarak: 駅まで歩いて十分 (butuh sepuluh menit jalan kaki sampai ke stasiun).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `この問題は私（　）わかりません。`, choices: [`では`, `への`, `とは`, `には`], a: 3, explanation: `には menekankan 'bagi saya (khususnya)': 私にはわかりません (bagi saya, ini tidak dimengerti), menyiratkan mungkin orang lain mengerti.`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `彼は日本語（　）英語（　）話せます。`, choices: [`を、を`, `は、は`, `も、も`, `が、が`], a: 2, explanation: `も...も digunakan untuk menyatakan 'baik...maupun...' (keduanya sama-sama berlaku): 日本語も英語も話せます (bisa bicara baik bahasa Jepang maupun bahasa Inggris).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `この薬は一日に三回（　）飲んでください。`, choices: [`ずつ`, `しか`, `ばかり`, `だけ`], a: 0, explanation: `ずつ menyatakan 'masing-masing/setiap kali sejumlah tertentu': 三回ずつ (tiga kali setiap harinya, secara merata/rutin).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `友達に傘を貸して（　）。`, choices: [`あげました`, `もらいました`, `やりました`, `くれました`], a: 3, explanation: `貸してくれました berarti 'teman meminjamkan (payung) untuk saya' — bentuk くれる dipakai saat orang lain melakukan sesuatu yang menguntungkan pembicara. あげました dan やりました berarti pembicara yang memberi, もらいました memerlukan struktur berbeda (〜に〜を貸してもらう).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `先生（　）この漢字の読み方を習いました。`, choices: [`を`, `から`, `に`, `で`], a: 1, explanation: `から menandai sumber pembelajaran: 先生から習いました (belajar dari guru). に juga bisa dipakai pada beberapa konteks 'belajar dari', tapi から lebih tepat menekankan sumber informasi/ilmu di sini.`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `電車の中で寝て（　）、駅を乗り過ごしました。`, choices: [`あって`, `みて`, `しまって`, `おいて`], a: 2, explanation: `～てしまう menyatakan penyesalan/hal yang terjadi di luar kendali: 寝てしまって (tanpa sengaja tertidur), sehingga kebablasan turun di stasiun.`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `母は私に「早く起き（　）」と言いました。`, choices: [`ました`, `ません`, `なさい`, `たい`], a: 2, explanation: `～なさい adalah bentuk perintah lembut yang biasa dipakai orang tua/guru: 早く起きなさい (bangunlah lebih awal).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `この部屋は静か（　）、勉強しやすいです。`, choices: [`だ`, `に`, `の`, `で`], a: 3, explanation: `Kata sifat-na (静か) yang menghubungkan ke klausa berikutnya menggunakan bentuk て/で: 静かで (tenang, dan...), lalu 勉強しやすいです (mudah belajar).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `宿題をし（　）テレビを見てはいけません。`, choices: [`ないで`, `ないと`, `なくて`, `ずに`], a: 0, explanation: `～ないで berarti 'tanpa melakukan': 宿題をしないでテレビを見てはいけません (tidak boleh menonton TV tanpa mengerjakan PR dulu). ずに memiliki makna serupa tapi lebih formal dan biasanya tidak dipasangkan langsung dengan pola larangan ini secara alami di level N5.`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `空が暗くなってきた（　）、そろそろ帰りましょう。`, choices: [`ので`, `けど`, `が`, `のに`], a: 0, explanation: `ので menyatakan sebab: karena langit mulai gelap, ayo segera pulang. のに (padahal) menyiratkan pertentangan yang tidak sesuai konteks ini.`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `彼女は結婚（　）仕事を続けています。`, choices: [`しても`, `しては`, `したら`, `すると`], a: 0, explanation: `～ても berarti 'meskipun/walaupun': 結婚しても仕事を続けています (meskipun sudah menikah, tetap melanjutkan kerja).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `このカメラは小さくて軽い（　）、写真もきれいです。`, choices: [`し`, `が`, `ても`, `のに`], a: 0, explanation: `し dipakai untuk menyusun beberapa alasan/fakta positif sekaligus: 小さくて軽いし、写真もきれいです (kecil dan ringan, lagipula fotonya juga bagus).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `田中さんはまだ来て（　）ようです。`, choices: [`きた`, `いる`, `いった`, `いない`], a: 3, explanation: `～ていない berarti 'belum melakukan': まだ来ていないようです (sepertinya belum datang).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `子供（　）こんな難しい本は読めません。`, choices: [`が`, `の`, `を`, `に`], a: 3, explanation: `に pada pola ini menandai 'bagi/untuk (subjek kemampuan)': 子供にはこんな難しい本は読めません (bagi anak-anak, buku sesulit ini tidak bisa dibaca).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `会議の時間が（　）変更になりました。`, choices: [`三時から四時に`, `三時に四時を`, `三時で四時と`, `三時を四時が`], a: 0, explanation: `Pola 'AからBに変更になりました' menyatakan perubahan dari A ke B: 三時から四時に変更になりました (waktu rapat berubah dari jam 3 menjadi jam 4).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `熱がある（　）、学校を休みます。`, choices: [`けど`, `ので`, `し、し`, `でも`], a: 1, explanation: `ので menyatakan sebab: karena sedang demam, jadi tidak masuk sekolah.`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `料理ができた（　）教えてください。`, choices: [`ら`, `し`, `でも`, `けど`], a: 0, explanation: `～たら (di sini disingkat menjadi 「た」+「ら」) menyatakan 'kalau sudah/setelah': できたら教えてください (kalau masakannya sudah jadi, tolong beri tahu saya).`, passage: ``, sectionLabel: `文法 · Partikel & Pola Kalimat`, problemNumber: 5 },
            { q: `きのう ＿＿＿ ★ ＿＿＿ ＿＿＿ 買いました。`, choices: [`②新しいかばんを`, `①デパートで`, `④値段で`, `③安い`], a: 3, explanation: `Susunan yang benar: ①デパートで③安い④値段で②新しいかばんを買いました (Kemarin, membeli tas baru dengan harga murah di department store). Posisi ★ (ke-2) diisi oleh ③安い.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `この本は ＿＿＿ ★ ＿＿＿ ＿＿＿ です。`, choices: [`①とても`, `④ある`, `③人気が`, `②読みやすくて`], a: 1, explanation: `Susunan yang dimaksud menekankan bahwa buku ini 'sangat mudah dibaca dan populer' (とても読みやすくて人気がある). Posisi ★ (ke-2) diisi oleh ④ある sesuai kunci jawaban.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `駅から ＿＿＿ ★ ＿＿＿ ＿＿＿ 着きます。`, choices: [`①歩いて`, `③会社に`, `④まっすぐ`, `②十分ぐらいで`], a: 3, explanation: `Susunan: ①歩いて②十分ぐらいで④まっすぐ③会社に着きます (Dari stasiun, jalan kaki sekitar sepuluh menit lurus sampai ke kantor). Posisi ★ (ke-2) diisi oleh ②十分ぐらいで.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `彼女は ＿＿＿ ＿＿＿ ★ ＿＿＿ 料理を作っています。`, choices: [`③おいしい`, `①毎日`, `④ために`, `②家族の`], a: 2, explanation: `Susunan: ①毎日②家族の④ために③おいしい料理を作っています (Setiap hari, demi keluarganya, dia membuat masakan yang enak). Posisi ★ (ke-3) diisi oleh ④ために.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `宿題が ＿＿＿ ★ ＿＿＿ ＿＿＿ 遊びに行きます。`, choices: [`④一緒に`, `①終わったら`, `②友達と`, `③公園へ`], a: 2, explanation: `Susunan: ①終わったら②友達と④一緒に③公園へ遊びに行きます (Kalau PR sudah selesai, akan pergi bermain ke taman bersama teman). Posisi ★ (ke-2) diisi oleh ②友達と.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `この薬は ＿＿＿ ＿＿＿ ★ ＿＿＿ ください。`, choices: [`④ずつ`, `②三回`, `③飲んで`, `①一日に`], a: 0, explanation: `Susunan: ①一日に②三回④ずつ③飲んでください (Tolong minum obat ini tiga kali sehari, masing-masing sesuai takaran). Posisi ★ (ke-3) diisi oleh ④ずつ.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `父は ＿＿＿ ★ ＿＿＿ ＿＿＿ 会社です。`, choices: [`④とても`, `①駅から`, `②近い`, `③働いている`], a: 0, explanation: `Susunan: ①駅から④とても②近い③働いている会社です (Kantor tempat ayah bekerja sangat dekat dari stasiun). Posisi ★ (ke-2) diisi oleh ④とても.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `母が ＿＿＿ ★ ＿＿＿ ＿＿＿ 食べました。`, choices: [`④おいしく`, `①作って`, `③料理を`, `②くれた`], a: 3, explanation: `Susunan yang wajar: 母が作ってくれた料理をおいしく食べました (memakan dengan lezat masakan yang dibuatkan ibu untuk saya). Posisi ★ (ke-2) diisi oleh ②くれた sesuai kunci jawaban, menekankan makna 'dibuatkan untuk saya' (～てくれる).`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `テストが ＿＿＿ ＿＿＿ ★ ＿＿＿ 旅行に行きたいです。`, choices: [`④へ`, `②友達と`, `①終わったら`, `③海外`], a: 3, explanation: `Susunan: ①終わったら②友達と③海外④へ旅行に行きたいです (Kalau tes sudah selesai, ingin pergi wisata ke luar negeri bersama teman). Posisi ★ (ke-3) diisi oleh ③海外.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `このカメラは ＿＿＿ ★ ＿＿＿ ＿＿＿ 写真がきれいです。`, choices: [`②軽い`, `①小さくて`, `③のに`, `④とても`], a: 0, explanation: `Susunan: ①小さくて②軽い③のに④とても写真がきれいです (Meskipun kamera ini kecil dan ringan, fotonya sangat bagus). Posisi ★ (ke-2) diisi oleh ②軽い.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `友達に ＿＿＿ ★ ＿＿＿ ＿＿＿ もらいました。`, choices: [`③素敵な`, `②プレゼントを`, `④きれいな`, `①誕生日に`], a: 2, explanation: `Susunan: ①誕生日に④きれいな③素敵な②プレゼントをもらいました (Menerima kado yang cantik dan bagus dari teman saat ulang tahun). Posisi ★ (ke-2) diisi oleh ④きれいな.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `雨が ＿＿＿ ＿＿＿ ★ ＿＿＿ 試合は中止になりました。`, choices: [`④朝から`, `③きたので`, `①強く`, `②降って`], a: 3, explanation: `Susunan: ④朝から①強く②降って③きたので試合は中止になりました (Karena sejak pagi hujan turun deras, pertandingan dibatalkan). Posisi ★ (ke-3) diisi oleh ②降って.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `この部屋は ＿＿＿ ★ ＿＿＿ ＿＿＿ 勉強しやすいです。`, choices: [`②明るくて`, `④広くて`, `①静かで`, `③とても`], a: 2, explanation: `Susunan: ③とても①静かで②明るくて④広くて勉強しやすいです (Karena sangat tenang, terang, dan luas, ruangan ini mudah untuk belajar). Posisi ★ (ke-2) diisi oleh ①静かで.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `彼は ＿＿＿ ★ ＿＿＿ ＿＿＿ 国の人です。`, choices: [`②遠い`, `③とても`, `④離れた`, `①日本から`], a: 0, explanation: `Susunan: ①日本から③とても④離れた②遠い国の人です (Dia orang dari negara yang sangat jauh terpisah dari Jepang). Posisi ★ (ke-2) diisi oleh ②遠い sesuai kunci jawaban.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `祖母は ＿＿＿ ＿＿＿ ★ ＿＿＿ 元気です。`, choices: [`②とっても`, `④とった`, `①年を`, `③とても`], a: 3, explanation: `Susunan: ①年を④とった③とても②とっても元気です (Meski nenek sudah lanjut usia, beliau tetap sangat sehat). Posisi ★ (ke-3) diisi oleh ③とても.`, passage: ``, sectionLabel: `文法 · Menyusun Kalimat (★)`, problemNumber: 6 },
            { q: `「わたしの一日」: それから、シャワーを（41）、朝ご飯を食べます。`, choices: [`浴びるので`, `浴びたり`, `浴びれば`, `浴びて`], a: 3, explanation: `Bentuk ～て digunakan untuk menghubungkan dua kegiatan berurutan: シャワーを浴びて、朝ご飯を食べます (mandi shower, lalu makan sarapan).`, passage: `<p style="font-weight:700;margin-bottom:6px;">わたしの一日</p><p style="white-space:normal;line-height:1.9;">わたしは毎朝六時に起きます。それから、シャワーを（41）、朝ご飯を食べます。七時半に家を出て、学校へ行きます。学校は家から（42）三十分ぐらいです。授業は九時から始まって、三時半に終わります。授業が終わった（43）、友達と図書館で勉強します。図書館は静かなので、勉強（44）です。夜、家に帰ってから晩ご飯を食べて、宿題をします。宿題が終わったら、少しテレビを見て、十一時に寝ます。毎日忙しいですが、（45）楽しいです。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「わたしの一日」: 学校は家から（42）三十分ぐらいです。`, choices: [`歩いても`, `歩けば`, `歩くと`, `歩いて`], a: 3, explanation: `Pola '～て+ durasi' menyatakan cara/metode menuju suatu tempat beserta lama waktunya: 歩いて三十分 (kalau jalan kaki, sekitar tiga puluh menit).`, passage: `<p style="font-weight:700;margin-bottom:6px;">わたしの一日</p><p style="white-space:normal;line-height:1.9;">わたしは毎朝六時に起きます。それから、シャワーを（41）、朝ご飯を食べます。七時半に家を出て、学校へ行きます。学校は家から（42）三十分ぐらいです。授業は九時から始まって、三時半に終わります。授業が終わった（43）、友達と図書館で勉強します。図書館は静かなので、勉強（44）です。夜、家に帰ってから晩ご飯を食べて、宿題をします。宿題が終わったら、少しテレビを見て、十一時に寝ます。毎日忙しいですが、（45）楽しいです。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「わたしの一日」: 授業が終わった（43）、友達と図書館で勉強します。`, choices: [`まえに`, `ときに`, `うちに`, `あとで`], a: 3, explanation: `あとで berarti 'setelah': 終わったあとで (setelah pelajaran selesai), lalu belajar bersama teman di perpustakaan.`, passage: `<p style="font-weight:700;margin-bottom:6px;">わたしの一日</p><p style="white-space:normal;line-height:1.9;">わたしは毎朝六時に起きます。それから、シャワーを（41）、朝ご飯を食べます。七時半に家を出て、学校へ行きます。学校は家から（42）三十分ぐらいです。授業は九時から始まって、三時半に終わります。授業が終わった（43）、友達と図書館で勉強します。図書館は静かなので、勉強（44）です。夜、家に帰ってから晩ご飯を食べて、宿題をします。宿題が終わったら、少しテレビを見て、十一時に寝ます。毎日忙しいですが、（45）楽しいです。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「わたしの一日」: 図書館は静かなので、勉強（44）です。`, choices: [`しにくい`, `してほしい`, `したい`, `しやすい`], a: 3, explanation: `Pola ～やすい berarti 'mudah untuk melakukan': 勉強しやすい (mudah untuk belajar), sesuai dengan alasan perpustakaan yang tenang.`, passage: `<p style="font-weight:700;margin-bottom:6px;">わたしの一日</p><p style="white-space:normal;line-height:1.9;">わたしは毎朝六時に起きます。それから、シャワーを（41）、朝ご飯を食べます。七時半に家を出て、学校へ行きます。学校は家から（42）三十分ぐらいです。授業は九時から始まって、三時半に終わります。授業が終わった（43）、友達と図書館で勉強します。図書館は静かなので、勉強（44）です。夜、家に帰ってから晩ご飯を食べて、宿題をします。宿題が終わったら、少しテレビを見て、十一時に寝ます。毎日忙しいですが、（45）楽しいです。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「わたしの一日」: 毎日忙しいですが、（45）楽しいです。`, choices: [`とても`, `けっして`, `あまり`, `ぜんぜん`], a: 0, explanation: `とても berarti 'sangat' dan cocok untuk pernyataan positif '(meski sibuk) tapi sangat menyenangkan'. ぜんぜん, あまり, dan けっして biasanya diikuti bentuk negatif.`, passage: `<p style="font-weight:700;margin-bottom:6px;">わたしの一日</p><p style="white-space:normal;line-height:1.9;">わたしは毎朝六時に起きます。それから、シャワーを（41）、朝ご飯を食べます。七時半に家を出て、学校へ行きます。学校は家から（42）三十分ぐらいです。授業は九時から始まって、三時半に終わります。授業が終わった（43）、友達と図書館で勉強します。図書館は静かなので、勉強（44）です。夜、家に帰ってから晩ご飯を食べて、宿題をします。宿題が終わったら、少しテレビを見て、十一時に寝ます。毎日忙しいですが、（45）楽しいです。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「山田さんへのメール」: 来週の土曜日、誕生日パーティーを（41）と思っています。`, choices: [`して`, `しない`, `しよう`, `した`], a: 2, explanation: `Pola '～（よ）うと思う' menyatakan niat/rencana: パーティーをしようと思っています (bermaksud mengadakan pesta).`, passage: `<p style="font-weight:700;margin-bottom:6px;">山田さんへのメール</p><p style="white-space:normal;line-height:1.9;">山田さん<br><br>お元気ですか。来週の土曜日、わたしの誕生日パーティーを（41）と思っています。よかったら、来て（42）でしょうか。場所はわたしの家です。時間は午後六時からです。パーティーには田中さんや鈴木さん（43）来る予定です。何か食べたい物が（44）、教えてください。準備しておきます。それでは、土曜日（45）お待ちしています。<br><br>田中</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「山田さんへのメール」: よかったら、来て（42）でしょうか。`, choices: [`くれない`, `いただけない`, `あげられない`, `もらわない`], a: 1, explanation: `～ていただけないでしょうか adalah bentuk sopan untuk meminta tolong dengan halus: 来ていただけないでしょうか (bolehkah Anda datang?).`, passage: `<p style="font-weight:700;margin-bottom:6px;">山田さんへのメール</p><p style="white-space:normal;line-height:1.9;">山田さん<br><br>お元気ですか。来週の土曜日、わたしの誕生日パーティーを（41）と思っています。よかったら、来て（42）でしょうか。場所はわたしの家です。時間は午後六時からです。パーティーには田中さんや鈴木さん（43）来る予定です。何か食べたい物が（44）、教えてください。準備しておきます。それでは、土曜日（45）お待ちしています。<br><br>田中</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「山田さんへのメール」: パーティーには田中さんや鈴木さん（43）来る予定です。`, choices: [`しか`, `ばかり`, `なども`, `だけ`], a: 2, explanation: `など (dan lain-lain) menunjukkan daftar contoh yang tidak lengkap/masih ada yang lain: 田中さんや鈴木さんなども来る予定 (Tanaka, Suzuki, dan lain-lain juga akan datang).`, passage: `<p style="font-weight:700;margin-bottom:6px;">山田さんへのメール</p><p style="white-space:normal;line-height:1.9;">山田さん<br><br>お元気ですか。来週の土曜日、わたしの誕生日パーティーを（41）と思っています。よかったら、来て（42）でしょうか。場所はわたしの家です。時間は午後六時からです。パーティーには田中さんや鈴木さん（43）来る予定です。何か食べたい物が（44）、教えてください。準備しておきます。それでは、土曜日（45）お待ちしています。<br><br>田中</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「山田さんへのメール」: 何か食べたい物が（44）、教えてください。`, choices: [`あったら`, `あるなら`, `あると`, `あっても`], a: 0, explanation: `～たら menyatakan syarat 'kalau ada': 食べたい物があったら、教えてください (kalau ada makanan yang ingin dimakan, tolong beri tahu).`, passage: `<p style="font-weight:700;margin-bottom:6px;">山田さんへのメール</p><p style="white-space:normal;line-height:1.9;">山田さん<br><br>お元気ですか。来週の土曜日、わたしの誕生日パーティーを（41）と思っています。よかったら、来て（42）でしょうか。場所はわたしの家です。時間は午後六時からです。パーティーには田中さんや鈴木さん（43）来る予定です。何か食べたい物が（44）、教えてください。準備しておきます。それでは、土曜日（45）お待ちしています。<br><br>田中</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「山田さんへのメール」: 土曜日（45）お待ちしています。`, choices: [`を`, `に`, `が`, `で`], a: 1, explanation: `Partikel に digunakan untuk menandai waktu tertentu: 土曜日に (pada hari Sabtu) お待ちしています (menunggu kedatangan Anda).`, passage: `<p style="font-weight:700;margin-bottom:6px;">山田さんへのメール</p><p style="white-space:normal;line-height:1.9;">山田さん<br><br>お元気ですか。来週の土曜日、わたしの誕生日パーティーを（41）と思っています。よかったら、来て（42）でしょうか。場所はわたしの家です。時間は午後六時からです。パーティーには田中さんや鈴木さん（43）来る予定です。何か食べたい物が（44）、教えてください。準備しておきます。それでは、土曜日（45）お待ちしています。<br><br>田中</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「駅前の新しいスーパー」: 先月、駅前に新しいスーパーが（41）。`, choices: [`できるでしょう`, `できていました`, `できています`, `できました`], a: 3, explanation: `できました (bentuk lampau dari できる=terbentuk/berdiri) sesuai dengan keterangan waktu 先月 (bulan lalu): supermarket baru itu (baru saja) berdiri bulan lalu.`, passage: `<p style="font-weight:700;margin-bottom:6px;">駅前の新しいスーパー</p><p style="white-space:normal;line-height:1.9;">先月、駅前に新しいスーパーが（41）。とても便利な場所に（42）ので、毎日たくさんの人が来ます。野菜や果物は近くの農家から（43）いて、新鮮で安いです。夜十時まで開いているので、仕事が（44）あとでも買い物ができます。わたしはこのスーパーが好きで、（45）利用しています。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「駅前の新しいスーパー」: とても便利な場所に（42）ので、毎日たくさんの人が来ます。`, choices: [`あった`, `ある`, `あります`, `あって`], a: 2, explanation: `Bentuk sopan ～ます (あります) digunakan untuk menyatakan fakta keberadaan di masa kini: 便利な場所にあります (terletak di tempat yang strategis), sehingga banyak orang datang setiap hari.`, passage: `<p style="font-weight:700;margin-bottom:6px;">駅前の新しいスーパー</p><p style="white-space:normal;line-height:1.9;">先月、駅前に新しいスーパーが（41）。とても便利な場所に（42）ので、毎日たくさんの人が来ます。野菜や果物は近くの農家から（43）いて、新鮮で安いです。夜十時まで開いているので、仕事が（44）あとでも買い物ができます。わたしはこのスーパーが好きで、（45）利用しています。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「駅前の新しいスーパー」: 野菜や果物は近くの農家から（43）いて、新鮮で安いです。`, choices: [`届けられて`, `届かせて`, `届けて`, `届いて`], a: 3, explanation: `届いて (bentuk intransitif dari 届く=sampai/tiba) menyatakan sayur dan buah 'dikirim/tiba' dari petani sekitar: 農家から届いていて (dikirimkan dari petani setempat), sehingga segar dan murah.`, passage: `<p style="font-weight:700;margin-bottom:6px;">駅前の新しいスーパー</p><p style="white-space:normal;line-height:1.9;">先月、駅前に新しいスーパーが（41）。とても便利な場所に（42）ので、毎日たくさんの人が来ます。野菜や果物は近くの農家から（43）いて、新鮮で安いです。夜十時まで開いているので、仕事が（44）あとでも買い物ができます。わたしはこのスーパーが好きで、（45）利用しています。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「駅前の新しいスーパー」: 夜十時まで開いているので、仕事が（44）あとでも買い物ができます。`, choices: [`終わる`, `終わった`, `終わり`, `終わって`], a: 1, explanation: `Sebelum kata benda あと (setelah), kata kerja harus dalam bentuk lampau biasa: 終わったあとで (setelah pekerjaan selesai), sehingga bisa berbelanja meski selesai kerja larut.`, passage: `<p style="font-weight:700;margin-bottom:6px;">駅前の新しいスーパー</p><p style="white-space:normal;line-height:1.9;">先月、駅前に新しいスーパーが（41）。とても便利な場所に（42）ので、毎日たくさんの人が来ます。野菜や果物は近くの農家から（43）いて、新鮮で安いです。夜十時まで開いているので、仕事が（44）あとでも買い物ができます。わたしはこのスーパーが好きで、（45）利用しています。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `「駅前の新しいスーパー」: わたしはこのスーパーが好きで、（45）利用しています。`, choices: [`めったに`, `よく`, `たまに`, `ぜんぜん`], a: 1, explanation: `よく (sering) cocok dengan pernyataan positif 'suka dan sering menggunakannya'. たまに (kadang-kadang) kurang kuat, めったに dan ぜんぜん biasanya berpasangan dengan bentuk negatif.`, passage: `<p style="font-weight:700;margin-bottom:6px;">駅前の新しいスーパー</p><p style="white-space:normal;line-height:1.9;">先月、駅前に新しいスーパーが（41）。とても便利な場所に（42）ので、毎日たくさんの人が来ます。野菜や果物は近くの農家から（43）いて、新鮮で安いです。夜十時まで開いているので、仕事が（44）あとでも買い物ができます。わたしはこのスーパーが好きで、（45）利用しています。</p>`, sectionLabel: `文法 · Tata Bahasa dalam Bacaan`, problemNumber: 7 },
            { q: `この メールで 一番 伝えたい ことは 何ですか。`, choices: [`会議の部屋が変わったこと。`, `会議の時間が変わったこと。`, `資料が届かなかったこと。`, `会議が中止になったこと。`], a: 0, explanation: `Isi email menyebutkan waktu rapat tetap jam 2 siang, tapi ruangannya berubah menjadi ruang 301 — itulah inti pesan yang paling ditekankan ('気をつけてください' setelah info ruangan berubah). Waktu tidak berubah, resource cadangan hanya disebut untuk berjaga-jaga (bukan berarti resource tidak sampai), dan rapat tidak dibatalkan.`, passage: `<p style="font-weight:700;margin-bottom:6px;">メール（鈴木さんから田中さんへ）</p><p style="white-space:normal;line-height:1.9;">田中さん<br><br>明日の会議の資料を送ります。会議は午後二時からですが、部屋が301号室に変わりましたので、気をつけてください。資料は五枚あります。もし印刷できない場合は、会議室に予備を用意しておきますので、ご安心ください。<br><br>鈴木</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 8 },
            { q: `来月から、図書館は何曜日が休みですか。`, choices: [`火曜日`, `水曜日`, `月曜日`, `土曜日`], a: 0, explanation: `Teks menyebutkan dengan jelas: dulu libur hari Senin, tapi mulai bulan depan libur menjadi hari Selasa (火曜日).`, passage: `<p style="font-weight:700;margin-bottom:6px;">お知らせ（図書館から）</p><p style="white-space:normal;line-height:1.9;">＜図書館からのお知らせ＞<br><br>来月から、図書館の休館日が変わります。今までは月曜日が休みでしたが、来月からは火曜日が休みになります。また、開館時間は午前九時から午後六時までです。ご利用の際はお気をつけください。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 8 },
            { q: `五千円の服を買ったら、いくら払いますか。`, choices: [`六千円`, `五千円`, `四千五百円`, `四千円`], a: 3, explanation: `Diskon 20% berlaku untuk semua pakaian. 20% dari 5000 yen adalah 1000 yen, jadi yang dibayar adalah 5000 - 1000 = 4000 yen.`, passage: `<p style="font-weight:700;margin-bottom:6px;">広告（春の大セール）</p><p style="white-space:normal;line-height:1.9;">【春の大セール】<br><br>三月一日から三月十日まで、店内の洋服が全部二十パーセント引きになります。さらに、五千円以上お買い上げの方には、かわいいバッグをプレゼント！この機会をお見逃しなく。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 8 },
            { q: `ゆきさんは何を聞きたいですか。`, choices: [`夏休みはいつからかどうか。`, `夏休みにおばあちゃんの家に行ってもいいかどうか。`, `おばあちゃんの誕生日はいつか。`, `おばあちゃんは元気かどうか。`], a: 1, explanation: `Surat menyebutkan Yuki ingin menginap sekitar 1 minggu mulai 10 Agustus, dan menanyakan '大丈夫ですか' (apakah tidak apa-apa) serta '都合を教えてください' (tolong beri tahu jika cocok) — artinya ia sedang meminta izin untuk berkunjung/menginap.`, passage: `<p style="font-weight:700;margin-bottom:6px;">手紙（ゆきさんからおばあちゃんへ）</p><p style="white-space:normal;line-height:1.9;">おばあちゃんへ<br><br>元気ですか。わたしは元気です。今度の夏休みに、おばあちゃんの家へ遊びに行きたいです。八月十日から一週間ぐらい泊まりたいのですが、大丈夫ですか。都合を教えてください。<br><br>ゆき</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 8 },
            { q: `七月六日、エレベーターは使えますか。`, choices: [`午後だけ使える。`, `使えない。`, `使える。`, `午前中だけ使える。`], a: 1, explanation: `Perbaikan lift berlangsung dari tanggal 5 sampai 7 Juli, sehingga tanggal 6 Juli termasuk dalam rentang tersebut dan lift tidak bisa digunakan sama sekali pada hari itu.`, passage: `<p style="font-weight:700;margin-bottom:6px;">掲示（エレベーター工事のお知らせ）</p><p style="white-space:normal;line-height:1.9;">＜エレベーター工事のお知らせ＞<br><br>七月五日から七月七日まで、エレベーターの点検工事を行います。この間、エレベーターは使えません。ご不便をおかけしますが、階段をご利用ください。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 8 },
            { q: `この人は今日、公園で何をしましたか。`, choices: [`写真をとった。`, `本を読んだ。`, `お弁当を食べた。`, `サッカーをした。`], a: 2, explanation: `Teks menyebutkan penulis membawa bekal (お弁当) dan memakannya di bawah pohon sambil menikmati bunga sakura, jadi jawabannya adalah makan bekal.`, passage: `<p style="font-weight:700;margin-bottom:6px;">ブログ（お花見）</p><p style="white-space:normal;line-height:1.9;">今日は久しぶりに公園に行きました。桜がとてもきれいに咲いていて、たくさんの人がお花見をしていました。わたしもお弁当を持って行って、木の下で食べました。とても気持ちがよかったです。来週も天気がよかったら、また行きたいです。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 8 },
            { q: `けんさんのお母さんは、晩ご飯に何を食べますか。`, choices: [`外で買ってきた弁当。`, `レストランの料理。`, `冷蔵庫にあるカレー。`, `けんさんが作った料理。`], a: 2, explanation: `Memo menyebutkan ada kari di kulkas dan meminta ibunya menghangatkan serta memakannya duluan, jadi makan malamnya adalah kari yang ada di kulkas.`, passage: `<p style="font-weight:700;margin-bottom:6px;">メモ（けんさんからお母さんへ）</p><p style="white-space:normal;line-height:1.9;">お母さんへ<br><br>今日は残業で帰りが九時ごろになります。晩ご飯は先に食べていてください。冷蔵庫にカレーがあるので、それを温めて食べてください。<br><br>けん</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 8 },
            { q: `六歳の子供が一人でプールに入ってもいいですか。`, choices: [`いいえ、保護者と一緒でないと入れません。`, `はい、無料で入れます。`, `いいえ、午後しか入れません。`, `はい、一人で入れます。`], a: 0, explanation: `Papan pengumuman menyatakan anak usia SD ke bawah (小学生以下) harus ditemani wali/orang tua. Anak usia 6 tahun termasuk kategori ini, sehingga tidak boleh masuk sendirian.`, passage: `<p style="font-weight:700;margin-bottom:6px;">案内（市民プール）</p><p style="white-space:normal;line-height:1.9;">＜市民プールのご案内＞<br><br>利用時間：午前九時〜午後五時<br>利用料金：おとな三百円　こども百円<br>＊小学生以下は保護者と一緒にご利用ください。</p>`, sectionLabel: `読解 · Bacaan Pendek`, problemNumber: 8 },
            { q: `この人は先週、何をしましたか。`, choices: [`レストランに行った。`, `イタリア料理を作った。`, `タイ料理を作った。`, `料理教室に通った。`], a: 2, explanation: `Teks menyebutkan '先週はタイ料理に挑戦しました' (minggu lalu mencoba membuat masakan Thailand), jadi jawabannya jelas masakan Thailand.`, passage: `<p style="font-weight:700;margin-bottom:6px;">エッセイ（料理）</p><p style="white-space:normal;line-height:1.9;">わたしは料理が好きです。特に、週末に時間があるとき、いろいろな国の料理を作ってみます。先週はタイ料理に挑戦しました。スーパーで材料を買って、インターネットでレシピを調べながら作りました。初めて作ったので、少し辛くなりすぎてしまいましたが、家族はおいしいと言ってくれました。今度はもっと上手に作れるように、練習したいと思います。来月はイタリア料理に挑戦する予定です。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 9 },
            { q: `この人は来月、何をする予定ですか。`, choices: [`料理教室に通う。`, `レストランを開く。`, `タイ料理をもう一度作る。`, `イタリア料理を作る。`], a: 3, explanation: `Kalimat terakhir menyebutkan '来月はイタリア料理に挑戦する予定です' (bulan depan berencana mencoba masakan Italia).`, passage: `<p style="font-weight:700;margin-bottom:6px;">エッセイ（料理）</p><p style="white-space:normal;line-height:1.9;">わたしは料理が好きです。特に、週末に時間があるとき、いろいろな国の料理を作ってみます。先週はタイ料理に挑戦しました。スーパーで材料を買って、インターネットでレシピを調べながら作りました。初めて作ったので、少し辛くなりすぎてしまいましたが、家族はおいしいと言ってくれました。今度はもっと上手に作れるように、練習したいと思います。来月はイタリア料理に挑戦する予定です。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 9 },
            { q: `電車の中で電話で話さないのはなぜですか。`, choices: [`お金がかかるから。`, `電波が悪いから。`, `ほかの人の迷惑になるから。`, `禁止されているから。`], a: 2, explanation: `Teks menyebutkan menelepon di kereta 'ほかの人の迷惑になる' (mengganggu orang lain), itulah sebabnya jarang dilakukan — bukan karena dilarang secara resmi, biaya, atau sinyal buruk.`, passage: `<p style="font-weight:700;margin-bottom:6px;">説明文（電車やバスのマナー）</p><p style="white-space:normal;line-height:1.9;">日本では、電車やバスの中でマナーがとても大切にされています。例えば、電話で話すことは、ほかの人の迷惑になるので、あまりしません。また、席に座っているときは、荷物をひざの上に置いて、隣の人のじゃまにならないようにします。お年寄りや体の不自由な人が乗ってきたら、席をゆずることも大切なマナーの一つです。こうしたマナーを守ることで、みんなが気持ちよく電車やバスを利用できます。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 9 },
            { q: `この文章の内容と合っているのはどれですか。`, choices: [`バスにはマナーがない。`, `電車の中では荷物を必ず網棚に置く。`, `電車の中では話してはいけない。`, `お年寄りが乗ってきたら、席をゆずったほうがいい。`], a: 3, explanation: `Teks menyebutkan bahwa memberi tempat duduk kepada orang tua/lansia atau penyandang disabilitas adalah salah satu etika penting (席をゆずることも大切なマナー). Opsi lain tidak sesuai dengan isi teks (teks tidak melarang total bicara, tidak mewajibkan barang ditaruh di rak, dan bus juga disebut punya etika yang sama).`, passage: `<p style="font-weight:700;margin-bottom:6px;">説明文（電車やバスのマナー）</p><p style="white-space:normal;line-height:1.9;">日本では、電車やバスの中でマナーがとても大切にされています。例えば、電話で話すことは、ほかの人の迷惑になるので、あまりしません。また、席に座っているときは、荷物をひざの上に置いて、隣の人のじゃまにならないようにします。お年寄りや体の不自由な人が乗ってきたら、席をゆずることも大切なマナーの一つです。こうしたマナーを守ることで、みんなが気持ちよく電車やバスを利用できます。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 9 },
            { q: `この人は何に困っていますか。`, choices: [`駐輪場に自転車を止められないこと。`, `電車が時間通りに来ないこと。`, `駅前に店が少ないこと。`, `駅までの道が遠いこと。`], a: 0, explanation: `Penulis mengeluhkan tempat parkir sepeda di depan stasiun selalu penuh sehingga sulit memarkir sepeda, terutama saat pagi hari sedang buru-buru.`, passage: `<p style="font-weight:700;margin-bottom:6px;">投書（駅前の駐輪場について）</p><p style="white-space:normal;line-height:1.9;">わたしは駅前の駐輪場について、意見があります。最近、駅前の駐輪場がいつもいっぱいで、自転車を止められないことが多いです。朝、急いでいるときに止める場所がないと、とても困ります。市には、もっと駐輪場を増やしてほしいと思います。自転車で駅まで来る人が増えているので、これからも駐輪場の問題は大きくなると思います。早く対策をとってもらいたいです。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 9 },
            { q: `この人が市にしてほしいことは何ですか。`, choices: [`駅を新しく作ること。`, `駐輪場を増やすこと。`, `電車の本数を増やすこと。`, `自転車の値段を安くすること。`], a: 1, explanation: `Penulis secara eksplisit menulis '市には、もっと駐輪場を増やしてほしいと思います' (berharap pemerintah kota menambah tempat parkir sepeda).`, passage: `<p style="font-weight:700;margin-bottom:6px;">投書（駅前の駐輪場について）</p><p style="white-space:normal;line-height:1.9;">わたしは駅前の駐輪場について、意見があります。最近、駅前の駐輪場がいつもいっぱいで、自転車を止められないことが多いです。朝、急いでいるときに止める場所がないと、とても困ります。市には、もっと駐輪場を増やしてほしいと思います。自転車で駅まで来る人が増えているので、これからも駐輪場の問題は大きくなると思います。早く対策をとってもらいたいです。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 9 },
            { q: `両親はどうしてなかなか犬を飼わせてくれませんでしたか。`, choices: [`お金がなかったから。`, `マンションに住んでいたから。`, `この人が忙しかったから。`, `犬が嫌いだったから。`], a: 1, explanation: `Cerita menyebutkan orang tuanya tinggal di apartemen (マンション) sehingga sulit mengizinkan memelihara anjing, hingga akhirnya pindah ke rumah tapak (一軒家).`, passage: `<p style="font-weight:700;margin-bottom:6px;">物語（犬を飼いたい）</p><p style="white-space:normal;line-height:1.9;">子供のころ、わたしは犬を飼いたくてしかたがありませんでした。しかし、両親はマンションに住んでいたので、なかなか許してくれませんでした。毎年、誕生日に「犬を飼いたい」とお願いしましたが、答えはいつも「もう少し大きくなってから」でした。中学生になったとき、家族で一軒家に引っ越すことになりました。その時、両親は「これでやっと犬を飼えるね」と言ってくれました。わたしは飛び上がるほどうれしかったです。それから今まで、うちには犬がいます。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 9 },
            { q: `この人はいつうれしいと思いましたか。`, choices: [`一軒家に引っ越して、犬を飼えると言われたとき。`, `中学校に入学したとき。`, `誕生日に犬をもらったとき。`, `マンションに引っ越したとき。`], a: 0, explanation: `Cerita menyebutkan saat pindah ke rumah tapak sewaktu SMP, orang tuanya berkata 'sekarang akhirnya bisa memelihara anjing', dan penulis merasa sangat senang saat itu (kalimat 'とび上がるほどうれしかった').`, passage: `<p style="font-weight:700;margin-bottom:6px;">物語（犬を飼いたい）</p><p style="white-space:normal;line-height:1.9;">子供のころ、わたしは犬を飼いたくてしかたがありませんでした。しかし、両親はマンションに住んでいたので、なかなか許してくれませんでした。毎年、誕生日に「犬を飼いたい」とお願いしましたが、答えはいつも「もう少し大きくなってから」でした。中学生になったとき、家族で一軒家に引っ越すことになりました。その時、両親は「これでやっと犬を飼えるね」と言ってくれました。わたしは飛び上がるほどうれしかったです。それから今まで、うちには犬がいます。</p>`, sectionLabel: `読解 · Bacaan Menengah`, problemNumber: 9 },
